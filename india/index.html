<script>
// ── CSV fetch/parse (same pattern as the main EV SPORTS CMS) ──────────────
function parseCSV(text) {
  const rows = []; let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i+1];
    if (inQ) {
      if (ch === '"' && nx === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\r' && nx === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; i++; }
      else if (ch === '\n' || ch === '\r') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows.filter(r => r.some(c => c));
}
function toObj(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9_]/g,'_').replace(/__+/g,'_').replace(/^_|_$/g,''));
  return rows.slice(1).map(r => { const o = {}; headers.forEach((h,i) => o[h] = (r[i]||'').trim()); return o; });
}
async function fetchSheet(name) {
  if (!SHEET_ID || SHEET_ID === 'YOUR_SPREADSHEET_ID_HERE') { console.warn('SHEET_ID not set'); return null; }
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return toObj(parseCSV(await r.text()));
  } catch(e) { console.warn(`Sheet "${name}" failed:`, e); return null; }
}

const ACTIVE_FLAG_KEYS = ['active_true_false','active','is_active','isactive','enabled','show','visible'];
function isRowActive(r) {
  let raw = '';
  for (const k of ACTIVE_FLAG_KEYS) { if (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') { raw = r[k]; break; } }
  const a = String(raw).trim().replace(/^['"]+|['"]+$/g,'').toUpperCase();
  return a !== 'FALSE' && a !== 'NO' && a !== 'N' && a !== '0' && a !== 'OFF';
}

// ── India filter — matches "india" anywhere, or the bare "ind" code ───────
function isIndiaText(t) {
  t = String(t || '').trim(); if (!t) return false;
  return /india/i.test(t) || /\bind\b/i.test(t);
}
function isIndiaMatch(m) {
  return isIndiaText(m.team1_code) || isIndiaText(m.team2_code) ||
         isIndiaText(m.team1_full_name) || isIndiaText(m.team2_full_name) ||
         isIndiaText(m.details) || isIndiaText(m.game) || isIndiaText(m.country);
}

function img(src, alt) { return src ? `<img src="${src}" alt="${alt||''}" onerror="this.style.display='none'">` : ''; }

function matchStatusText(m) {
  const s = (m.status || '').trim().toLowerCase();
  if (s === 'live') return 'live';
  if (s === 'finished' || s === 'completed') return 'finished';
  return 'upcoming';
}

function getServers(m) {
  const raw = [
    { url: m.btn_url,   text: m.btn_text   || 'Server 1' },
    { url: m.btn_url_2, text: m.btn_text_2 || 'Server 2' },
    { url: m.btn_url_3, text: m.btn_text_3 || 'Server 3' },
    { url: m.btn_url_4, text: m.btn_text_4 || 'Server 4' },
    { url: m.btn_url_5, text: m.btn_text_5 || 'Server 5' }
  ];
  return raw.filter(s => s.url && String(s.url).trim() && String(s.url).trim() !== '#');
}

let _matches = [];

function mcardHtml(m, idx) {
  const status = matchStatusText(m);
  const badge = status === 'live'
    ? `<span class="mcard-badge live"><span class="dot"></span>LIVE</span>`
    : status === 'finished'
    ? `<span class="mcard-badge finished">FINISHED</span>`
    : `<span class="mcard-badge upcoming">⏰ UPCOMING</span>`;
  const countdown = (status === 'upcoming' && (m.countdown_to_iso_datetime || m.countdown_to))
    ? `<div class="mcard-cd"><span class="lbl">STARTS IN</span><span id="cd-${idx}">--:--:--</span></div>` : '';
  return `
  <div class="mcard" onclick="openMatch(${idx})">
    <div class="mcard-top">
      ${badge}
      <div class="mcard-teams">
        <div class="mcard-team">${img(m.team1_logo_url, m.team1_code)}<div class="mcard-code">${m.team1_code||''}</div></div>
        <div class="mcard-vs">VS</div>
        <div class="mcard-team">${img(m.team2_logo_url, m.team2_code)}<div class="mcard-code">${m.team2_code||''}</div></div>
      </div>
    </div>
    <div class="mcard-body">
      <div class="mcard-names">${m.team1_full_name||m.team1_code||''} vs ${m.team2_full_name||m.team2_code||''}</div>
      <div class="mcard-meta"><span class="mcard-tag">${m.game || 'Cricket'}</span><span>${m.date_label || ''}</span></div>
      ${countdown}
      <button class="mcard-watch" onclick="event.stopPropagation();openMatch(${idx})">▶ Watch Now</button>
    </div>
  </div>`;
}

function renderHero(liveList, upcomingList) {
  const heroM = liveList[0] || upcomingList[0];
  const sec = document.getElementById('heroSection');
  if (!heroM) { sec.classList.remove('show'); return; }
  const idx = _matches.indexOf(heroM);
  const status = matchStatusText(heroM);
  document.getElementById('heroBg').style.backgroundImage = `url('${heroM.team1_logo_url || heroM.team2_logo_url || ''}')`;
  document.getElementById('heroBadge').className = 'hero-badge ' + (status === 'live' ? 'live' : 'upcoming');
  document.getElementById('heroBadge').textContent = status === 'live' ? '🔴 LIVE NOW' : '⏰ UPCOMING';
  document.getElementById('heroT1Img').src = heroM.team1_logo_url || '';
  document.getElementById('heroT2Img').src = heroM.team2_logo_url || '';
  document.getElementById('heroT1').textContent = heroM.team1_code || heroM.team1_full_name || '';
  document.getElementById('heroT2').textContent = heroM.team2_code || heroM.team2_full_name || '';
  document.getElementById('heroMeta').innerHTML =
    `<span>🏏 ${heroM.game || 'Cricket'}</span>` +
    (heroM.date_label ? `<span>🗓 ${heroM.date_label}</span>` : '') +
    (heroM.details ? `<span>${heroM.details}</span>` : '');
  document.getElementById('heroCta').onclick = () => openMatch(idx);
  sec.classList.add('show');
}

function render(rows) {
  const rails = document.getElementById('rails');
  if (!rows) { rails.innerHTML = `<div class="empty-box"><span class="big">Couldn't load matches</span>Check the sheet is published &amp; shared.</div>`; document.getElementById('heroSection').classList.remove('show'); return; }

  _matches = rows.filter(isRowActive).filter(isIndiaMatch);

  if (!_matches.length) {
    rails.innerHTML = `<div class="empty-box"><span class="big">No India matches right now 🇮🇳</span>Check back soon.</div>`;
    document.getElementById('heroSection').classList.remove('show');
    document.getElementById('liveCount').textContent = '0 LIVE';
    return;
  }

  const live = _matches.filter(m => matchStatusText(m) === 'live');
  const upcoming = _matches.filter(m => matchStatusText(m) === 'upcoming');
  const finished = _matches.filter(m => matchStatusText(m) === 'finished');

  document.getElementById('liveCount').textContent = `${live.length} LIVE`;
  renderHero(live, upcoming);

  let html = '';
  const rail = (title, cls, list) => {
    if (!list.length) return;
    html += `<div class="rail">
      <div class="rail-head"><span class="rail-title ${cls}">${title}</span><span class="rail-count">${list.length}</span></div>
      <div class="rail-track">${list.map(m => mcardHtml(m, _matches.indexOf(m))).join('')}</div>
    </div>`;
  };
  rail('🔴 Live Now', 'live', live);
  rail('⏰ Upcoming', 'upcoming', upcoming);
  rail('✅ Finished', 'finished', finished);
  rails.innerHTML = html;

  _matches.forEach((m, i) => {
    if (matchStatusText(m) === 'upcoming') startCountdown(i, m.countdown_to_iso_datetime || m.countdown_to);
  });
}

function startCountdown(i, target) {
  if (!target) return;
  const t = new Date(target).getTime();
  if (isNaN(t)) return;
  const tick = () => {
    const elm = document.getElementById('cd-' + i);
    if (!elm) return; // card no longer in DOM
    const diff = t - Date.now();
    if (diff <= 0) { elm.textContent = 'LIVE'; return; }
    const h = Math.floor(diff/3600000), mnt = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    elm.textContent = `${String(h).padStart(2,'0')}:${String(mnt).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    setTimeout(tick, 1000);
  };
  tick();
}

function openMatch(i) {
  const m = _matches[i];
  if (!m) return;
  const servers = getServers(m);
  const name = `${m.team1_code||m.team1_full_name||''} vs ${m.team2_code||m.team2_full_name||''}`;
  document.getElementById('playerTitle').textContent = name;
  const list = document.getElementById('serverList');
  if (!servers.length) {
    list.innerHTML = '';
    document.getElementById('playerFrame').src = 'about:blank';
    alert('No stream server configured for this match yet.');
    return;
  }
  list.innerHTML = `<div class="server-list-title">SERVERS</div>` + servers.map((s, idx) =>
    `<button class="server-btn${idx===0?' active':''}" data-idx="${idx}" onclick="pickServer(this,'${encodeURIComponent(s.url)}')">${s.text}</button>`
  ).join('');
  document.getElementById('playerFrame').src = servers[0].url;
  document.getElementById('playerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function pickServer(btn, encUrl) {
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('playerFrame').src = decodeURIComponent(encUrl);
}
function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

let _splashDismissed = false;
async function load() {
  const rows = await fetchSheet('MATCH CARDS');
  render(rows);
  if (!_splashDismissed) {
    _splashDismissed = true;
    const s = document.getElementById('splash');
    if (s) setTimeout(() => s.classList.add('hide'), 350);
  }
}
load();
setInterval(load, 30000); // keep matches/countdowns/live-status fresh
</script>
