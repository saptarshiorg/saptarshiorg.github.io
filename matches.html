      <div class="smo-section">

        <div class="sk-match-card"></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6m0 4h.01"/></svg>
    <p>No matches scheduled at the moment.</p>
  </div>

<script>
// Load Google Sheets data
async function loadSheetData(sheetId, tabName) {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${tabName}`;
    const response = await fetch(url);
    const text = await response.text();
    const json = JSON.parse(text.slice(47, -2));
    const rows = [];
    json.table.rows.forEach(row => {
      const obj = {};
      row.c.forEach((cell, i) => {
        obj[json.table.cols[i].label] = cell ? cell.v : '';
      });
      rows.push(obj);
    });
    return rows;
  } catch(e) {
    console.error('Sheet load error:', e);
    return [];
  }
}

let matchesData = [];
let sportsList = [];
let eventsList = [];
let selectedSport = null;
let selectedEvent = null;

async function initMatches() {
  matchesData = await loadSheetData(SHEET_ID, 'MATCH CARDS');
  
  // Extract unique sports
  sportsList = [...new Set(matchesData.filter(m => m.sport_name).map(m => m.sport_name))];
  
  if (sportsList.length === 0) {
    document.getElementById('no-matches').style.display = 'block';
    return;
  }

  // Build sport tabs
  const sportToolbar = document.getElementById('smo-sport-toolbar');
  const sportTabs = document.getElementById('smo-sport-tabs');
  
  sportsList.forEach((sport, idx) => {
    const tab = document.createElement('button');
    tab.className = 'smo-sport-tab' + (idx === 0 ? ' active' : '');
    tab.textContent = sport;
    tab.onclick = () => selectSport(sport);
    sportTabs.appendChild(tab);
  });
  
  sportToolbar.style.display = 'flex';
  selectedSport = sportsList[0];
  renderMatches();
}

function selectSport(sport) {
  selectedSport = sport;
  
  // Update active tab
  document.querySelectorAll('.smo-sport-tab').forEach(tab => {
    tab.classList.toggle('active', tab.textContent === sport);
  });
  
  renderMatches();
}

function renderMatches() {
  const overlay = document.getElementById('match-overlay');
  const section = overlay.querySelector('.smo-section') || overlay;
  
  const filtered = matchesData.filter(m => !selectedSport || m.sport_name === selectedSport);
  
  if (filtered.length === 0) {
    section.innerHTML = '<div class="no-matches" style="grid-column:1/-1;"><p>No matches for this sport.</p></div>';
    return;
  }

  let html = '<div class="smo-section">';
  
  filtered.forEach(match => {
    const isLive = match.status && match.status.toLowerCase().includes('live');
    const timeStr = match.match_time || 'TBD';
    const team1 = match.team_1 || 'Team 1';
    const team2 = match.team_2 || 'Team 2';
    const score1 = match.score_1 || '-';
    const score2 = match.score_2 || '-';
    
    html += `
      <div class="match-card ${isLive ? 'live' : ''}" onclick="openMatch('${match.watch_url || '#'}')">
        <div class="match-card-time">${timeStr}</div>
        <div class="match-card-sport">${match.sport_name || 'SPORT'}</div>
        
        <div class="match-card-teams">
          <div class="team">
            <div class="team-logo">${team1.charAt(0).toUpperCase()}</div>
            <span>${team1}</span>
          </div>
          <div class="match-card-score">
            <div class="score-value">${score1} - ${score2}</div>
          </div>
          <div class="team">
            <div class="team-logo">${team2.charAt(0).toUpperCase()}</div>
            <span>${team2}</span>
          </div>
        </div>
        
        <div class="match-card-status">
          ${match.status || (isLive ? '🔴 LIVE' : 'UPCOMING')}
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  section.innerHTML = html;
}

function openMatch(url) {
  if (url && url !== '#') {
    window.location.href = url;
  }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', initMatches);
</script>
