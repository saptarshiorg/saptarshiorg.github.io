<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Stream Player</title>

  <!-- Frameworks & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Shaka Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css" />

  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; background-color:#000!important; overflow:hidden; }
    .shaka-video-container, .shaka-video-container video { width:100%; height:100%; background:#000; object-fit:contain; }
    .shaka-video-container:fullscreen, .shaka-video-container:-webkit-full-screen,
    .shaka-video-container:-moz-full-screen, .shaka-video-container:-ms-fullscreen {
      position: fixed !important; top:0 !important; left:0 !important; width:100vw !important; height:100vh !important;
    }
    video { transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  </style>
</head>
<body class="bg-black text-white m-0 p-0 w-screen h-screen font-sans">

<div id="video-container" class="relative w-full h-full flex items-center justify-center bg-black overflow-hidden">

  <!-- Loader -->
  <div id="loader" class="absolute inset-0 bg-black/90 z-[2000] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="text-7xl animate-spin text-cyan-400 drop-shadow-[0_0_25px_#00d2ff]">❄️</div>
    <div class="loading-text mt-4 text-sm tracking-widest text-gray-300 uppercase animate-pulse">LOADING STREAM...</div>
  </div>

  <!-- Unmute Overlay -->
  <button id="unmute-overlay" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[1500] btn btn-danger rounded-pill px-4 py-2 font-bold shadow-lg animate-bounce">
    <span class="material-icons-round align-middle me-1">volume_off</span> TAP TO UNMUTE
  </button>

  <!-- Shaka Video Container -->
  <div id="controls" class="absolute inset-0 z-10">
    <video id="video" class="w-full h-full object-contain" autoplay muted playsinline></video>
  </div>

  <!-- Logo Panel (hidden until set) -->
  <div id="channel-logo" class="absolute top-4 right-4 z-[1000] bg-dark/70 backdrop-blur-md border border-white/10 rounded-3 px-3 py-2 flex items-center justify-center" style="display:none;">
    <img id="logo-img" class="h-8 max-w-[120px] object-contain" src="" alt="Logo">
  </div>

  <!-- Switch to JW Player Button -->
  <button id="jw-button" class="absolute top-4 left-4 z-[1000] btn btn-outline-light btn-sm backdrop-blur-md border-white/20 d-flex align-items-center gap-2 shadow">
    <span class="material-icons-round text-base">open_in_new</span>
    <span>Switch Player (JW)</span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const loader = document.getElementById('loader');
  const unmuteBtn = document.getElementById('unmute-overlay');
  const channelLogo = document.getElementById('channel-logo');
  const logoImg = document.getElementById('logo-img');
  const json_url = "https://sonujson-devloper.vercel.app/Data/prime.json";

  function toggleLoader(show, text = "LOADING STREAM...") {
    if (show) {
      document.querySelector('.loading-text').textContent = text;
      loader.classList.remove('opacity-0','pointer-events-none'); loader.classList.add('opacity-100','pointer-events-auto');
    } else {
      loader.classList.remove('opacity-100','pointer-events-auto'); loader.classList.add('opacity-0','pointer-events-none');
    }
  }
  function showUnmuteButton(){ unmuteBtn.classList.remove('hidden'); unmuteBtn.classList.add('block'); }
  function hideUnmuteButton(){ unmuteBtn.classList.remove('block'); unmuteBtn.classList.add('hidden'); }

  function parseDRM(drmStr){
    if(!drmStr || !drmStr.includes(':')) return null;
    const parts = drmStr.split(':'); let drmObj = {}; drmObj[parts[0].trim().toLowerCase()] = parts[1].trim().toLowerCase(); return drmObj;
  }

  function getParam(name){ return new URLSearchParams(window.location.search).get(name) || ''; }

  document.addEventListener("DOMContentLoaded", async () => {
    toggleLoader(true, "LOADING STREAM...");

    const idParam = getParam('id') || '';
    const tokenParam = getParam('token') || '';
    const urlParam = getParam('url') || '';
    const drmParam = getParam('drm') || '';
    const titleParam = getParam('title') || '';

    // values we'll use
    let rawUrl = '';
    let rawDrm = '';
    let eventName = titleParam || 'Live Stream';
    let logoSrc = '';

    // Priority: url query param (explicit) > JSON lookup by id > fail
    if (urlParam) {
      rawUrl = decodeURIComponent(urlParam);
      rawDrm = decodeURIComponent(drmParam || '');
      // If id is provided too, we still fetch JSON to get logo/title if available
      if (idParam) {
        try {
          const resp = await fetch(json_url);
          const json = await resp.json();
          const matches = (json && json.Matches) ? json.Matches : [];
          let selected = matches.find(m => String(m.id) === String(idParam)) || null;
          if (selected) {
            eventName = selected.event_name || eventName;
            logoSrc = selected.image || '';
          }
        } catch (e) {
          // non-fatal
          console.warn("JSON fetch for metadata failed:", e);
        }
      }
    } else {
      // No explicit url param -> fetch JSON and pick by id (or first)
      try {
        const resp = await fetch(json_url);
        const json = await resp.json();
        const matches = (json && json.Matches) ? json.Matches : [];
        let selected = null;
        if (idParam) selected = matches.find(m => String(m.id) === String(idParam)) || null;
        if (!selected && matches.length > 0) selected = matches[0];
        if (selected) {
          rawUrl = selected?.CnpTV?.amazon_server || selected?.CnpTV?.cloudfront_server || selected?.CnpTV?.akamai_server || '';
          rawDrm = selected?.drm_key || '';
          eventName = selected?.event_name || eventName;
          logoSrc = selected?.image || '';
        }
      } catch (err) {
        console.error("Failed to fetch or parse JSON:", err);
        toggleLoader(false);
        return;
      }
    }

    // show logo if available
    if (logoSrc) { logoImg.src = logoSrc; channelLogo.style.display = 'flex'; } else { channelLogo.style.display = 'none'; }

    // configure JW Switch (preserve url/drm/title/token)
    const jwButton = document.getElementById("jw-button");
    jwButton.onclick = () => {
      const p = encodeURIComponent;
      let href = `jwplayer.html?`;
      if (rawUrl) href += `url=${p(rawUrl)}&`;
      if (rawDrm) href += `drm=${p(rawDrm)}&`;
      if (eventName) href += `title=${p(eventName)}&`;
      if (tokenParam) href += `token=${p(tokenParam)}`;
      window.location.href = href;
    };

    // Initialize Shaka
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { alert("Browser not supported"); toggleLoader(false); return; }

    const video = document.getElementById("video");
    const uiContainer = document.getElementById("controls");
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, uiContainer, video);

    ui.configure({ controlPanelElements: ["play_pause","time_and_duration","spacer","mute","volume","quality","fullscreen","picture_in_picture"] });

    const playerConfig = {
      streaming: {
        bufferingGoal: 30,
        rebufferingGoal: 5,
        retryParameters: { timeout: 15000, maxAttempts: 3, baseDelay: 500, backoffFactor: 1.5 }
      }
    };

    const parsedDrm = parseDRM(rawDrm);
    if (parsedDrm) playerConfig.drm = { clearKeys: parsedDrm };
    player.configure(playerConfig);

    player.addEventListener('buffering', (event) => { toggleLoader(event.buffering, "BUFFERING..."); });

    const handleResize = () => { window.requestAnimationFrame(() => { video.style.width = '100%'; video.style.height = '100%'; }); };
    window.addEventListener("resize", handleResize);
    window.addEventListener("orientationchange", handleResize);
    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => { handleResize(); setTimeout(handleResize,50); setTimeout(handleResize,300); });
    });

    try {
      if (!rawUrl) { console.error("No stream URL available"); toggleLoader(false); return; }
      await player.load(rawUrl);
      toggleLoader(false);
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => { if (video.muted) showUnmuteButton(); }).catch(() => { showUnmuteButton(); });
      }
    } catch (error) {
      console.error("Shaka error:", error);
      toggleLoader(false);
    }

    unmuteBtn.addEventListener('click', () => { video.muted = false; video.play(); hideUnmuteButton(); });
    video.addEventListener('volumechange', () => { if (!video.muted) hideUnmuteButton(); });
  });
</script>

</body>
</html>
