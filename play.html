<style>
:root{
  --acc:#F0146E;
  --dim:rgba(255,255,255,.72);
  --panel:#1b1d27;
  --pad:clamp(14px,3vw,44px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;outline:none;}
[hidden]{display:none!important;}

#player{position:fixed;inset:0;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transition:transform .3s ease;}
#player.idle{cursor:none;}

/* icon buttons */
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;transition:background .2s,transform .2s;}
.ic svg,.qbtn svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ic svg .f,.qbtn svg .f{fill:currentColor;stroke:none;}
.ic:hover{background:rgba(255,255,255,.14);}
.ic:active{transform:scale(.92);background:rgba(255,255,255,.2);}
.ic:focus-visible,.qbtn:focus-visible,.qopt:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.sk b{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%);font-size:9.5px;font-weight:800;pointer-events:none;}

/* fade logic */
#top,#bot,#mctr{transition:opacity .3s var(--ease);}
#player.idle #top,#player.idle #bot,#player.idle #mctr{opacity:0;}
#player.idle #top *,#player.idle #bot *,#player.idle #mctr *{pointer-events:none!important;}

/* ── top bar ── */
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;isolation:isolate;pointer-events:none;
  padding:max(12px,env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) 0 max(calc(var(--pad) - 8px),env(safe-area-inset-left));}
#top::before{content:"";position:absolute;left:0;right:0;top:0;height:150px;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);}
#top .ic,#top .qbtn,#top google-cast-launcher{pointer-events:auto;}
#ttl{flex:1;min-width:0;font-weight:700;font-size:clamp(14px,1.6vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px;}
.qbtn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;font-weight:700;font-size:16px;transition:background .2s;}
.qbtn:hover,.qbtn.open{background:rgba(255,255,255,.14);}
.qbtn svg{width:24px;height:24px;}
.qbtn .cur{color:var(--dim);font-weight:600;}
google-cast-launcher{--connected-color:var(--acc);--disconnected-color:#fff;width:26px;height:26px;flex-shrink:0;cursor:pointer;margin:0 6px;}

/* ── centre controls (phone) ── */
#mctr{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:20;display:none;align-items:center;justify-content:center;
  gap:clamp(36px,14vw,84px);pointer-events:none;}
#mctr .ic{pointer-events:auto;}
#mctr .sk{width:58px;height:58px;}
#mctr .sk svg{width:42px;height:42px;}
#mctr .sk b{font-size:11px;}
#mctr .pp{width:76px;height:76px;}
#mctr .pp svg{width:54px;height:54px;}
#player.buf #mctr .pp{visibility:hidden;}

/* ── bottom ── */
#bot{position:absolute;left:0;right:0;bottom:0;z-index:20;isolation:isolate;pointer-events:none;
  padding:0 max(var(--pad),env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));}
#bot::before{content:"";position:absolute;left:0;right:0;bottom:0;height:190px;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);}
.srow{display:flex;align-items:center;gap:18px;}
#prog{flex:1;min-width:0;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative;pointer-events:auto;}
#prog.noseek{pointer-events:none;cursor:default;}
.pt{position:relative;width:100%;height:3px;background:rgba(255,255,255,.24);border-radius:9px;transition:height .15s;}
#prog:hover .pt,#prog.drag .pt{height:5px;}
.pbf,.ppl{position:absolute;left:0;top:0;height:100%;width:0;border-radius:inherit;}
.pbf{background:rgba(255,255,255,.38);}
.ppl{background:#fff;}
.pth{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(0,0,0,.5);transition:transform .15s;}
#prog.drag .pth{transform:translate(-50%,-50%) scale(1.25);}
#tm{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
#player.is-live #tm{display:none;}
#player:not(.is-live) .live-pill{display:none;}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;cursor:default;pointer-events:auto;transition:background .2s;}
.live-pill.behind{cursor:pointer;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;}
.ldot{width:8px;height:8px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 8px #ff2d2d;animation:pr 1.6s infinite;flex:none;}
.live-pill.behind .ldot{background:#ff2d2d;animation:none;opacity:.6;box-shadow:none;}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(255,45,45,.65)}70%{box-shadow:0 0 0 8px rgba(255,45,45,0)}100%{box-shadow:0 0 0 0 rgba(255,45,45,0)}}

#crow{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.grp{display:flex;align-items:center;gap:clamp(4px,1.2vw,16px);pointer-events:auto;}
#crow .ic.sk{width:48px;height:48px;}
#crow .ic.sk svg{width:34px;height:34px;}
#crow .ic.pp{width:52px;height:52px;}
#crow .ic.pp svg{width:38px;height:38px;}

/* ── quality menu ── */
#qback{position:absolute;inset:0;z-index:25;display:none;}
#qmenu{position:absolute;z-index:26;display:none;width:240px;max-height:min(70vh,420px);overflow:auto;padding:8px;border-radius:14px;
  background:var(--panel);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.6);
  top:calc(max(12px,env(safe-area-inset-top)) + 56px);right:max(var(--pad),env(safe-area-inset-right));}
#player.qopen #qback{display:block;}
#player.qopen #qmenu{display:block;animation:pop .18s var(--ease);}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98);}}
.qhead{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:8px 10px 6px;}
.qopt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;height:44px;padding:0 12px;border-radius:9px;
  font-size:15px;font-weight:600;color:rgba(255,255,255,.85);text-align:left;transition:background .15s;}
.qopt:hover{background:rgba(255,255,255,.08);}
.qopt.active{background:rgba(255,255,255,.12);color:#fff;}
.qopt svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;flex:none;}
.qopt.active svg{opacity:1;}

/* ── overlays ── */
#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;transition:opacity .45s;pointer-events:none;}
#overlay.gone{opacity:0;}
.ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#fff;animation:rot .85s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.load-label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.88);}
.load-sub{font-size:12px;color:rgba(255,255,255,.45);text-align:center;padding:0 24px;}
#bufspin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;display:none;}

#err-ov{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.94);display:none;padding:16px;overflow-y:auto;}
#player.err #err-ov{display:flex;}
#player.err #bot,#player.err #mctr{display:none;}
.ec{margin:auto;width:100%;max-width:400px;text-align:center;}
.ei{width:54px;height:54px;border-radius:50%;background:rgba(240,20,110,.2);color:#FF8FBB;display:grid;place-items:center;margin:0 auto 14px;}
.ei svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.etxt{font-size:18px;font-weight:800;margin-bottom:8px;}
.emsg{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:18px;}
.eretry{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:16px;}
.retdot{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:rp 1.4s ease-in-out infinite;}
@keyframes rp{0%,100%{opacity:.3}50%{opacity:1}}
.elink{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;padding:0 16px;border:1px solid rgba(255,255,255,.14);border-radius:10px;
  background:rgba(255,255,255,.09);color:#fff;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;transition:background .15s;}
.elink:hover{background:rgba(255,255,255,.16);}
.elink svg{width:15px;height:15px;flex-shrink:0;}
.retrybtn{margin-bottom:10px;background:var(--acc);border-color:transparent;}
.retrybtn:hover{background:#FF3D96;}
.esoc{display:flex;gap:8px;}
.esoc-d{color:#b3b9ff;}.esoc-t{color:#86d6fb;}

/* double-tap flash */
.dbl{position:absolute;top:0;bottom:0;width:34%;z-index:8;display:none;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  background:radial-gradient(circle at center,rgba(255,255,255,.22),transparent 70%);pointer-events:none;}
.dbl.l{left:0}.dbl.r{right:0}
.dbl.show{display:flex;animation:df .5s ease-out forwards;}
@keyframes df{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ══ Phone / touch layout — minimal ══ */
.m-only{display:none;}
body.m .pc-only{display:none!important;}
body.m #mctr{display:flex;}
body.m .m-only{display:grid;}
body.m #bot{padding-bottom:max(8px,env(safe-area-inset-bottom));}
body.m .srow{gap:12px;}
body.m #prog{height:34px;}
body.m .pt{height:3px;}
body.m #tm{font-size:12.5px;}
body.m .live-pill{font-size:12px;}
body.m #ttl{font-size:14px;}
body.m .qbtn{padding:0 8px;font-size:13px;}
body.m .qbtn .lbl{display:none;}
body.m #crow{margin-top:0;}
body.m #crow .ic{width:40px;height:40px;}
body.m #crow .ic svg{width:24px;height:24px;}
body.m #qback{background:rgba(0,0,0,.55);}
body.m #qmenu{top:auto;left:0;right:0;bottom:0;width:auto;max-height:70vh;border:0;border-radius:18px 18px 0 0;
  padding:10px 12px max(16px,env(safe-area-inset-bottom));animation:sheet .22s var(--ease);}
body.m #player.qopen #qmenu{animation:sheet .22s var(--ease);}
@keyframes sheet{from{transform:translateY(30px);opacity:0;}}
body.m .qopt{height:50px;font-size:15px;}
@media (orientation:landscape) and (max-height:520px){
  body.m #qmenu{left:auto;top:0;bottom:0;right:0;width:min(320px,52vw);max-height:none;border-radius:18px 0 0 18px;
    padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));}
  body.m #mctr .pp{width:64px;height:64px;}
  .ec{max-width:340px;}
  .ei{display:none;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<script>
(function(){
'use strict';

var JSON_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var LANG_MAP = {eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI'};
var Q_ORDER  = ['1080p','720p','540p','480p','360p','240p'];
var DEFAULT_Q = '540p';

var sp = new URLSearchParams(location.search);
var idp = sp.get('id')||'';
var si  = parseInt(sp.get('s')||'0',10);
var ui  = idp.indexOf('_');
var matchId  = ui>-1 ? idp.slice(0,ui) : idp;
var langCode = ui>-1 ? idp.slice(ui+1) : 'eng';
var title = (sp.get('title')||sp.get('name')||'').replace(/#.*$/,'');

function $(i){return document.getElementById(i);}
var player=$('player'), vid=$('vid'), overlay=$('overlay'), bufspin=$('bufspin'), errOv=$('err-ov');
var prog=$('prog'), pbuf=$('pbuf'), ppl=$('ppl'), pth=$('pth'), tm=$('tm');
var livepill=$('livepill'), lpt=$('lpt');
var qbtn=$('qbtn'), qcur=$('qcur'), qmenu=$('qmenu'), qlist=$('qlist');
var bfit=$('bfit'), bpip=$('bpip');

var shakaPlayer=null, currentStreamUrl=null, castSession=null;
var qStreams={}, currentQ=DEFAULT_Q;
var isLive=true, isDrag=false, uPaused=false, hasError=false, qOpen=false;
var fitIdx=0, hideT=null, retryT=null, tapT=null, lastTap=0, lastX=0;

/* ── icons ── */
var ICON={
  arrow:'<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',
  back10:'<path d="M12.5 5.5a7.5 7.5 0 1 1-6.9 4.6"/><path d="M5.2 4.6v5h5"/>',

  pause:'<rect class="f" x="6" y="5" width="4.2" height="14" rx="1.2"/><rect class="f" x="13.8" y="5" width="4.2" height="14" rx="1.2"/>',

  mute:'<path class="f" d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="17" y1="9.5" x2="22" y2="14.5"/><line x1="22" y1="9.5" x2="17" y2="14.5"/>',
  fs:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  xfs:'<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>',
  pip:'<rect x="3" y="5" width="18" height="14" rx="2"/><rect class="f" x="12.5" y="11.5" width="7" height="5" rx="1.2"/>',
  qual:'<rect x="3" y="4" width="18" height="14" rx="2.5"/><path class="f" d="M10 8.3v5.4l4.5-2.7z"/><path d="M8 21h8"/>',
  fit0:'<rect x="2" y="4" width="20" height="16" rx="2"/><rect class="f" x="7" y="8" width="10" height="8" rx="1" opacity=".45"/>',
  fit1:'<rect class="f" x="2" y="4" width="20" height="16" rx="2" opacity=".25"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
  fit2:'<circle cx="10.5" cy="10.5" r="7"/><line x1="16" y1="16" x2="21.5" y2="21.5"/><line x1="10.5" y1="7.5" x2="10.5" y2="13.5"/><line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/>'
};
function setIcon(el,k){
  var s=el.querySelector('svg');
  if(!s){el.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 24 24"></svg>');s=el.querySelector('svg');}
  s.innerHTML=ICON[k];
}
function all(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));}
all('[data-i]').forEach(function(el){setIcon(el,el.getAttribute('data-i'));});

var FIT=[{fit:'contain',scale:1,t:'Fit'},{fit:'cover',scale:1,t:'Fill'},{fit:'contain',scale:1.4,t:'Zoom'}];

/* ── layout mode (phone/touch vs PC) ── */
var mq=window.matchMedia('(pointer:coarse), (max-width:700px)');
function setM(){document.body.classList.toggle('m',mq.matches);}
setM();
if(mq.addEventListener) mq.addEventListener('change',setM); else if(mq.addListener) mq.addListener(setM);
function isM(){return document.body.classList.contains('m');}

$('ttl').textContent=title;
if(title) document.title=title+' · FANCODE by EV';
if(history.length<=1 && !document.referrer) $('bback').style.visibility='hidden';

/* ── loading / error ── */
function showLoad(){
  hasError=false;
  player.classList.remove('err');
  overlay.classList.remove('gone');
  overlay.style.opacity='1';
}
function hideOverlay(){
  if(hasError) return;
  overlay.style.opacity='0';
  setTimeout(function(){overlay.classList.add('gone');},360);
}
function spin(on){
  bufspin.style.display=on?'block':'none';
  player.classList.toggle('buf',on);
}
function toFriendly(raw){
  raw=String(raw||'');
  if(/timeout/i.test(raw)) return 'Connection timed out. Please check your internet and try again.';
  if(/network error/i.test(raw)) return 'Network problem — please check your internet connection.';
  if(/json parse/i.test(raw)) return 'Something went wrong loading match data. Please try again shortly.';
  if(/http\s*4\d\d/i.test(raw)) return 'This stream is currently unavailable.';
  if(/http\s*5\d\d/i.test(raw)) return 'Server is temporarily unavailable. Please try again shortly.';
  if(/shaka error|unsupported/i.test(raw)) return 'This stream could not be played on your browser right now.';
  return raw;
}
function showErr(t,msg,retry){
  hasError=true;
  if(msg) console.error('[Player] '+t+':',msg);
  spin(false);
  overlay.style.opacity='0';
  setTimeout(function(){overlay.classList.add('gone');},360);
  $('etitle').textContent=t;
  $('emsg').textContent=toFriendly(msg);
  $('eretry').style.display=retry?'flex':'none';
  player.classList.add('err');
  player.classList.remove('idle');
}

async function attemptPlay(){
  try{ vid.muted=false; await vid.play(); }
  catch(e){
    try{ vid.muted=true; await vid.play(); }catch(e2){}
  }
  syncVol(); syncPlay();
}

vid.addEventListener('waiting',function(){spin(true);});
vid.addEventListener('playing',function(){spin(false);});
vid.addEventListener('canplay',function(){spin(false);});

/* ── controls visibility ── */
function showCtrls(){
  player.classList.remove('idle');
  clearTimeout(hideT);
  if(!vid.paused && !qOpen && !hasError) hideT=setTimeout(hideCtrls,4000);
}
function hideCtrls(){
  if(qOpen||isDrag||vid.paused||hasError) return;
  player.classList.add('idle');
}
player.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse') showCtrls(); });
player.addEventListener('mouseleave',function(){ clearTimeout(hideT); hideCtrls(); });
showCtrls();

/* ── play / mute ── */
function togglePlay(){
  if(vid.paused){ uPaused=false; vid.play().catch(function(){}); }
  else { uPaused=true; vid.pause(); }
}
function syncPlay(){
  all('[data-a="pp"]').forEach(function(el){
    setIcon(el,vid.paused?'play':'pause');
    el.setAttribute('aria-label',vid.paused?'Play':'Pause');
  });
}
function syncVol(){
  all('[data-a="mute"]').forEach(function(el){
    setIcon(el,vid.muted?'mute':'vol');
    el.setAttribute('aria-label',vid.muted?'Unmute':'Mute');
  });
}
vid.addEventListener('play',function(){syncPlay();showCtrls();});
vid.addEventListener('pause',function(){syncPlay();showCtrls();});
vid.addEventListener('ended',function(){syncPlay();showCtrls();});
vid.addEventListener('volumechange',syncVol);
vid.addEventListener('pause',function(){
  if(!vid.ended && !uPaused){
    setTimeout(function(){ if(vid.paused&&!vid.ended&&!uPaused&&!hasError) vid.play().catch(function(){}); },800);
  }
});
setInterval(function(){
  if(vid.src && vid.paused && !vid.ended && !uPaused && !hasError) vid.play().catch(function(){});
},4000);
syncPlay(); syncVol();

/* ── seek ── */
function range(){
  if(isLive){
    var s=vid.seekable;
    if(!s||!s.length) return null;
    return {s:s.start(0),e:s.end(s.length-1)};
  }
  if(!isFinite(vid.duration)||!vid.duration) return null;
  return {s:0,e:vid.duration};
}
function fmt(t){
  t=Math.max(0,Math.floor(t));
  var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s;
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function update(){
  var r=range();
  if(!r) return;
  var span=(r.e-r.s)||1;
  prog.classList.toggle('noseek', isLive ? span<20 : false);
  if(!isDrag){
    var p=clamp((vid.currentTime-r.s)/span*100,0,100);
    ppl.style.width=p+'%'; pth.style.left=p+'%';
  }
  if(vid.buffered.length){
    var be=vid.buffered.end(vid.buffered.length-1);
    pbuf.style.width=clamp((be-r.s)/span*100,0,100)+'%';
  }
  if(isLive){
    var behind=(r.e-vid.currentTime)>12;
    livepill.classList.toggle('behind',behind);
    lpt.textContent=behind?'Go live':'Live';
  } else {
    tm.textContent=fmt(vid.currentTime)+' / '+fmt(r.e);
  }
}
vid.addEventListener('timeupdate',update);
vid.addEventListener('progress',update);
setInterval(update,1000);
vid.addEventListener('loadedmetadata',function(){
  isLive=!isFinite(vid.duration)||vid.duration>86400;
  player.classList.toggle('is-live',isLive);
  update();
});
function seekBy(d){
  var r=range(); if(!r) return;
  vid.currentTime=clamp(vid.currentTime+d,r.s,r.e);
  update();
}
function goLive(){
  var r=range(); if(!r) return;
  vid.currentTime=r.e; uPaused=false;
  if(vid.paused) vid.play().catch(function(){});
}
function frac(e){
  var b=prog.getBoundingClientRect();
  return clamp((e.clientX-b.left)/b.width,0,1);
}
function seekFrac(f){
  var r=range(); if(!r) return;
  vid.currentTime=r.s+f*(r.e-r.s);
  ppl.style.width=(f*100)+'%'; pth.style.left=(f*100)+'%';
}
prog.addEventListener('pointerdown',function(e){
  if(prog.classList.contains('noseek')||!range()) return;
  isDrag=true; prog.classList.add('drag');
  try{prog.setPointerCapture(e.pointerId);}catch(x){}
  seekFrac(frac(e)); showCtrls(); e.preventDefault();
});
prog.addEventListener('pointermove',function(e){ if(isDrag) seekFrac(frac(e)); });
function endDrag(){ if(!isDrag) return; isDrag=false; prog.classList.remove('drag'); update(); showCtrls(); }
prog.addEventListener('pointerup',endDrag);
prog.addEventListener('pointercancel',endDrag);

/* ── quality menu ── */
var TICK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
function availQ(){return Q_ORDER.filter(function(q){return qStreams[q];});}
function buildQ(){
  qlist.innerHTML=availQ().map(function(q){
    return '<button type="button" role="menuitem" class="qopt'+(q===currentQ?' active':'')+'" data-q="'+q+'"><span>'+q+'</span>'+TICK+'</button>';
  }).join('');
}
function syncQ(){ qcur.textContent=currentQ; buildQ(); }
function openQ(){
  if(availQ().length<1) return;
  buildQ();
  qOpen=true;
  player.classList.add('qopen'); qbtn.classList.add('open'); qbtn.setAttribute('aria-expanded','true');
  showCtrls();
}
function closeQ(){
  qOpen=false;
  player.classList.remove('qopen'); qbtn.classList.remove('open'); qbtn.setAttribute('aria-expanded','false');
  showCtrls();
}
function switchQ(q){
  var url=qStreams[q]; if(!url||q===currentQ) return;
  var prev=currentQ;
  var t=(!isLive&&isFinite(vid.currentTime))?vid.currentTime:0;
  currentQ=q; syncQ();
  try{localStorage.setItem('ev_q',q);}catch(e){}
  spin(true);
  loadStream(url,[qStreams[prev]]).then(function(used){
    if(!used) return;
    var k=Object.keys(qStreams).filter(function(x){return qStreams[x]===used;})[0];
    if(k&&k!==currentQ){currentQ=k;syncQ();}
    if(t>1){
      var restore=function(){ vid.removeEventListener('loadedmetadata',restore); try{vid.currentTime=t;}catch(e){} };
      if(vid.readyState>=1 && !isLive) restore(); else vid.addEventListener('loadedmetadata',restore);
    }
  });
}

/* ── fit / pip / fullscreen ── */
function applyFit(i){
  var m=FIT[i];
  vid.style.objectFit=m.fit;
  vid.style.transform=m.scale!==1?'scale('+m.scale+')':'none';
  setIcon(bfit,'fit'+i);
  bfit.setAttribute('aria-label','Video fit: '+m.t);
}
applyFit(0);
if(!document.pictureInPictureEnabled) bpip.style.display='none';
function inFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||vid.webkitDisplayingFullscreen);}
function toggleFs(){
  if(!inFs()){
    var req=player.requestFullscreen||player.webkitRequestFullscreen||player.mozRequestFullScreen;
    if(req){
      var r=req.call(player);
      var lock=function(){ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); };
      if(r&&typeof r.then==='function') r.then(lock).catch(function(){ if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); });
      else lock();
    } else if(vid.webkitEnterFullscreen){ vid.webkitEnterFullscreen(); }
  } else {
    var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(ex){ var x=ex.call(document); if(x&&x.catch) x.catch(function(){}); }
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
}
function syncFs(){ all('[data-a="fs"]').forEach(function(el){setIcon(el,inFs()?'xfs':'fs');}); }
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(n){document.addEventListener(n,syncFs);});
vid.addEventListener('webkitendfullscreen',syncFs);

/* ── action dispatch ── */
function act(a){
  if(a==='pp') togglePlay();
  else if(a==='b') seekBy(-10);
  else if(a==='f') seekBy(10);
  else if(a==='mute'){ vid.muted=!vid.muted; syncVol(); }
  else if(a==='fs') toggleFs();
  else if(a==='pip'){ if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){}); else vid.requestPictureInPicture().catch(function(){}); }
  else if(a==='fit'){ fitIdx=(fitIdx+1)%FIT.length; applyFit(fitIdx); }
  else if(a==='live') goLive();
  else if(a==='q'){ if(qOpen) closeQ(); else openQ(); return; }
  else if(a==='back'){ if(history.length>1) history.back(); else location.href='/'; return; }
  showCtrls();
}

function flash(side,txt){
  var e=$(side==='l'?'dbl':'dbr');
  e.textContent=txt; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}
function toggleCtrls(){
  if(player.classList.contains('idle')) showCtrls();
  else { clearTimeout(hideT); hideCtrls(); if(vid.paused) showCtrls(); }
}
function tapVideo(e){
  var touch = e.pointerType==='touch' || (e.pointerType!=='mouse' && e.pointerType!=='pen' && isM());
  if(!touch){ togglePlay(); showCtrls(); return; }
  var now=Date.now(), x=e.clientX/(player.clientWidth||innerWidth);
  if(now-lastTap<300 && Math.abs(x-lastX)<0.3){
    clearTimeout(tapT); lastTap=0;
    if(x<0.4){ seekBy(-10); flash('l','\u221210s'); }
    else if(x>0.6){ seekBy(10); flash('r','+10s'); }
    else togglePlay();
    showCtrls(); return;
  }
  lastTap=now; lastX=x;
  clearTimeout(tapT);
  tapT=setTimeout(toggleCtrls,260);
}
player.addEventListener('click',function(e){
  var opt=e.target.closest('.qopt');
  if(opt){
    var q=opt.getAttribute('data-q');
    closeQ();
    if(q&&q!==currentQ) switchQ(q);
    return;
  }
  var b=e.target.closest('[data-a]');
  if(b){ act(b.getAttribute('data-a')); return; }
  if(e.target.closest('#prog,#qmenu,#err-ov')) return;
  if(qOpen){ closeQ(); return; }
  tapVideo(e);
});
player.addEventListener('dblclick',function(e){
  if(e.pointerType==='touch'||isM()) return;
  if(e.target.closest('[data-a],#prog,#qmenu,#err-ov')) return;
  toggleFs();
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var k=e.key;
  if(k==='Escape'){ if(qOpen) closeQ(); return; }
  if(k===' '||k==='k'||k==='K'){ e.preventDefault(); togglePlay(); showCtrls(); }
  else if(k==='ArrowLeft'){ seekBy(-10); showCtrls(); }
  else if(k==='ArrowRight'){ seekBy(10); showCtrls(); }
  else if(k==='m'||k==='M') act('mute');
  else if(k==='f'||k==='F') toggleFs();
});

/* ── Chromecast ── */
function castType(url){
  if(/\.m3u8(\?|$)/i.test(url)) return 'application/x-mpegurl';
  if(/\.mpd(\?|$)/i.test(url)) return 'application/dash+xml';
  return 'video/mp4';
}
function sendToCast(url){
  if(!castSession||!url) return;
  var mi=new chrome.cast.media.MediaInfo(url,castType(url));
  mi.streamType=isLive?chrome.cast.media.StreamType.LIVE:chrome.cast.media.StreamType.BUFFERED;
  mi.metadata=new chrome.cast.media.GenericMediaMetadata();
  mi.metadata.title=document.title||'Live Stream';
  castSession.loadMedia(new chrome.cast.media.LoadRequest(mi)).catch(function(err){console.warn('Cast load failed',err);});
}
function updateCast(){
  var ctx=cast.framework.CastContext.getInstance();
  castSession=ctx.getCurrentSession();
  if(castSession&&currentStreamUrl){ sendToCast(currentStreamUrl); try{vid.pause();}catch(e){} }
}
window['__onGCastApiAvailable']=function(ok){
  if(!ok||!window.chrome||!chrome.cast) return;
  cast.framework.CastContext.getInstance().setOptions({
    receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
  });
  cast.framework.CastContext.getInstance().addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,updateCast);
};

/* ── streaming ── */
async function tryShaka(url){
  if(shakaPlayer){try{await shakaPlayer.destroy();}catch(e){}shakaPlayer=null;}
  shakaPlayer=new shaka.Player();
  await shakaPlayer.attach(vid);
  shakaPlayer.configure({streaming:{bufferingGoal:4,rebufferingGoal:1,safeSeekOffset:5,lowLatencyMode:true}});
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(t,req){req.allowCrossSiteCredentials=true;});
  await shakaPlayer.load(url);
  currentStreamUrl=url;
  if(castSession) sendToCast(url);
}
function armWatchers(){
  var onP=function(){vid.removeEventListener('playing',onP);hideOverlay();};
  vid.addEventListener('playing',onP);
  setTimeout(function(){if(!hasError) hideOverlay();},6000);
}
function tryNativeCascade(urls,lastErr){
  var idx=0;
  function attempt(){
    if(idx>=urls.length||!urls[idx]){ showErr('Playback error',lastErr||'No playable stream found',false); return; }
    var url=urls[idx++];
    var onErr=function(){ vid.removeEventListener('error',onErr); attempt(); };
    vid.addEventListener('error',onErr,{once:true});
    vid.src=url; currentStreamUrl=url;
    if(castSession) sendToCast(url);
    attemptPlay(); armWatchers();
  }
  attempt();
}
async function loadStream(url,fallbacks){
  hasError=false;
  var urls=[url].concat((fallbacks||[]).filter(function(u){return u&&u!==url;}));
  var lastErr=null, used=null;
  if(shaka.Player.isBrowserSupported()){
    for(var i=0;i<urls.length;i++){
      if(!urls[i]) continue;
      try{ await tryShaka(urls[i]); lastErr=null; used=urls[i]; break; }
      catch(e){
        var hs=(e.data&&e.data[1])?' (HTTP '+e.data[1]+')':'';
        lastErr='Shaka Error '+(e.code||'?')+hs;
        if(shakaPlayer){try{await shakaPlayer.destroy();}catch(x){}shakaPlayer=null;}
      }
    }
  } else lastErr='unsupported';

  if(lastErr){
    if(vid.canPlayType('application/vnd.apple.mpegurl')){ tryNativeCascade(urls,lastErr); return urls[0]; }
    showErr('Playback error',lastErr,false);
    return null;
  }
  await attemptPlay();
  armWatchers();
  return used;
}

function fetchJSON(url){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open('GET',url,true); x.timeout=12000;
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText));}catch(e){rej(new Error('JSON parse error'));}}
      else rej(new Error('HTTP '+x.status));
    };
    x.onerror=function(){rej(new Error('Network error'));};
    x.ontimeout=function(){rej(new Error('Timeout'));};
    x.send();
  });
}
function resolve(data){
  var list=Array.isArray(data)?data:(Array.isArray(data.matches)?data.matches:[]);
  if(!list.length) throw new Error('No matches in JSON');
  var m=null;
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)){m=list[i];break;}
  if(!m) throw new Error('Match "'+matchId+'" not found ('+list.length+' total)');
  var s=m.streams||{};
  var fb=[s.primary,s.fancode_cdn,s.fancode_lk_cdn,s.fancode_bd_cdn,s.fancode_np_cdn].filter(Boolean);
  if(si===0){
    var as=m.auto_streams||{};
    var keys=Object.keys(as);
    if(!keys.length) throw new Error('No live stream — match not started yet');
    var lang=LANG_MAP[langCode]||m.language||keys[0];
    var al=as[lang]||as[keys[0]];
    if(!al||!al.streams||!Object.keys(al.streams).length) throw new Error('Stream URLs empty for this match');
    return {type:'multi',streams:al.streams,fallbacks:fb};
  }
  var u=si===1?s.fancode_lk_cdn:si===2?s.fancode_np_cdn:si===3?s.fancode_bd_cdn:null;
  if(!u) throw new Error('Regional stream (s='+si+') not available');
  return {type:'single',url:u,fallbacks:fb};
}

shaka.polyfill.installAll();
function start(){
  clearTimeout(retryT);
  showLoad();
  if(!matchId){ showErr('Missing match ID','URL: ?id=MATCHID_LANG&s=0',false); return; }
  fetchJSON(JSON_URL).then(function(data){
    var r;
    try{ r=resolve(data); }
    catch(e){ showErr('Stream unavailable',e.message,true); retryT=setTimeout(start,8000); return; }
    if(r.type==='multi'){
      qStreams=r.streams;
      var pref=null;
      try{pref=localStorage.getItem('ev_q');}catch(e){}
      var url=(pref&&r.streams[pref])||r.streams[DEFAULT_Q]||r.streams['720p']||r.streams['480p']||r.streams['1080p']||r.streams['360p']||r.streams['240p'];
      if(!url){ showErr('No stream URL','All quality URLs empty for this match',true); return; }
      currentQ=Q_ORDER.filter(function(q){return r.streams[q]===url;})[0]||DEFAULT_Q;
      syncQ();
      qbtn.hidden=availQ().length<1;
      loadStream(url,r.fallbacks);
    } else {
      qbtn.hidden=true;
      loadStream(r.url,r.fallbacks);
    }
  }).catch(function(e){ showErr('Could not load data',e.message,true); retryT=setTimeout(start,8000); });
}
$('retryNow').addEventListener('click',function(e){ e.stopPropagation(); start(); });
start();
})();
