<style>
/* ── EV Streams player — minimal liquid glass ─────────────────────────
   One floating glass bar carries every control; the picture stays clear.
   Accent (magenta) is reserved for the live dot, seek fill and spinners. */
:root{
  --mg:#F0146E;
  --mg-2:#FF8FBB;
  --mg-dim:rgba(240,20,110,.20);
  --amber:#ffb020;
  --bg:#000;
  --txt:#fff;
  --dim:rgba(245,245,247,.66);
  --dim-2:rgba(245,245,247,.42);
  --line:rgba(255,255,255,.14);
  --glass:rgba(22,22,26,.58);
  --glass-strong:rgba(16,16,20,.88);
  --tint:rgba(14,14,22,.34);
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;-webkit-text-size-adjust:100%;}
body{width:100%;height:100%;min-height:100dvh;background:var(--bg);overflow:hidden;font-family:'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--txt);}
#player{position:fixed;inset:0;background:var(--bg);user-select:none;-webkit-user-select:none;overflow:hidden;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transition:transform .3s ease;}

/* ── Glass surface ───────────────────────────────────────────────────
   Flat frosted panel — single tint, single hairline border, blur+saturate.
   Matches the SX SPORTS 4K player skin (no sheen/gradient tricks). */
.glass{
  position:relative;
  background:var(--glass);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
          backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
}
.glass.strong{background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.glass > *{position:relative;}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(16,16,20,.92);}
}

/* ── Loading ─────────────────────────────────────────────────────── */
#overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at center,#15151a 0%,#000 72%);transition:opacity .45s;}
#overlay.gone{opacity:0;pointer-events:none;}
.load-ring{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--mg);animation:rot .9s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.load-label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.88);}
.load-bar{width:220px;height:3px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;}
.load-bar i{display:block;height:100%;width:34%;border-radius:99px;background:linear-gradient(90deg,var(--mg),var(--mg-2));animation:lslide 1.3s ease-in-out infinite;}
@keyframes lslide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.load-sub{font-size:12px;color:var(--dim-2);text-align:center;padding:0 24px;}
#bufspin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;display:none;width:46px;height:46px;border-radius:50%;
  border:3px solid rgba(255,255,255,.16);border-top-color:var(--mg);animation:rot .85s linear infinite;background:transparent!important;box-shadow:none!important;}
#bufspin div{display:none;}

/* ── Error ───────────────────────────────────────────────────────── */
#err-ov{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,.72);display:none;padding:16px;overflow-y:auto;}
#err-ov.show{display:flex;}
/* While the error card is up the bar stays out of the way. */
#err-ov.show ~ #ctrls{display:none;}
.ec{margin:auto;width:100%;max-width:356px;border-radius:16px;padding:26px 22px 22px;text-align:center;background:var(--glass-strong);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.ec .ei-wrap{width:54px;height:54px;border-radius:50%;background:var(--mg-dim);color:var(--mg-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.ec .ei-wrap svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ec .etxt{font-size:18px;font-weight:800;color:var(--txt);margin-bottom:8px;}
.ec .emsg{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:18px;}
.ec .eretry{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:16px;}
.retdot{width:6px;height:6px;border-radius:50%;background:var(--mg);animation:rpulse 1.4s ease-in-out infinite;}
@keyframes rpulse{0%,100%{opacity:.3}50%{opacity:1}}
.ec .elink{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.09);color:var(--txt);font-family:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;
  transition:background .15s var(--ease);}
.ec .elink:hover{background:rgba(255,255,255,.16);}
.ec .elink:active{opacity:.85;}
.ec .elink svg{width:15px;height:15px;fill:currentColor;flex-shrink:0;}
.ec .retrybtn{margin-bottom:10px;background:var(--mg);border-color:transparent;}
.ec .retrybtn:hover{background:#FF3D96;}
.ec .retrybtn svg{fill:none;stroke:currentColor;}
.esoc{display:flex;gap:8px;}
.esoc .elink{padding:0 14px;}
.esoc-discord{color:#b3b9ff;}
.esoc-telegram{color:#86d6fb;}

/* ── Centre play ─────────────────────────────────────────────────── */
#bigplay{position:absolute;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.bpbtn{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .2s,transform .2s,background .15s;}
.bpbtn:hover{background:var(--mg-dim);}
#bigplay.shown .bpbtn{opacity:1;transform:scale(1);pointer-events:auto;}
#bigplay.shown .bpbtn:active{transform:scale(.94);}
.bpbtn svg{width:26px;height:26px;margin-left:3px;fill:#fff;}

/* ── Control bar ─────────────────────────────────────────────────── */
#ctrls{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:0 12px max(14px,env(safe-area-inset-bottom));pointer-events:none;}
#bar{pointer-events:auto;width:min(620px,92%);border-radius:20px;padding:7px 10px 5px;
  transition:opacity .3s,transform .3s;}
/* Fade the glass itself, never a parent — a fading ancestor would switch the blur off mid-transition. */
#ctrls.gone #bar{opacity:0;transform:translateY(10px);pointer-events:none;}
#crow{display:flex;align-items:center;gap:1px;}
.csp{flex:1;min-width:8px;}
#ctrls:not(.is-live) .csp{display:none;}

.cb{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;outline:none;
  transition:background .15s;}
.cb svg{display:block;width:20px;height:20px;}
.cb:hover{background:rgba(255,255,255,.13);}
.cb:active{background:rgba(255,255,255,.2);}
.cb:focus-visible,#prog:focus-visible,.qopt:focus-visible,.ec .elink:focus-visible,#bigplay .bpbtn:focus-visible,.live-pill.behind:focus-visible{outline:2px solid var(--mg-2);outline-offset:2px;}
#bplay:hover{background:rgba(255,255,255,.13);}
#bvol.is-muted{background:rgba(255,255,255,.1);}

.live-pill{display:flex;align-items:center;gap:6px;height:30px;margin-left:6px;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid var(--line);
  font-size:11px;font-weight:800;letter-spacing:.05em;color:#fff;cursor:default;flex-shrink:0;white-space:nowrap;
  transition:background .2s,border-color .2s;}
.live-pill.behind{cursor:pointer;background:var(--amber);border-color:transparent;}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--mg);box-shadow:0 0 8px var(--mg);animation:lblink 1.6s infinite;flex:none;}
.live-pill.behind .ldot{background:#fff;box-shadow:none;animation:none;}
@keyframes lblink{0%{box-shadow:0 0 0 0 rgba(240,20,110,.6)}70%{box-shadow:0 0 0 8px rgba(240,20,110,0)}100%{box-shadow:0 0 0 0 rgba(240,20,110,0)}}

/* Seek bar — on-demand streams only (live has nothing to seek). Sits between the left and right groups. */
#ctrls.is-live #prog{display:none;}
#prog{flex:1;min-width:48px;height:20px;margin:0 12px;display:flex;align-items:center;cursor:pointer;position:relative;outline:none;}
.pt{position:relative;height:4px;width:100%;background:rgba(255,255,255,.22);border-radius:999px;transition:height .15s;overflow:hidden;}
#prog:hover .pt,#prog.drag .pt{height:6px;}
.pbf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.3);border-radius:inherit;width:0;}
.ppl{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--mg),var(--mg-2));border-radius:inherit;width:0;}
.pth{position:absolute;top:50%;left:0;width:13px;height:13px;background:#fff;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;
  box-shadow:0 0 8px rgba(0,0,0,.5);transition:transform .15s;}
#prog:hover .pth,#prog.drag .pth{transform:translate(-50%,-50%) scale(1);}

/* ── Quality (settings gear) ─────────────────────────────────────── */
#bq.open{background:rgba(255,255,255,.2);}
#bq svg{transition:transform .25s var(--ease);}
#bq.open svg{transform:rotate(45deg);}
#qlbl{display:none;}
#qmenu{position:absolute;z-index:30;min-width:170px;max-height:min(58vh,380px);overflow:auto;padding:6px;border-radius:14px;display:none;pointer-events:auto;
  background:var(--glass-strong);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 14px 44px rgba(0,0,0,.55);}
#qmenu.open{display:block;animation:qpop .2s;}
@keyframes qpop{from{opacity:0;transform:translateY(6px);}}
.qmenu-head{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim-2);padding:9px 10px 4px;}
.qopt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;height:38px;padding:0 10px;border:0;border-radius:9px;
  background:transparent;color:rgba(255,255,255,.85);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;outline:none;
  transition:background .15s;}
.qopt:hover{background:rgba(255,255,255,.09);color:#fff;}
.qopt.active{color:#fff;background:var(--mg-dim);}
.qopt .qtick{width:14px;height:14px;flex-shrink:0;opacity:0;color:var(--mg-2);}
.qopt.active .qtick{opacity:1;}

/* ── Top bar (brand / title / live+quality chips) ──────────────────── */
#top{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
  pointer-events:none;transition:opacity .3s;background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);height:120px;}
#top > *{pointer-events:auto;}
#top.idle{opacity:0;}
.credit-tag{font-weight:900;font-style:italic;letter-spacing:.07em;font-size:12px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;}
.credit-tag:empty{display:none;}
#toptitle{flex:1;min-width:0;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;
  color:#fff;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap;}
.tchip[hidden]{display:none;}
.tchip .dot{width:7px;height:7px;border-radius:50%;background:var(--mg);box-shadow:0 0 8px var(--mg);animation:lblink 1.6s infinite;}
google-cast-launcher{--connected-color:var(--mg);--disconnected-color:#fff;}
#castbtn{width:38px;height:38px;border-radius:10px;flex-shrink:0;cursor:pointer;display:flex!important;align-items:center;justify-content:center;transition:background .15s;}
#castbtn:hover{background:rgba(255,255,255,.13);}

/* ── Small screens ───────────────────────────────────────────────── */
@media (max-width:480px){
  #ctrls{padding:0 8px max(10px,env(safe-area-inset-bottom));}
  #bar{padding:6px 8px 4px;border-radius:14px;}
  .cb{width:36px;height:36px;}
  .cb svg{width:18px;height:18px;}
  .live-pill{height:28px;padding:0 10px;font-size:10.5px;margin-left:2px;}
  .bpbtn{width:64px;height:64px;}
  #top{height:100px;}
  #toptitle{display:none;}
  /* on-demand: seek bar gets its own row above the buttons */
  #ctrls:not(.is-live) #crow{flex-wrap:wrap;}
  #ctrls:not(.is-live) .csp{display:block;}
  #ctrls:not(.is-live) #prog{order:-1;flex:1 0 calc(100% - 20px);height:26px;margin:0 10px 2px;}
}
@media (max-height:360px){
  #err-ov{padding:10px;}
  .ec{padding:16px 16px 14px;border-radius:24px;}
  .ec .ei-wrap{display:none;}
  .ec .etxt{font-size:16px;margin-bottom:4px;}
  .ec .emsg{font-size:12.5px;line-height:1.45;margin-bottom:12px;}
  .ec .eretry{margin-bottom:10px;}
  .ec .elink{height:38px;font-size:13px;}
  .ec .retrybtn{margin-bottom:8px;}
}
@media (max-width:380px){
  .cb{width:34px;height:34px;}
}
@media (prefers-reduced-motion:reduce){
  .cb,.live-pill,.bpbtn,.qopt,.ec .elink,.pth,#bar{transition:none;}
  #qmenu.open{animation:none;}
  .ldot{animation:none;}
}
</style>
</head>
<body>

<div id="player">
  <video id="vid" autoplay playsinline preload="metadata"></video>

  <div id="top">
    <span class="credit-tag"></span>
    <span id="toptitle"></span>
    <span class="tchip" id="topquality" hidden></span>
    <span class="tchip" id="toplive" hidden><i class="dot"></i><span>LIVE</span></span>
  </div>

  <div id="overlay">
    <div class="load-ring"></div>
    <div class="load-label">Connecting to stream</div>
    <div class="load-bar"><i></i></div>
    <div class="load-sub">Streams can take a few seconds to load.</div>
  </div>

  <div id="bufspin"><div></div></div>

  <div id="err-ov">
    <div class="ec glass">
      <div class="ei-wrap"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></div>
      <div class="etxt" id="etitle">Stream unavailable</div>
      <div class="emsg" id="emsg"></div>
      <div class="eretry" id="eretry" style="display:none"><span class="retdot"></span><span>Retrying…</span></div>
      <button type="button" id="retryNow" class="elink retrybtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try again
      </button>
      <div class="esoc">
        <a href="https://discord.gg/w46C6mQgrY" target="_blank" rel="noopener noreferrer" class="elink esoc-discord" aria-label="Join EV Streams Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.07.07 0 0 0-.075.035c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.07.07 0 0 0-.075-.035A19.74 19.74 0 0 0 3.68 4.37a.064.064 0 0 0-.03.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.055 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128c-.598.35-1.22.645-1.873.892a.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.947 2.419-2.157 2.419z"/></svg>
          Discord
        </a>
        <a href="https://t.me/rishievofficial" target="_blank" rel="noopener noreferrer" class="elink esoc-telegram" aria-label="Join EV Streams Telegram">
          <svg viewBox="0 0 240 240" fill="none"><path fill="currentColor" d="M170.6 68.3 145.9 187c-1.9 8.4-6.8 10.4-13.8 6.5l-38.1-28.1-18.4 17.7c-2 2-3.7 3.7-7.6 3.7l2.7-38.8 70.6-63.8c3.1-2.7-.7-4.2-4.8-1.5L54 137.5l-38-11.9c-8.3-2.6-8.4-8.3 1.7-12.2l148.3-57.2c6.9-2.6 13 1.6 10.6 12.1z"/></svg>
          Telegram
        </a>
      </div>
    </div>
  </div>

  <div id="bigplay" class="gone">
    <div class="bpbtn glass" id="bpbtn" role="button" tabindex="0" aria-label="Play video">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z"/></svg>
    </div>
  </div>

  <div id="ctrls" class="is-live">
    <div id="bar" class="glass" role="group" aria-label="Player controls">
      <div id="crow">
        <button class="cb" id="bplay" title="Play / Pause" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" fill="currentColor" id="pico">
            <rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>
          </svg>
        </button>
        <button class="cb" id="bvol" title="Mute / Unmute" aria-label="Mute or unmute">
          <svg viewBox="0 0 24 24" fill="none" id="vico">
            <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
            <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
            <path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <div class="live-pill" id="livepill"><span class="ldot"></span><span id="lpitext">Live</span></div>
        <div class="csp"></div>
        <div id="prog" role="slider" aria-label="Seek" tabindex="0">
          <div class="pt">
            <div class="pbf" id="pbuf"></div>
            <div class="ppl" id="ppl"></div>
            <div class="pth" id="pth"></div>
          </div>
        </div>
        <button class="cb" id="bq" title="Settings" aria-label="Video quality settings" aria-haspopup="true" aria-expanded="false" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>

            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

            <rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12.5" y="11.5" width="7" height="5" rx="1.5" fill="currentColor" stroke="none"/>

<script>
(function(){
'use strict';

var JSON_URL  = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var LANG_MAP  = {eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI'};
var Q_ORDER   = ['1080p','720p','540p','480p','360p','240p'];
var DEFAULT_Q = '540p';

var sp = new URLSearchParams(location.search);
var idp = sp.get('id')||'';
var si  = parseInt(sp.get('s')||'0',10);
var ui  = idp.indexOf('_');
var matchId  = ui>-1 ? idp.slice(0,ui) : idp;
var langCode = ui>-1 ? idp.slice(ui+1) : 'eng';

var vid      = document.getElementById('vid');
var player   = document.getElementById('player');
var overlay  = document.getElementById('overlay');
var bufspin  = document.getElementById('bufspin');
var errOv    = document.getElementById('err-ov');
var ctrls    = document.getElementById('ctrls');
var prog     = document.getElementById('prog');
var pbuf     = document.getElementById('pbuf');
var ppl      = document.getElementById('ppl');
var pth      = document.getElementById('pth');
var bplay    = document.getElementById('bplay');
var pico     = document.getElementById('pico');
var bvol     = document.getElementById('bvol');
var vico     = document.getElementById('vico');
var livepill = document.getElementById('livepill');
var lpitext  = document.getElementById('lpitext');
var bq       = document.getElementById('bq');
var qmenu    = document.getElementById('qmenu');
var qlist    = document.getElementById('qlist');
var qlbl     = document.getElementById('qlbl');
var bfill    = document.getElementById('bfill');
var fillico  = document.getElementById('fillico');
var bpip     = document.getElementById('bpip');
var bfs      = document.getElementById('bfs');
var fsico    = document.getElementById('fsico');
var bar      = document.getElementById('bar');
var bigplay  = document.getElementById('bigplay');
var bpbtn    = document.getElementById('bpbtn');
var topbar   = document.getElementById('top');
var topquality = document.getElementById('topquality');
var toplive    = document.getElementById('toplive');
var castbtn    = document.getElementById('castbtn');

var shakaPlayer = null;
var currentStreamUrl = null;
var castSession = null;
var qStreams = {}, currentQ = DEFAULT_Q;
var isLive = true, isDragging = false, uPaused = false, hasError = false;
var fillModeIdx = 0, isMuted = true;
var hideTimer = null, retryTimer = null;
var qCooldown = false;
var playerActivated = false;

var FILL_MODES = [
  {fit:'contain', scale:1,   title:'Fit',
   icon:'<rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="7" y="8" width="10" height="8" rx="1" fill="currentColor" opacity=".45"/>'},
  {fit:'cover',   scale:1,   title:'Fill',
   icon:'<rect x="2" y="4" width="20" height="16" rx="2" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.7"/><path d="M2 4l20 16M22 4L2 20" stroke="currentColor" stroke-width="1" opacity=".35"/>'},
  {fit:'contain', scale:1.4, title:'Zoom',
   icon:'<circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/><line x1="16" y1="16" x2="21.5" y2="21.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="10.5" y1="7.5" x2="10.5" y2="13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="7.5" y1="10.5" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'}
];

function showLoad(){
  hasError=false;
  overlay.classList.remove('gone');
  overlay.style.opacity='1';
  overlay.style.pointerEvents='none';
  errOv.classList.remove('show');
}

function hideOverlay(){
  if(hasError) return;
  overlay.style.opacity='0';
  overlay.style.pointerEvents='none';
  setTimeout(function(){overlay.classList.add('gone');},360);
}

async function attemptPlay(){
  try{
    vid.muted=false;
    await vid.play();
  }catch(e){
    // Browser autoplay policy blocked sound-on playback — fall back to muted
    // so the stream still starts. The first tap on the volume button or the
    // big play button will unmute it (that's a real user gesture, so it's allowed).
    try{
      vid.muted=true;
      await vid.play();
    }catch(e2){ syncBig(); }
  }
  syncVol();
}

function toFriendlyMessage(raw){
  raw = String(raw||'');
  if(/timeout/i.test(raw)) return 'Connection timed out. Please check your internet and try again.';
  if(/network error/i.test(raw)) return 'Network problem — please check your internet connection.';
  if(/json parse/i.test(raw)) return 'Something went wrong loading match data. Please try again shortly.';
  if(/http\s*4\d\d/i.test(raw)) return 'This stream is currently unavailable.';
  if(/http\s*5\d\d/i.test(raw)) return 'Server is temporarily unavailable. Please try again shortly.';
  if(/shaka error|unsupported/i.test(raw)) return 'This stream could not be played on your browser right now.';
  return raw;
}

function showErr(title,msg,retry){
  hasError=true;
  if(msg) console.error('[Player] '+title+':', msg);
  bigplay.classList.remove('shown');
  bigplay.classList.add('gone');
  overlay.style.opacity='0';
  overlay.style.pointerEvents='none';
  setTimeout(function(){overlay.classList.add('gone');},360);
  document.getElementById('etitle').textContent=title;
  document.getElementById('emsg').textContent=toFriendlyMessage(msg);
  document.getElementById('eretry').style.display=retry?'flex':'none';
  errOv.classList.add('show');
}

vid.addEventListener('waiting', function(){ bufspin.style.display='block'; });
vid.addEventListener('playing', function(){ bufspin.style.display='none'; });
vid.addEventListener('canplay', function(){ bufspin.style.display='none'; });

function syncBig(){
  if(vid.paused && !hasError){
    bigplay.classList.add('shown');
    bigplay.classList.remove('gone');
  } else {
    bigplay.classList.remove('shown');
    bigplay.classList.add('gone');
  }
}

bpbtn.addEventListener('keydown', function(e){
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); bpbtn.click(); }
});
bpbtn.addEventListener('click', function(e){
  e.stopPropagation();
  uPaused=false;
  playerActivated=true;
  vid.muted=false;
  vid.play().then(syncVol).catch(function(){ syncVol(); });
});
vid.addEventListener('play',  syncBig);
vid.addEventListener('pause', syncBig);

player.addEventListener('click', function(e){
  if(e.target.closest('#crow')) return;
  if(e.target.closest('.bpbtn')) return;
  if(qCooldown) return;

  playerActivated = true;
  showCtrls();
});

function showCtrls(){
  ctrls.classList.remove('gone');
  topbar.classList.remove('idle');
  clearTimeout(hideTimer);
  if(!vid.paused){
    hideTimer=setTimeout(function(){
      if(qmenu && qmenu.classList.contains('open')) return; // menu open — keep the bar up
      ctrls.classList.add('gone');
      topbar.classList.add('idle');
    },5000);
  }
}
player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, {passive:true});
// Desktop: controls hide the instant the cursor actually leaves the
// player — not just after the 5s idle timeout — same as the mouse simply
// not being over the video. Skipped while paused, dragging the seek bar,
// or the quality menu is open, so it never disappears mid-interaction.
player.addEventListener('mouseleave', function(){
  clearTimeout(hideTimer);
  if(qmenu && qmenu.classList.contains('open')) return;
  if(isDragging) return;
  if(vid.paused) return;
  ctrls.classList.add('gone');
  topbar.classList.add('idle');
});
showCtrls();

function togglePlay(){
  if(vid.paused){ uPaused=false; vid.play().catch(function(){}); }
  else{ uPaused=true; vid.pause(); }
}
bplay.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(); });

function syncPlayIcon(){
  pico.innerHTML=vid.paused
    ?'<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z" fill="currentColor"/>'
    :'<rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/>';
  bplay.setAttribute('aria-label', vid.paused ? 'Play' : 'Pause');
}
vid.addEventListener('play',  function(){ syncPlayIcon(); showCtrls(); });
vid.addEventListener('pause', function(){ syncPlayIcon(); showCtrls(); });

vid.addEventListener('pause', function(){
  if(!vid.ended && !uPaused){
    setTimeout(function(){ if(vid.paused&&!vid.ended&&!uPaused) vid.play().catch(function(){}); },800);
  }
});
setInterval(function(){
  if(vid.src && vid.paused && !vid.ended && !uPaused) vid.play().catch(function(){});
},4000);

bvol.addEventListener('click', function(e){
  e.stopPropagation();
  vid.muted=!vid.muted;
  syncVol();
});
function syncVol(){
  isMuted=vid.muted;
  bvol.classList.toggle('is-muted', isMuted);
  bvol.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
  if(isMuted){
    vico.innerHTML='<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16.5" y1="9.5" x2="22.5" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="22.5" y1="9.5" x2="16.5" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';
  } else {
    vico.innerHTML='<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>';
  }
}

livepill.addEventListener('click', function(){
  if(!isLive||!vid.seekable||!vid.seekable.length) return;
  var edge=vid.seekable.end(vid.seekable.length-1);
  vid.currentTime=edge;
  uPaused=false;
  if(vid.paused) vid.play().catch(function(){});
});
setInterval(function(){
  if(!isLive){livepill.style.display='none';toplive.hidden=true;return;}
  toplive.hidden=false;
  if(!vid.seekable||!vid.seekable.length) return;
  var edge=vid.seekable.end(vid.seekable.length-1);
  var behind=edge-vid.currentTime>12;
  livepill.classList.toggle('behind', behind);   // amber + clickable when behind the live edge
  lpitext.textContent=behind?'Go live':'Live';
},2000);

vid.addEventListener('timeupdate', function(){
  if(isDragging) return;
  var p=(vid.duration&&isFinite(vid.duration))?vid.currentTime/vid.duration*100:99.5;
  setP(p);
});
vid.addEventListener('progress', function(){
  if(!vid.buffered.length||!isFinite(vid.duration)) return;
  pbuf.style.width=(vid.buffered.end(vid.buffered.length-1)/vid.duration*100)+'%';
});
vid.addEventListener('loadedmetadata', function(){
  isLive=!isFinite(vid.duration)||vid.duration>86400;
  ctrls.classList.toggle('is-live', isLive);   // seek bar only shows for on-demand streams
  if(!isLive) livepill.style.display='none';
});

function setP(p){p=Math.max(0,Math.min(100,p));ppl.style.width=p+'%';pth.style.left=p+'%';}
function spct(e){var r=prog.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;return Math.max(0,Math.min(1,x/r.width));}
function applySeek(f){if(!isFinite(vid.duration)) return;vid.currentTime=f*vid.duration;setP(f*100);}
prog.addEventListener('mousedown',  function(e){isDragging=true;prog.classList.add('drag');applySeek(spct(e));});
prog.addEventListener('touchstart', function(e){isDragging=true;prog.classList.add('drag');applySeek(spct(e));},{passive:true});
document.addEventListener('mousemove',  function(e){if(isDragging) applySeek(spct(e));});
document.addEventListener('touchmove',  function(e){if(isDragging){e.preventDefault();applySeek(spct(e));}},{passive:false});
document.addEventListener('mouseup',    function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});
document.addEventListener('touchend',   function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});

// ── Quality selector ──────────────────────────────────────────────
// A real in-player menu (glass panel above the control bar) instead of the
// old hidden native <select>: every available rendition is listed, the
// active one is highlighted, and picking one swaps the stream in place.
var TICK_SVG = '<svg class="qtick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function buildQMenu(){
  var avail = Q_ORDER.filter(function(q){ return qStreams[q]; });
  qlist.innerHTML = avail.map(function(q){
    return '<button type="button" role="menuitem" class="qopt' + (q === currentQ ? ' active' : '') +
           '" data-q="' + q + '"><span>' + q + '</span>' + TICK_SVG + '</button>';
  }).join('');
  return avail.length;
}

function closeQMenu(){
  qmenu.classList.remove('open');
  bq.classList.remove('open');
  bq.setAttribute('aria-expanded','false');
}

// Centres the menu over the quality button and lifts it just above the bar.
function placeQMenu(){
  var pr=player.getBoundingClientRect(), br=bq.getBoundingClientRect(), bb=bar.getBoundingClientRect();
  var mw=qmenu.offsetWidth;
  var left=br.left+br.width/2-pr.left-mw/2;
  left=Math.max(8,Math.min(pr.width-mw-8,left));
  qmenu.style.left=left+'px';
  qmenu.style.bottom=(pr.bottom-bb.top+10)+'px';
}

function openQMenu(){
  if(!buildQMenu()) return;
  qmenu.classList.add('open');
  bq.classList.add('open');
  bq.setAttribute('aria-expanded','true');
  placeQMenu();
  showCtrls();
}

bq.addEventListener('click', function(e){
  e.stopPropagation();
  e.preventDefault();
  if(qmenu.classList.contains('open')) closeQMenu();
  else openQMenu();
});

qlist.addEventListener('click', function(e){
  var btn = e.target.closest('.qopt');
  if(!btn) return;
  e.stopPropagation();
  var q = btn.getAttribute('data-q');
  closeQMenu();
  playerActivated = true;
  if(q && q !== currentQ) switchQ(q);
});

qmenu.addEventListener('click', function(e){ e.stopPropagation(); });
document.addEventListener('click', function(e){
  if(!qmenu.classList.contains('open')) return;
  if(e.target.closest('#qmenu') || e.target.closest('#bq')) return;
  closeQMenu();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeQMenu(); });

function switchQ(q){
  if(!qStreams[q]) return;
  currentQ=q; qlbl.textContent=q; topquality.textContent=q;
  buildQMenu();
  showLoad();
  loadStream(qStreams[q],[]);
}

function applyFillMode(idx){
  var m=FILL_MODES[idx];
  vid.style.objectFit=m.fit;
  vid.style.transform=m.scale!==1?'scale('+m.scale+')':'none';
  fillico.innerHTML=m.icon;
  bfill.title=m.title;
}
applyFillMode(0);
bfill.addEventListener('click', function(e){
  e.stopPropagation();
  fillModeIdx=(fillModeIdx+1)%FILL_MODES.length;
  applyFillMode(fillModeIdx);
});

if(!document.pictureInPictureEnabled) bpip.style.display='none';
bpip.addEventListener('click', function(e){
  e.stopPropagation();
  if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
  else vid.requestPictureInPicture().catch(function(){});
});

bfs.addEventListener('click', function(e){
  e.stopPropagation();
  var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  if(!inFs){
    var p=player;
    var req=p.requestFullscreen||p.webkitRequestFullscreen||p.mozRequestFullScreen;
    if(req){
      var fsResult=req.call(p);
      if(fsResult && typeof fsResult.then==='function'){
        fsResult.then(function(){
          if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
        }).catch(function(){
          if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
        });
      } else {
        if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
      }
    } else if(vid.webkitEnterFullscreen){
      vid.webkitEnterFullscreen();
    }
  } else {
    var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(ex){
      var exResult=ex.call(document);
      if(exResult && typeof exResult.catch==='function') exResult.catch(function(){});
    }
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
});

function syncFs(){
  var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  fsico.innerHTML=inFs
    ?'<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>'
    :'<path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/>';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(e){document.addEventListener(e,syncFs);});

/* ── Chromecast ──────────────────────────────────────────────────────
   Casts the currently-playing manifest URL straight to the receiver
   via the Cast Sender Framework, independent of the local Shaka
   player instance (which this file recreates on every retry). */
function castContentType(url){
  if(/\.m3u8(\?|$)/i.test(url)) return 'application/x-mpegurl';
  if(/\.mpd(\?|$)/i.test(url))  return 'application/dash+xml';
  return 'video/mp4';
}

function sendToCast(url){
  if(!castSession||!url) return;
  var mediaInfo=new chrome.cast.media.MediaInfo(url,castContentType(url));
  mediaInfo.streamType = isLive ? chrome.cast.media.StreamType.LIVE : chrome.cast.media.StreamType.BUFFERED;
  mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
  mediaInfo.metadata.title = document.title||'Live Stream';
  var request=new chrome.cast.media.LoadRequest(mediaInfo);
  castSession.loadMedia(request).catch(function(err){console.warn('Cast load failed',err);});
}

function updateCastUI(){
  var ctx=cast.framework.CastContext.getInstance();
  castSession=ctx.getCurrentSession();
  if(castSession && currentStreamUrl){
    sendToCast(currentStreamUrl);
    try{vid.pause();}catch(e){}
  }
}

// google-cast-launcher shows/hides and opens the device picker on its own —
// we only need to react once a session connects, to push the stream to it.
window['__onGCastApiAvailable']=function(isAvailable){
  if(!isAvailable||!window.chrome||!chrome.cast) return;
  cast.framework.CastContext.getInstance().setOptions({
    receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
  });
  cast.framework.CastContext.getInstance().addEventListener(
    cast.framework.CastContextEventType.SESSION_STATE_CHANGED, updateCastUI
  );
};

async function tryShaka(url){
  if(shakaPlayer){try{await shakaPlayer.destroy();}catch(e){}shakaPlayer=null;}
  shakaPlayer=new shaka.Player();
  await shakaPlayer.attach(vid);
  shakaPlayer.configure({streaming:{bufferingGoal:4,rebufferingGoal:1,safeSeekOffset:5,lowLatencyMode:true}});
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(t,req){req.allowCrossSiteCredentials=true;});
  await shakaPlayer.load(url);
  currentStreamUrl=url;
  if(castSession) sendToCast(url);
}

function armPlaybackWatchers(){
  var onP=function(){vid.removeEventListener('playing',onP);hideOverlay();};
  vid.addEventListener('playing',onP);
  setTimeout(function(){if(!hasError) hideOverlay();},6000);
}

function tryNativeCascade(all, lastShakaErr){
  var idx = 0;
  function attempt(){
    if (idx >= all.length || !all[idx]) {
      showErr('Playback error', lastShakaErr || 'No playable stream found', false);
      return;
    }
    var url = all[idx++];
    var onErr = function(){
      vid.removeEventListener('error', onErr);
      attempt(); // this URL failed too — cascade to the next fallback
    };
    vid.addEventListener('error', onErr, {once:true});
    vid.src = url;
    currentStreamUrl = url;
    if(castSession) sendToCast(url);
    attemptPlay();
    armPlaybackWatchers();
  }
  attempt();
}

async function loadStream(url,fallbacks){
  hasError=false;
  var all=[url].concat((fallbacks||[]).filter(function(u){return u&&u!==url;}));
  var lastErr=null;

  if(shaka.Player.isBrowserSupported()){
    for(var i=0;i<all.length;i++){
      if(!all[i]) continue;
      try{await tryShaka(all[i]);lastErr=null;break;}
      catch(e){
        var hs=(e.data&&e.data[1])?' (HTTP '+e.data[1]+')':'';
        lastErr='Shaka Error '+(e.code||'?')+hs;
        if(shakaPlayer){try{await shakaPlayer.destroy();}catch(x){}shakaPlayer=null;}
      }
    }
  } else {lastErr='unsupported';}

  if(lastErr){
    if(vid.canPlayType('application/vnd.apple.mpegurl')){
      // Shaka couldn't play any URL — fall back to the browser's native HLS
      // support (Safari) and cascade through every remaining fallback URL,
      // not just the first one, before giving up.
      tryNativeCascade(all, lastErr);
      return;
    }
    showErr('Playback error',lastErr,false);
    return;
  }

  await attemptPlay();
  armPlaybackWatchers();
}

function fetchJSON(url){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=12000;
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText));}catch(e){rej(new Error('JSON parse error'));}}
      else rej(new Error('HTTP '+x.status));
    };
    x.onerror=function(){rej(new Error('Network error'));};
    x.ontimeout=function(){rej(new Error('Timeout'));};
    x.send();
  });
}

function resolve(data){
  var list=Array.isArray(data)?data:(Array.isArray(data.matches)?data.matches:[]);
  if(!list.length) throw new Error('No matches in JSON');
  var m=null;
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)){m=list[i];break;}
  if(!m) throw new Error('Match "'+matchId+'" not found ('+list.length+' total)');
  var s=m.streams||{};
  var fb=[s.primary,s.fancode_cdn,s.fancode_lk_cdn,s.fancode_bd_cdn,s.fancode_np_cdn].filter(Boolean);
  if(si===0){
    var as=m.auto_streams||{};
    var keys=Object.keys(as);
    if(!keys.length) throw new Error('No live stream — match not started yet');
    var lang=LANG_MAP[langCode]||m.language||keys[0];
    var al=as[lang]||as[keys[0]];
    if(!al||!al.streams||!Object.keys(al.streams).length) throw new Error('Stream URLs empty for this match');
    return{type:'multi',streams:al.streams,fallbacks:fb};
  }
  var u=si===1?s.fancode_lk_cdn:si===2?s.fancode_np_cdn:si===3?s.fancode_bd_cdn:null;
  if(!u) throw new Error('Regional stream (s='+si+') not available');
  return{type:'single',url:u,fallbacks:fb};
}

// Glass sheen follows the pointer along the bar; the quality menu closes on resize.
bar.addEventListener('pointermove', function(e){
  var r=bar.getBoundingClientRect();
  bar.style.setProperty('--hx', ((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
});
window.addEventListener('resize', closeQMenu);

shaka.polyfill.installAll();
function start(){
  clearTimeout(retryTimer);
  showLoad();
  if(!matchId){showErr('Missing match ID','URL: ?id=MATCHID_LANG&s=0',false);return;}
  fetchJSON(JSON_URL).then(function(data){
    var r;
    try{r=resolve(data);}
    catch(e){showErr('Stream unavailable',e.message,true);retryTimer=setTimeout(start,8000);return;}
    if(r.type==='multi'){
      qStreams=r.streams;
      var url=r.streams[DEFAULT_Q]||r.streams['720p']||r.streams['480p']||r.streams['1080p']||r.streams['360p']||r.streams['240p'];
      if(!url){showErr('No stream URL','All quality URLs empty for this match',true);return;}
      currentQ=Q_ORDER.find(function(q){return r.streams[q]===url;})||DEFAULT_Q;
      qlbl.textContent=currentQ;
      bq.style.display='';
      topquality.hidden=false; topquality.textContent=currentQ;
      loadStream(url,r.fallbacks);
    } else {
      bq.style.display='none';
      topquality.hidden=true;
      loadStream(r.url,r.fallbacks);
    }
  }).catch(function(e){showErr('Could not load data',e.message,true);retryTimer=setTimeout(start,8000);});
}
document.getElementById('retryNow').addEventListener('click', function(){ start(); });
start();
})();
