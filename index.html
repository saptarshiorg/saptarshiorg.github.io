<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>India Matches — EV Sports</title>
<meta name="description" content="Live and upcoming India sports matches.">
<link rel="icon" href="https://raw.githubusercontent.com/saptarshiorg/saptarshiorg.github.io/refs/heads/main/magenta.png" type="image/png">
<script>const SHEET_ID='1UcPVLGxSTJmAdtfPHsA_f5VCtbABwVdwef-va512HQU';</script>
<style>
:root{--bg:#09090c;--card:#15151b;--pink:#f04f8c;--pink2:#c21764;--muted:#9c9ca8;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:64px}button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#0b0b0e;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.04em}.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover}.brand b{color:var(--pink)}
.live{color:var(--muted);font-size:12px}.live i{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#ff315f}
#status{text-align:center;color:var(--muted);padding:70px 20px}.spinner{width:24px;height:24px;margin:0 auto 14px;border:3px solid #402033;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#hero{display:none;margin:16px;border-radius:14px;overflow:hidden;background:#17131a;border:1px solid var(--line)}#hero.show{display:block}.heroBody{padding:22px}.heroBadge{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--pink);font-size:11px;font-weight:700}.heroTeams{display:flex;align-items:center;gap:14px;margin:18px 0 8px;font-size:23px;font-weight:800}.heroTeams img{width:42px;height:42px;object-fit:contain}.heroMeta{color:var(--muted);font-size:12px}.watch{border:0;border-radius:8px;padding:10px 16px;margin-top:16px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-weight:700}
.section{margin:26px 0}.section h2{font-size:18px;margin:0 18px 12px}.count{color:var(--muted);font-size:12px;margin-left:6px}.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 12px;scroll-snap-type:x proximity}.card{flex:0 0 235px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.cardTop{height:112px;display:flex;align-items:center;justify-content:center;gap:10px;background:#111116}.team{width:76px;text-align:center;font-weight:800}.team img{display:block;width:38px;height:38px;margin:0 auto 5px;object-fit:contain}.vs{color:var(--pink);font-weight:800}.cardBody{padding:12px}.names{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd;font-size:12px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin:9px 0}.card button{width:100%;padding:8px;border:0;border-radius:7px;background:#321725;color:#ff8fbb;font-weight:700}.empty{text-align:center;color:var(--muted);padding:55px 20px}
#searchBox{display:none;position:fixed;left:12px;right:12px;bottom:72px;z-index:8;padding:10px;background:#17171d;border:1px solid var(--line);border-radius:10px}#searchBox.show{display:block}#search{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#0d0d11;color:#fff;outline:0}#search:focus{border-color:var(--pink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;height:60px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:#0d0d11;border-top:1px solid var(--line)}.tab{flex:1;border:0;background:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700}.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2}.tab.active{color:var(--pink)}
#player{display:none;position:fixed;inset:0;z-index:10;background:#000;flex-direction:column}#player.open{display:flex}.playerHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.close{width:34px;height:34px;border:0;border-radius:50%;background:#222;color:#fff}.frame{flex:1}.frame iframe{width:100%;height:100%;border:0}
@media(min-width:700px){body{max-width:1200px;margin:auto}.rail{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.card{width:auto}.section h2{margin-left:0}#hero{margin-left:0;margin-right:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand"><img src="https://raw.githubusercontent.com/saptarshiorg/saptarshiorg.github.io/refs/heads/main/magenta.png" alt="EV"><span>EV <b>INDIA MATCHES</b></span></div><div class="live"><i></i><span id="liveCount">0 LIVE</span></div></header>
<main id="home"><div id="status"><div class="spinner"></div>Loading matches…</div><section id="hero"></section><div id="matches"></div></main>
<div id="searchBox"><input id="search" type="search" placeholder="Search India matches…" autocomplete="off"></div>
<nav id="tabs" aria-label="Navigation"><button class="tab active" id="homeTab" type="button"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 3l9 8.5M5 10v10h14V10"/></svg><span>Home</span></button><button class="tab" id="searchTab" type="button"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Search</span></button></nav>
<div id="player"><div class="playerHead"><strong id="playerTitle">Stream</strong><button class="close" id="closePlayer" type="button">×</button></div><div class="frame"><iframe id="frame" allow="autoplay;fullscreen" allowfullscreen loading="lazy"></iframe></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);let matches=[];let refreshTimer;
function csv(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell.trim());cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(Boolean))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.trim());out.push(row)}return out}
function objects(text){const rows=csv(text);if(rows.length<2)return[];const h=rows[0].map(x=>x.toLowerCase().replace(/[^a-z0-9_]/g,'_'));return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}
async function load(){try{const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('MATCH CARDS')}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);const data=objects(await r.text());matches=data.filter(active).filter(india);render()}catch(e){console.warn(e);$('#status').innerHTML='<div class="empty">Could not load matches. Please try again later.</div>'}}
function active(x){const v=(x.active_true_false||x.active||x.enabled||'').toUpperCase();return !['FALSE','NO','0','OFF'].includes(v)}function india(x){return /india|\bind\b/i.test([x.team1_code,x.team2_code,x.team1_full_name,x.team2_full_name,x.details,x.game,x.country].join(' '))}function status(x){const s=(x.status||'').toLowerCase();return s==='live'?'live':(s==='finished'||s==='completed'?'finished':'upcoming')}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x,i){const st=status(x);return `<article class="card"><div class="cardTop"><div class="team"><img loading="lazy" decoding="async" src="${safe(x.team1_logo_url)}" alt=""><span>${safe(x.team1_code||x.team1_full_name)}</span></div><span class="vs">VS</span><div class="team"><img loading="lazy" decoding="async" src="${safe(x.team2_logo_url)}" alt=""><span>${safe(x.team2_code||x.team2_full_name)}</span></div></div><div class="cardBody"><div class="names">${safe(x.team1_full_name||x.team1_code)} vs ${safe(x.team2_full_name||x.team2_code)}</div><div class="meta"><span>${safe(x.game||'Cricket')}</span><span>${safe(x.date_label)}</span></div><button type="button" data-match="${i}">${st==='live'?'▶ Watch Live':'View Stream'}</button></div></article>`}
function render(){const q=$('#search').value.trim().toLowerCase();const list=matches.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#status').style.display='none';const live=list.filter(x=>status(x)==='live'),up=list.filter(x=>status(x)==='upcoming'),done=list.filter(x=>status(x)==='finished');$('#liveCount').textContent=`${matches.filter(x=>status(x)==='live').length} LIVE`;let html='';for(const [title,arr] of [['🔴 Live Now',live],['⏰ Upcoming',up],['✅ Finished',done]])if(arr.length)html+=`<section class="section"><h2>${title}<span class="count">${arr.length}</span></h2><div class="rail">${arr.map(x=>card(x,matches.indexOf(x))).join('')}</div></section>`;$('#matches').innerHTML=html||'<div class="empty">No matching India matches.</div>';const hero=live[0]||up[0];if(hero&&!q){$('#hero').className='show';$('#hero').innerHTML=`<div class="heroBody"><span class="heroBadge">${status(hero)==='live'?'🔴 LIVE NOW':'⏰ UPCOMING'}</span><div class="heroTeams"><span>${safe(hero.team1_code||hero.team1_full_name)}</span><b>VS</b><span>${safe(hero.team2_code||hero.team2_full_name)}</span></div><div class="heroMeta">${safe(hero.game||'Cricket')} · ${safe(hero.date_label)}</div><button class="watch" data-match="${matches.indexOf(hero)}">▶ Watch Now</button></div>`}else $('#hero').className=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-match]');if(!b)return;const m=matches[Number(b.dataset.match)],url=m&&(m.btn_url||m.btn_url_2);if(!url)return alert('No stream server configured for this match yet.');$('#playerTitle').textContent=`${m.team1_code||''} vs ${m.team2_code||''}`;$('#frame').src=url;$('#player').classList.add('open');document.body.style.overflow='hidden'});$('#closePlayer').onclick=()=>{$('#player').classList.remove('open');$('#frame').src='about:blank';document.body.style.overflow=''};$('#search').oninput=render;$('#searchTab').onclick=()=>{$('#searchBox').classList.add('show');$('#searchTab').classList.add('active');$('#homeTab').classList.remove('active');$('#search').focus()};$('#homeTab').onclick=()=>{ $('#search').value='';render();$('#searchBox').classList.remove('show');$('#homeTab').classList.add('active');$('#searchTab').classList.remove('active');window.scrollTo({top:0,behavior:'smooth'})};load();refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')load()},120000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!refreshTimer)refreshTimer=setInterval(load,120000)});
</script>
</body>
</html>
