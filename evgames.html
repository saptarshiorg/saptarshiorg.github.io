  .cell:hover:not(.filled){border-color:var(--acc)}.cell:active:not(.filled){transform:scale(.96)}

&lt;div class="stage">

          &lt;div class="who" id="nameX">Player One&lt;/div>
          &lt;div class="mk">✕&lt;/div>
          &lt;div class="val" id="scoreX">0&lt;/div>
        &lt;/div>

          &lt;div class="who">Draws&lt;/div>

          &lt;div class="val" id="scoreDraw">0&lt;/div>

&lt;script>
(function(){
  const setupScreen = document.getElementById('setupScreen');
  const gameScreen = document.getElementById('gameScreen');
  const p1Input = document.getElementById('p1');
  const p2Input = document.getElementById('p2');
  const startBtn = document.getElementById('startBtn');
  const changePlayersBtn = document.getElementById('changePlayersBtn');
  const boardEl = document.getElementById('board');
  const statusText = document.getElementById('statusText');
  const nameXEl = document.getElementById('nameX');
  const nameOEl = document.getElementById('nameO');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDrawEl = document.getElementById('scoreDraw');
  const cardX = document.getElementById('cardX');
  const cardO = document.getElementById('cardO');
  const resetScoreBtn = document.getElementById('resetScoreBtn');
  const newRoundBtn = document.getElementById('newRoundBtn');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let names = { X: 'Player One', O: 'Player Two' };
  let scores = { X: 0, O: 0, D: 0 };
  let board = Array(9).fill(null);
  let current = 'X';
  let active = true;

  function xIcon(){
    return `&lt;svg class="x-mark" viewBox="0 0 100 100">&lt;line x1="20" y1="20" x2="80" y2="80"/>&lt;line x1="80" y1="20" x2="20" y2="80"/>&lt;/svg>`;
  }
  function oIcon(){
    return `&lt;svg class="o-mark" viewBox="0 0 100 100">&lt;circle cx="50" cy="50" r="34"/>&lt;/svg>`;
  }

  function buildBoard(){
    boardEl.innerHTML = '';
    for(let i=0;i&lt;9;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }

  function onCellClick(e){
    const i = Number(e.currentTarget.dataset.index);
    if(!active || board[i]) return;
    placeMark(i, current);
    const result = checkWin();
    if(result){
      endRound(result);
    } else if(board.every(c => c)){
      endRound({ draw:true });
    } else {
      current = current === 'X' ? 'O' : 'X';
      updateStatus();
    }
  }

  function placeMark(i, mark){
    board[i] = mark;
    const cell = boardEl.children[i];
    cell.classList.add('filled');
    cell.innerHTML = mark === 'X' ? xIcon() : oIcon();
  }

  function checkWin(){
    for(const line of WIN_LINES){
      const [a,b,c] = line;
      if(board[a] &amp;&amp; board[a] === board[b] &amp;&amp; board[a] === board[c]){
        return { winner: board[a], line };
      }
    }
    return null;
  }

  function endRound(result){
    active = false;
    if(result.draw){
      scores.D++;
      scoreDrawEl.textContent = scores.D;
      statusText.innerHTML = `Round drawn — &lt;span class="flag">no winner&lt;/span>`;
    } else {
      const { winner, line } = result;
      line.forEach(i => {
        boardEl.children[i].classList.add('win');
        if(winner === 'O') boardEl.children[i].classList.add('win-o');
      });
      scores[winner]++;
      (winner === 'X' ? scoreXEl : scoreOEl).textContent = scores[winner];
      const winnerName = winner === 'X' ? names.X : names.O;
      const flagClass = winner === 'O' ? 'flag o' : 'flag';
      statusText.innerHTML = `&lt;span class="${flagClass}">${escapeHtml(winnerName)}&lt;/span> takes the round`;
    }
    highlightTurn(null);
  }

  function updateStatus(){
    const playerName = current === 'X' ? names.X : names.O;
    const flagClass = current === 'O' ? 'flag o' : 'flag';
    statusText.innerHTML = `&lt;span class="${flagClass}">${escapeHtml(playerName)}&lt;/span>'s move`;
    highlightTurn(current);
  }

  function highlightTurn(mark){
    cardX.classList.toggle('active', mark === 'X');
    cardO.classList.toggle('active', mark === 'O');
  }

  function newRound(){
    board = Array(9).fill(null);
    active = true;
    current = 'X';
    buildBoard();
    updateStatus();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  startBtn.addEventListener('click', () => {
    names.X = p1Input.value.trim() || 'Player One';
    names.O = p2Input.value.trim() || 'Player Two';
    nameXEl.textContent = names.X;
    nameOEl.textContent = names.O;
    scores = { X:0, O:0, D:0 };
    scoreXEl.textContent = 0;
    scoreOEl.textContent = 0;
    scoreDrawEl.textContent = 0;
    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    newRound();
  });

  [p1Input, p2Input].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter') startBtn.click();
    });
  });

  newRoundBtn.addEventListener('click', newRound);

  resetScoreBtn.addEventListener('click', () => {
    scores = { X:0, O:0, D:0 };
    scoreXEl.textContent = 0;
    scoreOEl.textContent = 0;
    scoreDrawEl.textContent = 0;
    newRound();
  });

  changePlayersBtn.addEventListener('click', () => {
    gameScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
  });

  buildBoard();
})();
&lt;/script>

</script>
