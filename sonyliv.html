<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV SONYLIV — Match Board</title>

<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0a0b0d;
  --card:#131519;
  --card-2:#1a1d22;
  --border:#26292f;
  --muted:#868b94;
  --text:#f5f6f8;
  --orange:#ff5a1f;
  --orange-deep:#e8380d;
  --orange-soft:rgba(255,90,31,.14);
  --orange-soft-border:rgba(255,90,31,.4);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Satoshi', 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{ user-select:none; }
button, input{ font-family:inherit; }
img{ -webkit-user-drag:none; }
a{ color:inherit; text-decoration:none; }

.app{ max-width:1360px; margin:0 auto; padding:0 20px 60px; }

header{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  padding:18px 4px;
  background:rgba(10,11,13,0.9);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  margin-bottom:26px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-logos{ display:flex; align-items:center; gap:10px; background:transparent; }
.brand-logos img{ height:36px; width:auto; background:transparent; display:block; }
.brand-divider{ width:1px; height:22px; background:var(--border); }
.brand-text{ display:flex; flex-direction:column; gap:4px; }
.last-update{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.4px;
  font-weight:500;
}

.controls{
  display:flex; justify-content:flex-end;
  margin-bottom:22px;
}
.search-wrap{
  position:relative;
  width:100%; max-width:340px;
}
.search-wrap svg{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  opacity:.5; pointer-events:none;
}
.search-wrap input{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  font-size:13px;
  font-weight:500;
  letter-spacing:.3px;
  padding:11px 14px 11px 38px;
  border-radius:0;
  outline:none;
  transition:border-color .2s ease;
}
.search-wrap input::placeholder{ color:var(--muted); }
.search-wrap input:focus{ border-color:var(--orange); }

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:20px;
}

.loading-state, .empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:13.5px;
  letter-spacing:.5px;
  border:1px dashed var(--border);
  border-radius:0;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:0;
  overflow:hidden;
  box-shadow:none;
  transition:border-color .2s ease;
  display:flex; flex-direction:column;
}
.card:hover{ border-color:var(--orange-soft-border); }

.thumb-wrap{
  position:relative;
  width:100%;
  height:180px;
  background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.thumb-wrap img{ width:100%; height:100%; object-fit:contain; display:block; }
.lang-badge{
  position:absolute; top:10px; left:10px;
  display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.75);
  border:1px solid var(--orange);
  color:var(--orange);
  font-size:10px;
  font-weight:700;
  letter-spacing:.6px;
  padding:5px 9px;
  border-radius:0;
}
.lang-badge svg{ flex:none; }

.meta{
  padding:16px 18px 18px;
  display:flex; flex-direction:column; gap:9px;
  flex:1;
  text-align:center;
}
.teams{
  font-size:17px;
  font-weight:800;
  letter-spacing:.2px;
  text-transform:uppercase;
  line-height:1.28;
}
.event{ font-size:12.5px; color:var(--muted); letter-spacing:.2px; font-weight:500; }

.status-badge{
  position:absolute; top:10px; right:10px;
  display:flex; align-items:center; gap:5px;
  background:rgba(0,0,0,.6);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.6px;
  padding:4px 9px;
  border-radius:0;
  opacity:.95;
}
.status-badge.live{ color:var(--orange); border:1px solid var(--orange-soft-border); }
.status-badge.upcoming{ color:#c7cad0; border:1px solid rgba(138,143,153,.4); }
.status-badge.completed{ color:#c7cad0; border:1px solid rgba(138,143,153,.3); }
.status-dot-mini{ width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
.status-badge.live .status-dot-mini{ animation:miniPulse 1.8s infinite; }
@keyframes miniPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

.card-time{ font-size:11px; color:var(--muted); letter-spacing:.3px; font-weight:500; }

.actions{ margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:4px; }

.btn{
  appearance:none; border:none; cursor:pointer;
  width:100%;
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
  padding:12px 14px;
  border-radius:0;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .2s ease, transform .15s ease;
}
.btn:active{ transform:scale(.98); }
.btn-watch-now{ background:var(--orange); color:#fff; box-shadow:none; }
.btn-watch-now:hover{ background:var(--orange-deep); }
.btn-watch-now.is-disabled{ background:var(--card-2); color:var(--muted); box-shadow:none; cursor:not-allowed; }
.btn-upcoming{ background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none; }
.btn-upcoming:hover{ border-color:var(--orange); color:var(--orange); }
.btn-completed{ background:var(--card-2); color:var(--muted); box-shadow:none; border:1px solid var(--border); cursor:default; }

.btn-ww{ background:transparent; color:var(--text); border:1px solid var(--border); }
.btn-ww:hover{ border-color:var(--orange); color:var(--orange); }
.btn-ww .chev{ margin-left:auto; transition:transform .3s ease; }
.btn-ww.open{ border-color:var(--orange); color:var(--orange); }
.btn-ww.open .chev{ transform:rotate(180deg); }

.ww-panel-wrap{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1), opacity .3s ease;
}
.ww-panel-wrap.open{ grid-template-rows:1fr; opacity:1; margin-top:1px; }
.ww-panel-inner{ overflow:hidden; display:flex; flex-direction:column; gap:6px; }
.ww-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px;
  background:var(--card-2);
  border:1px solid var(--border);
  border-left:2px solid transparent;
  border-radius:0;
  cursor:pointer;
  transition:background .2s ease, border-color .2s ease;
}
.ww-row:hover{ background:var(--orange-soft); border-color:var(--orange-soft-border); border-left-color:var(--orange); }
.ww-name{ font-size:12px; font-weight:700; flex:1; text-align:left; letter-spacing:.2px; }
.ww-code{ font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--muted); }
.ww-row:hover .ww-code{ color:var(--orange); }

footer{
  margin-top:50px;
  padding-top:26px;
  border-top:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  text-align:center;
}
footer .note{ font-size:11px; letter-spacing:1px; color:var(--muted); font-weight:700; }

.player-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.9);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:99999;
}
.player-overlay.hidden{ display:none; }
.player-wrap{ width:100%; max-width:920px; background:#000; border:1px solid var(--orange); }
.player-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  font-size:12px; font-weight:700; letter-spacing:.4px;
  color:var(--text);
}
.player-close{
  appearance:none; border:1px solid var(--border); background:transparent;
  color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.4px;
  padding:6px 10px; cursor:pointer; border-radius:0;
}
.player-close:hover{ border-color:var(--orange); color:var(--orange); }
#playerVideo{ width:100%; max-height:70vh; display:block; background:#000; }

button:focus-visible, .ww-row:focus-visible, input:focus-visible{
  outline:2px solid var(--orange);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

@media (max-width:450px){
  .brand-logos img{ height:26px; }
  .controls{ justify-content:stretch; }
  .search-wrap{ max-width:100%; }
}

</style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="brand-logos">
        <img src="https://raw.githubusercontent.com/saptarshiorg/saptarshiorg.github.io/refs/heads/main/magenta.png" alt="EV logo">
        <div class="brand-divider"></div>
        <img src="https://origin-staticv2.sonyliv.com/pwa_web/assets/images/sonyliv-logo-white.svg" alt="SonyLIV logo" onerror="this.onerror=null;this.style.display='none';">
      </div>
      <div class="brand-text">
        <div class="last-update" id="lastUpdate">LAST UPDATE: LOADING...</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="SEARCH EVENT OR CATEGORY...">
    </div>
  </div>

  <div id="matchesGrid" class="grid">
    <div class="loading-state">LOADING MATCHES...</div>
  </div>

  <footer>
    <div class="note">CREDITS TO RISHI.EV | Saptarshi Samanta</div>
  </footer>

</div>

<div class="player-overlay hidden" id="playerModal">
  <div class="player-wrap">
    <div class="player-head">
      <span id="playerTitle">Live</span>
      <button type="button" class="player-close" id="playerClose">CLOSE ✕</button>
    </div>
    <video id="playerVideo" controls autoplay playsinline></video>
  </div>
</div>

<script>
const SONYLIV_SOURCE = 'https://raw.githubusercontent.com/kajju027/SonyLiv-Events-Json/main/sonyliv.json';
const FALLBACK_IMG = 'https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg';
const REFRESH_INTERVAL_MS = 60000;

const LANG_CODE_MAP = {
  ENGLISH:'eng', HINDI:'hin', BANGLA:'ban', BENGALI:'ban', TAMIL:'tam',
  TELUGU:'tel', KANNADA:'kan', MARATHI:'mar', MALAYALAM:'mal', PUNJABI:'pan',
  GUJARATI:'guj', URDU:'urd', ODIA:'ori', ASSAMESE:'asm', BHOJPURI:'bho'
};

const ICON_GLOBE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.7 3.8 6 3.8 9s-1.4 6.3-3.8 9c-2.4-2.7-3.8-6-3.8-9s1.4-6.3 3.8-9z"/></svg>';
const ICON_WW    = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.7 3.8 6 3.8 9s-1.4 6.3-3.8 9c-2.4-2.7-3.8-6-3.8-9s1.4-6.3 3.8-9z"/></svg>';
const ICON_CHEV  = '<svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';

const grid = document.getElementById('matchesGrid');
const lastUpdateEl = document.getElementById('lastUpdate');
const searchInput = document.getElementById('searchInput');
const playerModal = document.getElementById('playerModal');
const playerVideo = document.getElementById('playerVideo');
const playerTitle = document.getElementById('playerTitle');

let allMatches = [];
let openPanels = new Set();
let activeHls = null;

function esc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[s]));
}

function langLabel(rawLang){
  const lang = String(rawLang || '').trim().toUpperCase();
  if(!lang) return null;
  return lang;
}

function langShort(rawLang){
  const lang = String(rawLang || '').trim().toUpperCase();
  if(LANG_CODE_MAP[lang]) return LANG_CODE_MAP[lang].toUpperCase();
  return lang.slice(0, 3) || 'ENG';
}

function cleanTitle(name, fallback){
  let t = (name && String(name).trim()) ? String(name).trim() : (fallback || '');
  t = t.replace(/^Upcoming\s*-\s*/i, '');
  t = t.replace(/\s*\[[A-Z]+\]\s*$/, '');
  return t || 'Match';
}

function buildMatches(data){
  const raw = data.matches || [];
  const groups = {};
  const order = [];

  raw.forEach(m => {
    const idStr = String(m.match_id);
    const langSuffix = idStr.match(/_([A-Za-z]+)$/);
    const baseId = langSuffix ? idStr.slice(0, idStr.length - langSuffix[0].length) : idStr;
    const status = String(m.status || '').toUpperCase();
    const url = m.video_url || m.dai_url || m.pub_url || null;

    if(!groups[baseId]){
      groups[baseId] = {
        baseId,
        status,
        category: m.category || '',
        broadcast: m.digital_broadcast || '',
        eventName: m.event_name || 'Match',
        matchName: m.match_name || '',
        poster: m.poster || FALLBACK_IMG,
        entries: []
      };
      order.push(baseId);
    }
    groups[baseId].entries.push({ lang: m.language, url });
  });

  return order.map(baseId => {
    const g = groups[baseId];
    const withUrl = g.entries.filter(e => e.url);
    const primary = withUrl[0] || g.entries[0];
    const alt = withUrl.filter(e => e !== primary);

    return {
      id: g.baseId,
      title: cleanTitle(g.matchName, g.eventName),
      tournament: [g.category, g.broadcast].filter(Boolean).join(' • '),
      image: g.poster,
      status: g.status === 'LIVE' ? 'LIVE' : (g.status === 'COMPLETED' ? 'COMPLETED' : 'UPCOMING'),
      primaryUrl: primary ? primary.url : null,
      primaryLang: primary ? primary.lang : null,
      altLangs: alt
    };
  });
}

function renderCard(m){
  const langTag = m.status === 'LIVE' ? langLabel(m.primaryLang) : null;

  let statusHtml = '';
  let actionsHtml = '';

  if(m.status === 'LIVE'){
    statusHtml = `<span class="status-badge live"><span class="status-dot-mini"></span>LIVE</span>`;

    const canWatch = !!m.primaryUrl;
    const watchAttrs = canWatch
      ? `data-url="${esc(m.primaryUrl)}" data-title="${esc(m.title)}"`
      : 'disabled';

    const hasAlt = m.altLangs && m.altLangs.length > 0;
    const isOpen = openPanels.has(String(m.id));

    actionsHtml = `
      <button type="button" class="btn btn-watch-now ${canWatch ? '' : 'is-disabled'}" ${watchAttrs}>WATCH NOW</button>
      ${hasAlt ? `
      <button type="button" class="btn btn-ww ${isOpen ? 'open' : ''}" data-target="ww-${m.id}">
        ${ICON_WW} MORE LANGUAGES ${ICON_CHEV}
      </button>
      <div class="ww-panel-wrap ${isOpen ? 'open' : ''}" id="ww-${m.id}">
        <div class="ww-panel-inner">
          ${m.altLangs.map(o => `
            <div class="ww-row" tabindex="0" data-url="${esc(o.url)}" data-title="${esc(m.title)}">
              <span class="ww-name">${esc(langLabel(o.lang) || 'STREAM')}</span>
              <span class="ww-code">${esc(langShort(o.lang))}</span>
            </div>`).join('')}
        </div>
      </div>` : ''}
    `;
  } else if(m.status === 'COMPLETED'){
    statusHtml = `<span class="status-badge completed"><span class="status-dot-mini"></span>ENDED</span>`;
    actionsHtml = `<div class="btn btn-completed">ENDED</div>`;
  } else {
    statusHtml = `<span class="status-badge upcoming"><span class="status-dot-mini"></span>UPCOMING</span>`;
    actionsHtml = `<button type="button" class="btn btn-upcoming" data-upcoming="${esc(m.tournament || 'Details coming soon')}">UPCOMING</button>`;
  }

  return `
    <article class="card" data-match-id="${esc(m.id)}">
      <div class="thumb-wrap">
        <img src="${esc(m.image)}" alt="${esc(m.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
        ${langTag ? `<span class="lang-badge">${ICON_GLOBE}${esc(langTag)}</span>` : ''}
        ${statusHtml}
      </div>
      <div class="meta">
        <div class="teams">${esc(m.title)}</div>
        <div class="event">${esc(m.tournament)}</div>
        <div class="card-time">SONYLIV</div>
        <div class="actions">${actionsHtml}</div>
      </div>
    </article>
  `;
}

function renderGrid(matches){
  if(!matches.length){
    grid.innerHTML = `<div class="empty-state">No matches found.</div>`;
    return;
  }
  grid.innerHTML = matches.map(renderCard).join('');
}

function openPlayer(url, title){
  playerTitle.textContent = title || 'Live';
  playerModal.classList.remove('hidden');

  if(activeHls){ activeHls.destroy(); activeHls = null; }

  if(playerVideo.canPlayType('application/vnd.apple.mpegurl')){
    playerVideo.src = url;
    playerVideo.play().catch(() => {});
  } else if(window.Hls && window.Hls.isSupported()){
    activeHls = new window.Hls();
    activeHls.loadSource(url);
    activeHls.attachMedia(playerVideo);
    activeHls.on(window.Hls.Events.MANIFEST_PARSED, () => playerVideo.play().catch(() => {}));
  } else {
    playerVideo.src = url;
    playerVideo.play().catch(() => {});
  }
}

function closePlayer(){
  playerModal.classList.add('hidden');
  playerVideo.pause();
  playerVideo.removeAttribute('src');
  playerVideo.load();
  if(activeHls){ activeHls.destroy(); activeHls = null; }
}

function attachHandlers(){
  grid.addEventListener('click', (e) => {
    const watchBtn = e.target.closest('[data-url]');
    if(watchBtn){
      openPlayer(watchBtn.dataset.url, watchBtn.dataset.title);
      return;
    }
    const wwBtn = e.target.closest('.btn-ww');
    if(wwBtn){
      const matchId = wwBtn.closest('.card').dataset.matchId;
      const panel = document.getElementById(wwBtn.dataset.target);
      if(panel){
        const willOpen = !panel.classList.contains('open');
        panel.classList.toggle('open', willOpen);
        wwBtn.classList.toggle('open', willOpen);
        if(willOpen){ openPanels.add(matchId); } else { openPanels.delete(matchId); }
      }
      return;
    }
    const upcomingBtn = e.target.closest('[data-upcoming]');
    if(upcomingBtn){
      alert('This event will go live soon.\n' + upcomingBtn.dataset.upcoming);
    }
  });

  grid.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.ww-row');
    if(row && row.dataset.url){
      e.preventDefault();
      openPlayer(row.dataset.url, row.dataset.title);
    }
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ renderGrid(allMatches); return; }
    const filtered = allMatches.filter(m =>
      m.title.toLowerCase().includes(q) || m.tournament.toLowerCase().includes(q)
    );
    renderGrid(filtered);
  });

  document.getElementById('playerClose').addEventListener('click', closePlayer);
  playerModal.addEventListener('click', (e) => {
    if(e.target === playerModal) closePlayer();
  });
}

async function refresh(){
  try{
    const data = await fetch(SONYLIV_SOURCE, { cache:'no-store' }).then(r => r.json());
    allMatches = buildMatches(data);
    allMatches.sort((a, b) => {
      const rank = s => s === 'LIVE' ? 0 : (s === 'UPCOMING' ? 1 : 2);
      return rank(a.status) - rank(b.status);
    });

    const q = searchInput.value.trim().toLowerCase();
    if(q){
      renderGrid(allMatches.filter(m => m.title.toLowerCase().includes(q) || m.tournament.toLowerCase().includes(q)));
    } else {
      renderGrid(allMatches);
    }
    lastUpdateEl.textContent = 'LAST UPDATE: ' + esc(data.updatedAt || 'UNAVAILABLE').toUpperCase();
  } catch(err){
    console.error('SonyLIV board failed to load:', err);
    grid.innerHTML = `<div class="empty-state">Couldn't load the match board. Try refreshing.</div>`;
    lastUpdateEl.textContent = 'LAST UPDATE: UNAVAILABLE';
  }
}

attachHandlers();
refresh();
setInterval(refresh, REFRESH_INTERVAL_MS);
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</body>
</html>
