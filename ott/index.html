<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EV Stream</title>
<link rel="icon" href="https://raw.githubusercontent.com/saptarshiorg/saptarshiorg.github.io/main/magenta.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506;
  --panel:#0d0d10;
  --edge:rgba(255,255,255,.08);
  --ink:#EDEDF0;
  --ink-dim:#9494A0;
  --ink-mute:#5C5C66;
  --accent-a:#2E6BFF;
  --accent-b:#C724B1;
  --gradient: linear-gradient(90deg,var(--accent-a) 0%,var(--accent-b) 100%);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);height:100%;}
body{
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;
  min-height:100vh;
}
::-webkit-scrollbar{height:0;width:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}

/* TOPBAR */
.topbar{
  position:fixed; top:0; left:0; right:0; height:64px;
  display:flex; align-items:center; gap:12px;
  padding:10px 18px;
  background:linear-gradient(180deg,rgba(5,5,6,.95),rgba(5,5,6,.7));
  z-index:60;
  border-bottom:1px solid rgba(255,255,255,.02);
}
.topbar-brand{font-family:'Clash Display',sans-serif;font-weight:700;font-size:16px;color:#fff;margin-right:8px;}
.topbar-btn{
  padding:8px 12px; border-radius:8px; font-weight:700; font-size:13px; color:var(--ink-dim);
  background:transparent; transition:background .12s,color .12s;
}
.topbar-btn:hover{background:rgba(255,255,255,.03); color:#fff;}
.topbar-btn.active{background:rgba(255,255,255,.04); color:#fff;}
.topbar-spacer{flex:1;}

.main{margin-top:64px;padding-bottom:80px;}

/* rest of layout */
.hero{
  position:relative; height:92vh; min-height:560px;
  display:flex; flex-direction:column; justify-content:flex-end;
  overflow:hidden;
}
.hero-media{position:absolute;inset:0;background:#101014;}
.hero-media img,.hero-media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;transition:opacity .5s ease;}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,0) 40%,rgba(5,5,6,.5) 72%,var(--bg) 100%),linear-gradient(90deg,rgba(5,5,6,.92) 0%,rgba(5,5,6,.55) 34%,rgba(5,5,6,.05) 62%);}
.hero-body{position:relative;z-index:2;padding:0 56px 46px;max-width:640px;}
.hero-skel-title{width:340px;height:64px;background:rgba(255,255,255,.06);border-radius:8px;}
.hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim); margin-bottom:14px;}
.hero-eyebrow .dot{color:#fff;}
.hero-eyebrow .type-tag{color:#fff;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:4px;font-size:11px;letter-spacing:.08em;}
.hero-title{font-family:'Clash Display',sans-serif;font-weight:700;font-size:clamp(34px,4.6vw,58px);line-height:1.02;letter-spacing:-.01em;margin-bottom:16px;text-shadow:0 2px 24px rgba(0,0,0,.4);}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-dim);font-weight:500;margin-bottom:16px;}
.hero-meta .sep{color:var(--ink-mute);}
.hero-meta .rating{color:#F5C775;font-weight:700;}
.hero-desc{font-size:14.5px;line-height:1.65;color:#C8C8D2;margin-bottom:16px;max-width:560px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hero-genres{display:flex;flex-wrap:wrap;gap:0;font-size:13px;color:#B3B3BE;font-weight:500;margin-bottom:28px;}
.hero-genres span:not(:last-child)::after{content:'|';margin:0 10px;color:var(--ink-mute);}
.hero-cta-row{display:flex;align-items:center;gap:12px;}
.btn-play{display:flex;align-items:center;gap:10px;padding:14px 30px 14px 24px;border-radius:8px;background:var(--gradient);color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;transition:transform .15s ease,box-shadow .2s ease;}
.btn-play:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(199,36,177,.35);} .btn-play svg{width:16px;height:16px;flex-shrink:0;fill:#fff;}
.btn-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:background .15s, transform .15s;}
.btn-icon:hover{background:rgba(255,255,255,.15);} .btn-icon.saved{color:var(--accent-b);}

.hero-side{position:absolute; right:0; top:0; z-index:3;display:flex; flex-direction:column; align-items:flex-end; gap:14px;padding:24px 40px 0 0;}
.hero-strip{display:flex;align-items:center;gap:8px;}
.strip-thumb{width:74px;height:44px;border-radius:6px;overflow:hidden;position:relative;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:#141418;}
.strip-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.65;transition:opacity .15s;}
.strip-thumb:hover img{opacity:.9;}
.strip-thumb.active{border-color:#fff;}
.strip-thumb.active img{opacity:1;}
.strip-next{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);flex-shrink:0;}
.strip-next svg{width:13px;height:13px;}

.section{padding:6px 56px 34px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.section-sub{font-size:12.5px;color:var(--ink-mute);}

/* hide vidapi subtitle */
.section-sub.hide-vidapi{display:none !important;}

.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-behavior:smooth;}
.row::-webkit-scrollbar{display:none;}
.poster{flex:0 0 auto;width:168px;cursor:pointer;transition:transform .18s ease;}
.poster:hover{transform:translateY(-4px);}
.poster-art{width:168px;height:236px;border-radius:8px;overflow:hidden;background:#141418;position:relative;}
.poster-art img{width:100%;height:100%;object-fit:cover;display:block;}
.poster-name{font-size:13px;font-weight:500;margin-top:8px;color:#DEDEE4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.poster-year{font-size:11.5px;color:var(--ink-mute);margin-top:2px;}
.poster-skel{background:linear-gradient(100deg,#141418 30%,#1c1c22 50%,#141418 70%);background-size:200% 100%;animation:shimmer 1.6s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.search-bar{
  display:none; align-items:flex-start; gap:10px;
  background:var(--panel); border:1px solid var(--edge); border-radius:8px;
  padding:10px 14px; margin:12px 56px 20px; max-width:880px; flex-direction:column;
}
.search-bar.show{display:flex;}
.search-bar-row{display:flex; width:100%; gap:10px; align-items:center;}
.search-bar input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%;font-family:inherit;}
.search-bar input::placeholder{color:var(--ink-mute);}

/* inline finder */
.finder-note{font-size:13px;color:var(--ink-dim);margin-top:8px;}
.search-inline-panel{display:flex; width:100%; margin-top:8px; gap:12px; background:rgba(255,255,255,0.02); border-radius:10px; padding:12px; align-items:flex-start; flex-wrap:wrap;}
.finder-col{flex:1; min-width:240px;}
.finder-col h4{font-size:13px;margin-bottom:8px;color:#fff;}
.local-list, .external-list { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow:auto; padding-right:6px; }
.match-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border-radius:8px; background:rgba(255,255,255,0.02);}
.match-meta{font-size:13px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.match-sub{font-size:12px;color:var(--ink-mute);margin-top:2px;}
.use-btn{padding:6px 9px;border-radius:7px;background:rgba(255,255,255,0.03);color:var(--ink-dim);font-weight:700;cursor:pointer;}
.use-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}

.player-compact{display:flex; gap:12px; width:100%; align-items:flex-start; flex-wrap:wrap;}
.player-compact .player-form{flex:1; min-width:260px;}
.player-compact .player-player{width:360px; max-width:100%; min-width:220px;}
.seg{position:relative; display:flex; background:rgba(19,19,24,1); border-radius:10px; padding:4px;}
.seg-thumb{position:absolute; top:4px; left:4px; bottom:4px; width:calc(50% - 4px); border-radius:8px; background:var(--gradient); transition:transform .22s;}
.seg-btn{position:relative; z-index:1; flex:1; padding:9px 0; font-size:13.5px; font-weight:700; color:var(--ink-dim); border-radius:8px;}
.seg-btn.active{color:#fff;}
.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute);}
.field input[type="text"],.field input[type="number"],.field input[type="password"]{background:rgba(19,19,24,1); border:1px solid var(--edge); border-radius:8px; padding:10px 12px; font-size:14px; color:var(--ink); outline:none;}
.field input::placeholder{color:var(--ink-mute);}
.ep-row{display:flex; gap:8px;}
.ep-row .field{flex:1;}
.btn-load{width:140px; padding:10px 12px; border-radius:8px; background:var(--gradient); color:#fff; font-size:14px; font-weight:700;}
.btn-cancel{width:100px; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,0.03); color:var(--ink-dim); font-weight:700;}
.not-found{display:flex; align-items:flex-start; gap:9px; background:rgba(245,167,66,.08); border:1px solid rgba(245,167,66,.18); border-radius:8px; padding:10px; font-size:12.5px; color:#F0C48A;}
.player-frame{position:relative; width:100%; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#000; border:1px solid var(--edge);}
.player-frame iframe{width:100%;height:100%;border:0;visibility:hidden;}
.player-loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:9px; font-size:12.5px; color:var(--ink-mute); background:#000;}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.channel-card{flex:0 0 auto;width:220px;cursor:pointer;border-radius:8px;overflow:hidden;background:#111;padding:8px;border:1px solid rgba(255,255,255,.03);display:flex;gap:8px;align-items:center;}
.channel-thumb{width:84px;height:56px;border-radius:6px;background:#222;overflow:hidden;flex-shrink:0;}
.channel-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.channel-info{flex:1;min-width:0;}
.channel-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.channel-sub{font-size:12px;color:var(--ink-mute);margin-top:6px;}

.stat-strip{display:flex; gap:28px; padding:20px 56px 2px; flex-wrap:wrap;}
.stat-item{display:flex;flex-direction:column;gap:2px;}
.stat-num{font-size:20px;font-weight:700;font-family:'Clash Display',sans-serif;}
.stat-label{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;}

.modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(2,2,3,.9); backdrop-filter:blur(8px); padding:26px;}
.modal.show{display:flex;}
.modal-box{position:relative; width:100%; max-width:1040px; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.6);}
.modal-box iframe{width:100%;height:100%;border:0;}
.modal-close{position:absolute; top:-46px; right:0; width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1); color:#fff;}
.modal-close:hover{background:rgba(255,255,255,.2);}

/* responsive */
@media(max-width:920px){
  .section,.hero-body,.stat-strip{padding-left:22px;padding-right:22px;margin-left:0;}
  .search-bar{margin-left:22px;margin-right:22px; max-width:calc(100% - 44px);}
  .main{margin-top:64px;}
}
@media(max-width:720px){
  .hero{min-height:420px;}
  .topbar{height:56px;padding:8px 12px;}
  .main{margin-top:56px;}
  .player-compact{flex-direction:column;}
  .channel-card{width:48%;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">EV</div>
  <button class="topbar-btn" id="homeNav">Home</button>
  <button class="topbar-btn" id="searchToggle">Search</button>
  <button class="topbar-btn" id="tvNav">TV SHOWS</button>
  <button class="topbar-btn" id="watchlistNav">Watchlist</button>
  <button class="topbar-btn" id="moviesNav">MOVIES</button>
  <button class="topbar-btn" id="liveNav">LIVE TV (including sports)</button>
  <div class="topbar-spacer"></div>
  <button class="topbar-btn" id="continueNav">Continue</button>
  <button class="topbar-btn" id="accountBtn">Account</button>
</div>

<div class="main">

  <div class="hero">
    <div class="hero-media" id="heroMedia"></div>
    <div class="hero-fade"></div>

    <div class="hero-side">
      <button class="hero-mute" id="heroMuteBtn" aria-label="Toggle preview">
        <svg id="heroMuteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><line x1="17" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="17" y2="15"/></svg>
      </button>
      <div class="hero-strip" id="heroStrip"></div>
    </div>

    <div class="hero-body" id="heroBody">
      <div class="hero-skel-title"></div>
    </div>
  </div>

  <!-- Adult / 18+ section at top -->
  <div class="section" id="adultSection" style="display:none;">
    <div class="section-head">
      <div class="section-title">More 18+</div>
      <div class="section-sub">Restricted content</div>
    </div>
    <div class="row" id="adultRow"></div>
  </div>

  <div class="search-bar" id="searchBar">
    <div class="search-bar-row">
      <input type="text" id="searchInput" placeholder="Search titles you've loaded" autocomplete="off">
    </div>

    <!-- Finder + inline player all visible under search -->
    <div class="search-inline-panel" id="searchInlinePanel" aria-hidden="true" style="display:none;">
      <div class="finder-col">
        <div class="finder-note">Don't find movie? Check through this and EV</div>

        <h4>Local matches</h4>
        <div class="local-list" id="localResults">
          <!-- local matches appear here -->
        </div>

        <h4 style="margin-top:10px">OMDb (external)</h4>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <input class="field" type="text" id="omdbTitleInput" placeholder="Title to search on OMDb" style="flex:1;padding:8px;border-radius:8px;background:rgba(19,19,24,1);border:1px solid var(--edge);color:var(--ink);">
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input class="field" type="password" id="omdbApiKey" placeholder="OMDb API key (optional)" style="padding:8px;border-radius:8px;background:rgba(19,19,24,1);border:1px solid var(--edge);color:var(--ink);flex:1;">
          <button class="use-btn" id="omdbSearchBtn">Search OMDb</button>
        </div>

        <div style="margin-top:8px;">
          <div class="external-list" id="externalResults"></div>
        </div>
      </div>

      <div class="finder-col" style="min-width:360px;">
        <h4>Inline player</h4>
        <div class="player-compact">
          <div class="player-form" id="searchFormCard">
            <div class="seg" id="searchSeg">
              <span class="seg-thumb" id="searchSegThumb"></span>
              <button class="seg-btn active" data-type="movie" id="searchSegMovie">Movie</button>
              <button class="seg-btn" data-type="tv" id="searchSegTv">TV Show</button>
            </div>

            <label class="field" style="margin-top:8px;">
              <span class="field-label">IMDb or TMDB ID</span>
              <input type="text" id="searchIdInput" placeholder="tt2948356" autocomplete="off" spellcheck="false">
            </label>

            <div class="ep-row" id="searchEpRow" hidden>
              <label class="field">
                <span class="field-label">Season</span>
                <input type="number" id="searchSeasonInput" min="1" value="1">
              </label>
              <label class="field">
                <span class="field-label">Episode</span>
                <input type="number" id="searchEpisodeInput" min="1" value="1">
              </label>
            </div>

            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="btn-load" id="searchLoadBtn">Load</button>
              <button class="btn-cancel" id="searchCancelBtn">Cancel</button>
            </div>

            <div class="not-found" id="searchNotFound" hidden style="margin-top:8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
              <span id="searchNotFoundMsg">Couldn't find that title. Check the ID and try again.</span>
            </div>
          </div>

          <div class="player-player" id="searchPlayerCard" hidden>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <span id="searchPlayerLabel"></span>
              <button class="topbar-btn" id="searchNewBtn" style="color:var(--ink-dim);">New</button>
            </div>
            <div class="player-frame">
              <div class="player-loading" id="searchPlayerLoading"><span class="spinner"></span>Loading…</div>
              <iframe id="searchPlayerFrame" src="" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="section" id="watchlistSection" style="display:none;">
    <div class="section-head">
      <div class="section-title">Your watchlist</div>
      <div class="section-sub" id="watchlistCount"></div>
    </div>
    <div class="row" id="watchlistRow"></div>
  </div>

  <div class="section" id="tvLiveSection">
    <div class="section-head">
      <div class="section-title">TV Live</div>
      <div class="section-sub">Live channels</div>
    </div>
    <div class="row" id="tvLiveRow"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title" id="moviesTitle">New movies on EV</div>
      <div class="section-sub hide-vidapi">Live from VidAPI</div>
    </div>
    <div class="row" id="moviesRow"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title" id="tvTitle">New TV on EV</div>
      <div class="section-sub hide-vidapi">Live from VidAPI</div>
    </div>
    <div class="row" id="tvRow"></div>
  </div>

  <div class="stat-strip" id="statStrip"></div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <iframe id="modalFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
(function(){

  var EMBED_BASE = 'https://vaplayer.ru/embed';
  var LIST_BASE = 'https://vidapi.ru';
  var GRADIENT_HEX = '2E6BFF';

  var LIVE_SHEET_GVIZ = 'https://docs.google.com/spreadsheets/d/1UcPVLGxSTJmAdtfPHsA_f5VCtbABwVdwef-va512HQU/gviz/tq?gid=1351440723&tqx=out:json';

  var state = { movies: [], tv: [], heroPool: [], heroIndex: 0, previewOn: false, watchlist: loadWatchlist(), liveChannels: [] };

  /* DOM refs */
  var heroMedia = document.getElementById('heroMedia');
  var heroBody = document.getElementById('heroBody');
  var heroStrip = document.getElementById('heroStrip');
  var heroMuteBtn = document.getElementById('heroMuteBtn');
  var heroMuteIcon = document.getElementById('heroMuteIcon');
  var moviesRow = document.getElementById('moviesRow');
  var tvRow = document.getElementById('tvRow');
  var watchlistRow = document.getElementById('watchlistRow');
  var watchlistSection = document.getElementById('watchlistSection');
  var watchlistCount = document.getElementById('watchlistCount');
  var statStrip = document.getElementById('statStrip');
  var modal = document.getElementById('modal');
  var modalFrame = document.getElementById('modalFrame');
  var modalClose = document.getElementById('modalClose');
  var searchToggle = document.getElementById('searchToggle');
  var searchBar = document.getElementById('searchBar');
  var searchInput = document.getElementById('searchInput');

  var tvLiveRow = document.getElementById('tvLiveRow');
  var adultSection = document.getElementById('adultSection');
  var adultRow = document.getElementById('adultRow');

  /* Inline search player + finder refs */
  var searchInlinePanel = document.getElementById('searchInlinePanel');
  var localResults = document.getElementById('localResults');
  var externalResults = document.getElementById('externalResults');
  var omdbTitleInput = document.getElementById('omdbTitleInput');
  var omdbApiKey = document.getElementById('omdbApiKey');
  var omdbSearchBtn = document.getElementById('omdbSearchBtn');

  var searchSegMovie = document.getElementById('searchSegMovie');
  var searchSegTv = document.getElementById('searchSegTv');
  var searchSegThumb = document.getElementById('searchSegThumb');
  var searchEpRow = document.getElementById('searchEpRow');
  var searchIdInput = document.getElementById('searchIdInput');
  var searchSeasonInput = document.getElementById('searchSeasonInput');
  var searchEpisodeInput = document.getElementById('searchEpisodeInput');
  var searchLoadBtn = document.getElementById('searchLoadBtn');
  var searchCancelBtn = document.getElementById('searchCancelBtn');
  var searchPlayerCard = document.getElementById('searchPlayerCard');
  var searchPlayerFrame = document.getElementById('searchPlayerFrame');
  var searchPlayerLoading = document.getElementById('searchPlayerLoading');
  var searchPlayerLabel = document.getElementById('searchPlayerLabel');
  var searchNewBtn = document.getElementById('searchNewBtn');
  var searchNotFound = document.getElementById('searchNotFound');
  var searchNotFoundMsg = document.getElementById('searchNotFoundMsg');

  /* watchlist */
  function loadWatchlist(){ try{ var raw = localStorage.getItem('ev_watchlist'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
  function saveWatchlist(){ try{ localStorage.setItem('ev_watchlist', JSON.stringify(state.watchlist)); }catch(e){} }
  function isSaved(key){ return state.watchlist.some(function(w){ return w.key === key; }); }
  function toggleSaved(item){ var key = itemKey(item); var idx = state.watchlist.findIndex(function(w){ return w.key === key; }); if(idx === -1){ state.watchlist.push(Object.assign({key:key}, item)); } else { state.watchlist.splice(idx,1); } saveWatchlist(); renderWatchlist(); }
  function itemKey(item){ return item.type + '_' + (item.tmdb_id || item.imdb_id); }

  /* embed helpers */
  function embedUrl(item, opts){
    opts = opts || {};
    var params = new URLSearchParams();
    params.set('title', item.title || '');
    if(item.poster_url) params.set('poster', item.poster_url);
    params.set('primaryColor', '%23' + GRADIENT_HEX);
    if(opts.autoplay !== undefined) params.set('autoplay', opts.autoplay);
    if(opts.controls === false) params.set('controls', 'false');
    if(opts.overlay === false) params.set('overlay', 'false');
    var resumeKey = 'ev_progress_' + itemKey(item);
    var resume = localStorage.getItem(resumeKey);
    if(opts.resume && resume) params.set('resumeAt', resume);
    var idPart = item.tmdb_id ? item.tmdb_id : item.imdb_id;
    var path;
    if(item.type === 'movie'){ path = '/movie/' + idPart; } else { var s = item.season || '1'; var e = item.episode || '1'; path = '/tv/' + idPart + '/' + s + '/' + e; }
    return EMBED_BASE + path + '?' + params.toString().replace(/%2523/g,'%23');
  }

  function buildEmbedFromInput(rawId, type, season, episode, opts){
    opts = opts || {};
    var id = rawId.trim();
    var idPart = encodeURIComponent(id);
    var path = type === 'movie' ? '/movie/' + idPart : '/tv/' + idPart + '/' + (season || 1) + '/' + (episode || 1);
    var params = new URLSearchParams();
    params.set('autoplay', opts.autoplay ? '1' : '0');
    params.set('primaryColor', (opts.primaryColor || GRADIENT_HEX));
    if(opts.controls === false) params.set('controls', 'false');
    if(opts.overlay === false) params.set('overlay', 'false');
    if(opts.startAt) params.set('startAt', String(opts.startAt));
    return EMBED_BASE + path + '?' + params.toString();
  }

  function fetchJSON(url){
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('bad response');
      return r.json();
    });
  }

  /* normalize VidAPI items */
  function normalize(list, type){
    return (list || []).map(function(it){
      return {
        type: type,
        tmdb_id: it.tmdb_id || (it.show_tmdb_id) || null,
        imdb_id: it.imdb_id || it.show_imdb_id || null,
        title: it.title || it.show_title || it.episode_title || 'Untitled',
        year: it.year || (it.air_date ? it.air_date.slice(0,4) : ''),
        poster_url: it.poster_url || '',
        rating: it.rating || null,
        genre: it.genre || '',
        season: it.season_number || null,
        episode: it.episode_number || null
      };
    });
  }

  function posterCard(item){
    var card = document.createElement('div');
    card.className = 'poster';
    card.innerHTML =
      '<div class="poster-art">' +
        (item.poster_url ? '<img src="'+item.poster_url+'" alt="'+escapeHtml(item.title)+'" loading="lazy">' : '') +
        '<div class="type-pill">'+ (item.type === 'movie' ? 'Movie' : 'TV') +'</div>' +
        (item.rating ? '<div class="rating-pill">&#9733; '+item.rating+'</div>' : '') +
      '</div>' +
      '<div class="poster-name">'+escapeHtml(item.title)+'</div>' +
      '<div class="poster-year">'+ (item.year || '') +'</div>';
    card.addEventListener('click', function(){ openPlayer(item); });
    return card;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function skeletonRow(container, n){
    container.innerHTML = '';
    for(var i=0;i<n;i++){
      var d = document.createElement('div');
      d.className = 'poster';
      d.innerHTML = '<div class="poster-art poster-skel"></div>';
      container.appendChild(d);
    }
  }

  function renderRow(container, items){
    container.innerHTML = '';
    if(!items.length){
      container.innerHTML = '<div class="empty-note">Nothing loaded right now. VidAPI may be unreachable.</div>';
      return;
    }
    items.forEach(function(item){ container.appendChild(posterCard(item)); });
  }

  function renderWatchlist(){
    if(!state.watchlist.length){ watchlistSection.style.display = 'none'; return; }
    watchlistSection.style.display = 'block';
    watchlistCount.textContent = state.watchlist.length + ' saved';
    renderRow(watchlistRow, state.watchlist);
  }

  /* hero modal player */
  function openPlayer(item){
    modalFrame.src = embedUrl(item, {autoplay:1, resume:true});
    modal.classList.add('show');
    window.addEventListener('message', playerMessageHandler);
  }
  function closePlayer(){
    modal.classList.remove('show');
    modalFrame.src = '';
    window.removeEventListener('message', playerMessageHandler);
  }
  modalClose.addEventListener('click', closePlayer);
  modal.addEventListener('click', function(e){ if(e.target === modal) closePlayer(); });

  function playerMessageHandler(e){
    if(!e.data || e.data.type !== 'PLAYER_EVENT') return;
    var d = e.data.data;
    if(!d || !d.player_info) return;
    var id = d.player_info.tmdb || d.player_info.imdb;
    var type = d.player_info.mediaType === 'tv' ? 'tv' : 'movie';
    var key = type + '_' + id;
    if(d.player_status === 'playing' && typeof d.player_progress === 'number'){
      try{ localStorage.setItem('ev_progress_' + key, d.player_progress); }catch(err){}
    }
    if(d.player_status === 'completed'){
      try{ localStorage.removeItem('ev_progress_' + key); }catch(err){}
    }
  }

  function setHero(item){
    var idx = state.heroPool.indexOf(item);
    if(idx > -1) state.heroIndex = idx;

    heroBody.innerHTML =
      '<div class="hero-eyebrow"><span class="type-tag">'+(item.type==='movie'?'Movie':'Series')+'</span><span class="dot">&bull;</span><span>EV Originals catalog</span></div>' +
      '<div class="hero-title">'+escapeHtml(item.title)+'</div>' +
      '<div class="hero-meta">' +
        (item.year ? '<span>'+item.year+'</span><span class="sep">&bull;</span>' : '') +
        (item.rating ? '<span class="rating">&#9733; '+item.rating+'</span><span class="sep">&bull;</span>' : '') +
        (item.type === 'tv' && item.season ? '<span>Season '+item.season+'</span>' : '<span>'+(item.type==='movie'?'Feature film':'Series')+'</span>') +
      '</div>' +
      '<div class="hero-desc">'+ (item.genre ? escapeHtml(item.genre)+'. ' : '') + 'Stream instantly on EV, powered live by the VidAPI catalog.</div>' +
      '<div class="hero-genres">' + (item.genre ? item.genre.split(',').map(function(g){return '<span>'+escapeHtml(g.trim())+'</span>';}).join('') : '<span>Streaming now</span>') + '</div>' +
      '<div class="hero-cta-row">' +
        '<button class="btn-play" id="heroPlayBtn"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg>EV MODE ACTIVE</button>' +
        '<button class="btn-icon' + (isSaved(itemKey(item)) ? ' saved' : '') + '" id="heroSaveBtn" aria-label="Add to watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>' +
      '</div>';

    document.getElementById('heroPlayBtn').addEventListener('click', function(){ openPlayer(item); });
    document.getElementById('heroSaveBtn').addEventListener('click', function(e){
      toggleSaved(item);
      e.currentTarget.classList.toggle('saved');
    });

    renderHeroMedia(item);
    renderStrip();
  }

  function renderHeroMedia(item){
    if(state.previewOn){
      var params = new URLSearchParams();
      params.set('autoplay','1');
      params.set('controls','false');
      params.set('overlay','false');
      var idPart = item.tmdb_id || item.imdb_id;
      var path = item.type === 'movie' ? '/movie/'+idPart : '/tv/'+idPart+'/'+(item.season||1)+'/'+(item.episode||1);
      heroMedia.innerHTML = '<iframe src="'+EMBED_BASE+path+'?'+params.toString()+'" allow="autoplay"></iframe>';
      heroMuteIcon.innerHTML = '<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15 9a4 4 0 010 6"/><path d="M18 6a8 8 0 010 12"/>';
    } else {
      heroMedia.innerHTML = item.poster_url ? '<img src="'+item.poster_url+'" alt="'+escapeHtml(item.title)+'">' : '';
      heroMuteIcon.innerHTML = '<path d="M11 5L6 9H3v6h3l5 4V5z"/><line x1="17" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="17" y2="15"/>';
    }
  }

  heroMuteBtn.addEventListener('click', function(){
    state.previewOn = !state.previewOn;
    renderHeroMedia(state.heroPool[state.heroIndex]);
  });

  function renderStrip(){
    heroStrip.innerHTML = '';
    var visible = state.heroPool.slice(0,4);
    visible.forEach(function(item, i){
      var t = document.createElement('div');
      t.className = 'strip-thumb' + (i === state.heroIndex ? ' active' : '');
      t.innerHTML = item.poster_url ? '<img src="'+item.poster_url+'" alt="">' : '';
      t.addEventListener('click', function(){ setHero(item); });
      heroStrip.appendChild(t);
    });
    var next = document.createElement('div');
    next.className = 'strip-next';
    next.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    next.addEventListener('click', function(){
      state.heroPool.push(state.heroPool.shift());
      setHero(state.heroPool[0]);
    });
    heroStrip.appendChild(next);
  }

  /* search toggle */
  searchToggle.addEventListener('click', function(){ searchBar.classList.toggle('show'); if(searchBar.classList.contains('show')) searchInput.focus(); else hideFinder(); });

  /* finder: local matches + OMDb */
  function findLocalMatches(query){
    if(!query) return [];
    var q = query.toLowerCase();
    var m = (state.movies || []).filter(function(it){ return it.title.toLowerCase().indexOf(q) !== -1; });
    var t = (state.tv || []).filter(function(it){ return it.title.toLowerCase().indexOf(q) !== -1; });
    // label items with their source
    return m.concat(t);
  }

  function renderLocalMatches(query){
    var matches = findLocalMatches(query);
    localResults.innerHTML = '';
    if(!matches.length){
      localResults.innerHTML = '<div class="match-item"><div class="match-meta">No local matches found</div></div>';
      return;
    }
    matches.slice(0,30).forEach(function(it){
      var d = document.createElement('div');
      d.className = 'match-item';
      var meta = document.createElement('div');
      meta.style.flex = '1';
      meta.innerHTML = '<div class="match-meta">'+escapeHtml(it.title) + (it.year ? ' · ' + it.year : '') +'</div>' + '<div class="match-sub">' + (it.imdb_id ? 'imdb: ' + it.imdb_id : (it.tmdb_id ? 'tmdb: ' + it.tmdb_id : 'no external id')) + '</div>';
      var btn = document.createElement('button');
      btn.className = 'use-btn';
      btn.textContent = 'Use';
      btn.addEventListener('click', function(){
        // fill ID input with best ID (imdb preferred)
        var val = it.imdb_id || it.tmdb_id || '';
        searchIdInput.value = val;
        // set type
        setSearchType(it.type === 'tv' ? 'tv' : 'movie');
        // focus id input
        searchIdInput.focus();
      });
      d.appendChild(meta);
      d.appendChild(btn);
      localResults.appendChild(d);
    });
  }

  /* OMDb external search */
  function renderExternalResults(items){
    externalResults.innerHTML = '';
    if(!items || !items.length){
      externalResults.innerHTML = '<div class="match-item"><div class="match-meta">No external matches</div></div>';
      return;
    }
    items.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'match-item';
      var meta = document.createElement('div');
      meta.style.flex = '1';
      meta.innerHTML = '<div class="match-meta">' + escapeHtml(it.Title) + (it.Year ? ' · ' + it.Year : '') + '</div>' + '<div class="match-sub">imdb: ' + (it.imdbID || '') + ' · ' + (it.Type || '') + '</div>';
      var btn = document.createElement('button');
      btn.className = 'use-btn';
      btn.textContent = 'Use';
      btn.addEventListener('click', function(){
        searchIdInput.value = it.imdbID || '';
        setSearchType((it.Type === 'series' ? 'tv' : 'movie'));
        searchIdInput.focus();
      });
      d.appendChild(meta);
      d.appendChild(btn);
      externalResults.appendChild(d);
    });
  }

  omdbSearchBtn.addEventListener('click', function(){
    var title = (omdbTitleInput.value || searchInput.value || '').trim();
    var key = omdbApiKey.value.trim();
    if(!title || !key){
      alert('Provide a title and an OMDb API key to search externally.');
      return;
    }
    externalResults.innerHTML = '<div class="match-item"><div class="match-meta">Searching OMDb…</div></div>';
    fetch('https://www.omdbapi.com/?s=' + encodeURIComponent(title) + '&apikey=' + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.Search && j.Search.length){
          renderExternalResults(j.Search);
        } else {
          externalResults.innerHTML = '<div class="match-item"><div class="match-meta">No external matches found</div></div>';
        }
      }).catch(function(){
        externalResults.innerHTML = '<div class="match-item"><div class="match-meta">OMDb search failed</div></div>';
      });
  });

  /* Inline search player logic (unchanged) */
  var searchCurrentType = 'movie';
  function setSearchType(type){
    searchCurrentType = type;
    searchSegMovie.classList.toggle('active', type === 'movie');
    searchSegTv.classList.toggle('active', type === 'tv');
    searchSegThumb.style.transform = type === 'tv' ? 'translateX(100%)' : 'translateX(0)';
    searchEpRow.hidden = type !== 'tv';
  }
  searchSegMovie.addEventListener('click', function(){ setSearchType('movie'); });
  searchSegTv.addEventListener('click', function(){ setSearchType('tv'); });

  function isValidId(v){
    return /^tt\d{6,9}$/i.test(v) || /^\d{1,8}$/.test(v);
  }

  function showFinder(){
    searchInlinePanel.style.display = 'flex';
    searchInlinePanel.setAttribute('aria-hidden','false');
    // prefill omdb title input with searchInput value
    omdbTitleInput.value = searchInput.value.trim();
    // render local matches for the query
    renderLocalMatches(searchInput.value.trim());
  }
  function hideFinder(){
    searchInlinePanel.style.display = 'none';
    searchInlinePanel.setAttribute('aria-hidden','true');
  }

  var searchLoadTimer = null;
  var searchMessageHandler = null;
  function stopSearchWatching(){
    clearTimeout(searchLoadTimer);
    if(searchMessageHandler){
      window.removeEventListener('message', searchMessageHandler);
      searchMessageHandler = null;
    }
  }
  function startSearchLoad(url){
    stopSearchWatching();
    searchPlayerFrame.style.visibility = 'hidden';
    searchPlayerLoading.hidden = false;
    searchPlayerFrame.src = url;
    searchMessageHandler = function(e){
      if(!e.data || e.data.type !== 'PLAYER_EVENT') return;
      stopSearchWatching();
      searchPlayerLoading.hidden = true;
      searchPlayerFrame.style.visibility = 'visible';
    };
    window.addEventListener('message', searchMessageHandler);

    searchLoadTimer = setTimeout(function(){
      stopSearchWatching();
      searchPlayerFrame.src = '';
      searchPlayerCard.hidden = true;
      document.getElementById('searchFormCard').style.display = 'block';
      searchNotFound.hidden = false;
      searchNotFoundMsg.textContent = "Couldn't find that title in the library. Double-check the ID" + (searchCurrentType === 'tv' ? ', season and episode' : '') + ' and try again.';
    }, 9000);
  }

  searchLoadBtn.addEventListener('click', function(){
    var id = searchIdInput.value.trim();
    searchNotFound.hidden = true;
    if(!id){ searchNotFound.hidden = false; searchNotFoundMsg.textContent = 'Enter an IMDb or TMDB ID first.'; return; }
    if(!isValidId(id)){ searchNotFound.hidden = false; searchNotFoundMsg.textContent = 'That doesn\u2019t look like a valid ID — use something like tt2948356 or 1147301.'; return; }

    var season = 1, episode = 1;
    if(searchCurrentType === 'tv'){
      season = parseInt(searchSeasonInput.value, 10);
      episode = parseInt(searchEpisodeInput.value, 10);
      if(!season || season < 1 || !episode || episode < 1){
        searchNotFound.hidden = false; searchNotFoundMsg.textContent = 'Enter a valid season and episode number.'; return;
      }
    }

    searchPlayerLabel.textContent = (searchCurrentType === 'movie' ? 'Movie' : 'TV Show') + ' · ' + id + (searchCurrentType === 'tv' ? ' · S' + String(season).padStart(2,'0') + 'E' + String(episode).padStart(2,'0') : '');
    document.getElementById('searchFormCard').style.display = 'none';
    searchPlayerCard.hidden = false;

    var url = buildEmbedFromInput(id, searchCurrentType, season, episode, {autoplay:true, primaryColor:GRADIENT_HEX});
    startSearchLoad(url);
  });

  searchCancelBtn.addEventListener('click', function(){ hideFinder(); });
  searchNewBtn.addEventListener('click', function(){ stopSearchWatching(); document.getElementById('searchFormCard').style.display = 'block'; searchPlayerCard.hidden = true; searchPlayerFrame.src = ''; searchNotFound.hidden = true; });

  /* Search input behavior: show finder and local matches on every search */
  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim();
    var mTitle = document.getElementById('moviesTitle');
    var tTitle = document.getElementById('tvTitle');
    if(!q){
      renderRow(moviesRow, state.movies);
      renderRow(tvRow, state.tv);
      mTitle.textContent = 'New movies on EV';
      tTitle.textContent = 'New TV on EV';
      hideFinder();
      return;
    }
    var ql = q.toLowerCase();
    var fm = state.movies.filter(function(m){ return m.title.toLowerCase().indexOf(ql) > -1; });
    var ft = state.tv.filter(function(t){ return t.title.toLowerCase().indexOf(ql) > -1; });
    renderRow(moviesRow, fm);
    renderRow(tvRow, ft);
    mTitle.textContent = 'Movies matching "'+searchInput.value+'"';
    tTitle.textContent = 'TV matching "'+searchInput.value+'"';

    // Show finder on every search (user requested)
    showFinder();
  });

  /* TV Live fetch */
  function fetchLiveChannels(){
    return fetch(LIVE_SHEET_GVIZ).then(function(r){ return r.text(); }).then(function(txt){
      var json = txt.replace(/^[^\(]*\(|\);?$/g, '');
      var data = JSON.parse(json);
      var table = data.table || {};
      var cols = (table.cols || []).map(function(c){ return (c.label || '').trim(); });
      var rows = (table.rows || []).map(function(r){
        var obj = {};
        (r.c || []).forEach(function(cell, i){
          var key = cols[i] || ('c' + i);
          obj[key] = cell && typeof cell.v !== 'undefined' ? cell.v : '';
        });
        return obj;
      });
      var channels = rows.map(function(row){
        var lowerKeys = {};
        Object.keys(row).forEach(function(k){ lowerKeys[k.toLowerCase().replace(/\s+/g,'')] = k; });
        function find(keyCandidates){ for(var i=0;i<keyCandidates.length;i++){ var lk = keyCandidates[i].toLowerCase(); if(lowerKeys[lk]) return row[lowerKeys[lk]]; } return ''; }
        var title = find(['channel','name','title']) || 'Channel';
        var logo = find(['logo','poster','thumb','image','logo_url','image_url']) || '';
        var stream = find(['stream','url','embed','stream_url','streamurl']) || '';
        var category = find(['category','genre']) || '';
        return { title: title, logo: logo, stream: stream, category: category, raw: row };
      });
      state.liveChannels = channels;
      renderLiveChannels();
    }).catch(function(err){
      tvLiveRow.innerHTML = '<div class="empty-note">Could not load live channels.</div>';
    });
  }

  function renderLiveChannels(){
    if(!state.liveChannels || !state.liveChannels.length){
      tvLiveRow.innerHTML = '<div class="empty-note">No live channels found.</div>';
      return;
    }
    tvLiveRow.innerHTML = '';
    state.liveChannels.forEach(function(ch){
      var card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML =
        '<div class="channel-thumb">'+ (ch.logo ? '<img src="'+escapeHtml(ch.logo)+'" loading="lazy">' : '') +'</div>' +
        '<div class="channel-info"><div class="channel-title">'+escapeHtml(ch.title)+'</div>' +
        (ch.category ? '<div class="channel-sub">'+escapeHtml(ch.category)+'</div>' : '') +
        '</div>';
      card.addEventListener('click', function(){
        if(ch.stream){
          var s = String(ch.stream).trim();
          if(/^tt\d{6,9}$/.test(s) || /^\d{1,8}$/.test(s)){
            var guessType = 'tv';
            var url = buildEmbedFromInput(s, guessType, 1, 1, {autoplay:true, primaryColor:GRADIENT_HEX});
            modalFrame.src = url;
            modal.classList.add('show');
          } else {
            modalFrame.src = s;
            modal.classList.add('show');
          }
        } else {
          modalFrame.src = '';
          modal.classList.add('show');
        }
        window.addEventListener('message', playerMessageHandler);
      });
      tvLiveRow.appendChild(card);
    });
  }

  /* Adult detection */
  function renderAdultSection(){
    var all = (state.movies || []).concat(state.tv || []);
    var adult = all.filter(function(it){
      var g = (it.genre || '').toLowerCase();
      var r = (it.rating || '').toString().toLowerCase();
      return /(^|\W)(18\+|18|adult|r18|r-18)/.test(g) || /(^|\W)(18\+|18|adult|r18|r-18)/.test(r);
    });
    if(!adult.length){ adultSection.style.display = 'none'; return; }
    adultSection.style.display = 'block';
    adultRow.innerHTML = '';
    adult.forEach(function(a){ adultRow.appendChild(posterCard(a)); });
  }

  /* Stats */
  function loadStats(){
    fetchJSON(LIST_BASE + '/imdb/api/?action=stats').then(function(d){
      var lib = d.content_library || {};
      var rows = [
        {n: lib.movies, l:'Movies'},
        {n: lib.tv_shows, l:'TV shows'},
        {n: lib.episodes, l:'Episodes'},
        {n: lib.collections, l:'Collections'}
      ];
      statStrip.innerHTML = rows.filter(function(r){return r.n;}).map(function(r){
        return '<div class="stat-item"><div class="stat-num">'+Number(r.n).toLocaleString()+'</div><div class="stat-label">'+r.l+'</div></div>';
      }).join('');
    }).catch(function(){ statStrip.innerHTML = ''; });
  }

  /* init */
  function init(){
    skeletonRow(moviesRow, 6);
    skeletonRow(tvRow, 6);
    Promise.all([
      fetchJSON(LIST_BASE + '/movies/latest/page-1.json').catch(function(){ return {items:[]}; }),
      fetchJSON(LIST_BASE + '/tvshows/latest/page-1.json').catch(function(){ return {items:[]}; })
    ]).then(function(res){
      state.movies = normalize(res[0].items, 'movie');
      state.tv = normalize(res[1].items, 'tv');
      renderRow(moviesRow, state.movies);
      renderRow(tvRow, state.tv);

      state.heroPool = state.movies.slice(0,3).concat(state.tv.slice(0,3));
      if(state.heroPool.length){ setHero(state.heroPool[0]); } else { heroBody.innerHTML = '<div class="empty-note">Could not reach VidAPI right now. Check your connection and reload.</div>'; }

      renderWatchlist();
      renderAdultSection();
    }).catch(function(){
      heroBody.innerHTML = '<div class="empty-note">Could not reach VidAPI right now. Check your connection and reload.</div>';
      renderRow(moviesRow, []);
      renderRow(tvRow, []);
    });

    loadStats();
    fetchLiveChannels();
  }

  init();

  // modal backdrop close
  modal.addEventListener('click', function(e){ if(e.target === modal){ modal.classList.remove('show'); modalFrame.src = ''; } });

  /* topbar navigation - scroll to sections */
  document.getElementById('moviesNav').addEventListener('click', function(){ document.getElementById('moviesTitle').scrollIntoView({behavior:'smooth', block:'start'}); });
  document.getElementById('tvNav').addEventListener('click', function(){ document.getElementById('tvTitle').scrollIntoView({behavior:'smooth', block:'start'}); });
  document.getElementById('liveNav').addEventListener('click', function(){ document.getElementById('tvLiveSection').scrollIntoView({behavior:'smooth', block:'start'}); });
  document.getElementById('watchlistNav').addEventListener('click', function(){ if(state.watchlist.length) watchlistSection.scrollIntoView({behavior:'smooth', block:'start'}); });
  document.getElementById('continueNav').addEventListener('click', function(){ document.querySelector('.hero').scrollIntoView({behavior:'smooth'}); });

})();
</script>
</body>
</html>
