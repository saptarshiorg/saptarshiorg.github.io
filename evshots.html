<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVSHOTS.IO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .header {
      height: 60px;
      width: 100%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      border-bottom: 2px solid #222;
    }

    .game {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <header class="header">
    EVSHOTS.IO
  </header>

  <iframe
    class="game"
    src="https://deadshot.io/"
    title="EVSHOTS.IO"
    allow="fullscreen; autoplay; gamepad"
    allowfullscreen>
  </iframe>

</body>
</html>
