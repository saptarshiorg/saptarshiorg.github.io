name: Build EV Streams Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist:win

      - name: Upload build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Streams-Windows
          path: |
            desktop-app/dist/*.exe

      - name: Get short SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: EV Streams Desktop build ${{ github.run_number }} (${{ steps.vars.outputs.sha_short }})
          files: desktop-app/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build AppImage
        run: npm run dist:linux

      - name: Upload build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Streams-Linux
          path: |
            desktop-app/dist/*.AppImage

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: EV Streams Desktop build ${{ github.run_number }}
          files: desktop-app/dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
