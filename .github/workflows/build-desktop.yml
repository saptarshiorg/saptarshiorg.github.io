name: Build EV Streams Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop-app folder exists
        shell: bash
        run: |
          if [ ! -f desktop-app/package.json ]; then
            echo "::error::desktop-app/package.json not found at repo root. Upload the desktop-app folder (not nested)."
            ls -la
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop-app
        shell: bash
        run: npm install

      - name: Build Windows installer + portable exe
        working-directory: desktop-app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -- --publish never

      - name: Upload build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Streams-Windows
          path: desktop-app/dist/*.exe

      - name: Get short SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: EV Streams Desktop build ${{ github.run_number }} (${{ steps.vars.outputs.sha_short }})
          files: desktop-app/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop-app folder exists
        run: |
          if [ ! -f desktop-app/package.json ]; then
            echo "::error::desktop-app/package.json not found at repo root. Upload the desktop-app folder (not nested)."
            ls -la
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build AppImage
        working-directory: desktop-app
        run: npm run dist:linux -- --publish never

      - name: Upload build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Streams-Linux
          path: desktop-app/dist/*.AppImage

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: EV Streams Desktop build ${{ github.run_number }}
          files: desktop-app/dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
