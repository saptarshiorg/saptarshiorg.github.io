<style>
:root{
  --ks-size:32px;
  --ks-speed:0.8s;
  --ks-color:#53FC18;
  --ks-stroke:3;
  --bg:#ffffff;--fg:#0a0a0f;--mute:#5d5d6b;--line:#e4e2ee;--accent:#6d28ff;--accent-ink:#ffffff;--panel:#f6f4fc;
  --disp:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Satoshi",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5fa;--mute:#9a9aae;--line:#24232f;--accent:#9d6bff;--accent-ink:#000;--panel:#0d0c14}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5fa;--mute:#9a9aae;--line:#24232f;--accent:#9d6bff;--accent-ink:#000;--panel:#0d0c14}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0a0a0a;overflow:hidden;
  font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
#overlay{
  position:fixed;inset:0;background:#0a0a0a;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px
}
#overlay svg{
  width:var(--ks-size);height:var(--ks-size);
  animation:ks-spin var(--ks-speed) linear infinite;
  pointer-events:none;display:block
}
@keyframes ks-spin{to{transform:rotate(360deg)}}
@keyframes ks-fade{0%,100%{opacity:1}50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){
  #overlay svg{animation:ks-fade calc(var(--ks-speed) * 2) ease-in-out infinite}
}
#overlay p{
  color:#686868;font-size:11px;letter-spacing:.8px;
  text-align:center;padding:0 24px;font-weight:400;
  text-transform:uppercase
}
#channel-list{
  position:fixed;inset:0;z-index:9998;display:none;overflow-y:auto;
  background:var(--bg);color:var(--fg);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased
}
#channel-list .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
#channel-list a{color:inherit}
#channel-list :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.ch-bar{
  position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)
}
.ch-bar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font:800 15px var(--disp);text-decoration:none;letter-spacing:.02em}
.logo b{color:var(--accent)}
.bar-right{display:flex;align-items:center;gap:12px}
#ch-count{
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  color:var(--mute);font-size:14px;font-weight:600;line-height:1.3
}
#ch-count:empty{display:none}
#theme{
  background:none;border:1px solid var(--line);color:var(--fg);width:36px;height:36px;
  border-radius:50%;cursor:pointer;font-size:16px;line-height:1
}
#theme:hover{border-color:var(--accent)}
.ch-main{padding-bottom:max(64px,env(safe-area-inset-bottom,0px))}
.ch-hero{padding:clamp(40px,7vw,88px) 0 40px}
.ch-hero .where{color:var(--mute);margin:0 0 18px}
#ch-title{font:800 clamp(24px,6.2vw,76px)/1.02 var(--disp);letter-spacing:-.035em;margin:0}
#ch-title span{display:block;overflow:hidden}
#ch-title span i{display:inline-block;font-style:normal;transform:translateY(105%);animation:ch-up .9s cubic-bezier(.2,.8,.2,1) forwards}
#ch-title span:nth-child(2) i{animation-delay:.12s;color:var(--accent)}
@keyframes ch-up{to{transform:none}}
.ch-hero .lede{max-width:540px;font-size:19px;margin:24px 0 0;color:var(--mute)}
.channel-search{
  display:flex;align-items:center;gap:12px;max-width:560px;height:56px;margin:0 0 28px;padding:0 20px;
  color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  transition:border-color .2s,color .2s
}
.channel-search:focus-within{border-color:var(--accent);color:var(--fg)}
.channel-search svg{width:20px;height:20px;flex:0 0 auto}
.channel-search input{
  width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);
  font:500 16px var(--body);-webkit-user-select:text;user-select:text
}
.channel-search input::placeholder{color:var(--mute);opacity:1}
.ch-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.ch-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:900px){.ch-cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1100px){.ch-cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}}
.ch-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.ch-chips:empty{display:none}
.ch-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:none;border:1px solid var(--line);
  border-radius:999px;color:var(--fg);font:600 14px var(--body);cursor:pointer;transition:border-color .2s,color .2s
}
.ch-chip:hover{border-color:var(--accent);color:var(--accent)}
.ch-chip span{color:var(--mute);font-weight:500}
.ch-group{scroll-margin-top:84px;margin-top:36px}
.ch-group:first-child{margin-top:20px}
.ch-group-head{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px}
.ch-group-head h2{margin:0;font:800 clamp(20px,2.8vw,30px)/1.1 var(--disp);letter-spacing:-.025em;overflow-wrap:anywhere}
.ch-group-head .ch-group-count{border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.ch-group-logo{display:block;height:64px;width:auto;max-width:220px;margin-left:auto;object-fit:contain}
.on-white{background:#fff;padding:5px 10px;border-radius:10px}
.ch-card{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;
  min-height:120px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  text-decoration:none;overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s;-webkit-tap-highlight-color:transparent
}
.ch-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.ch-card:active{transform:none}
.ch-card::after{
  content:"\2192";position:absolute;right:14px;top:12px;color:var(--mute);font-size:18px;line-height:1;
  transition:transform .2s,color .2s
}
.ch-card:hover::after{transform:translateX(3px);color:var(--accent)}
.ch-card::after{top:auto;bottom:14px}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.ch-logo{display:block;height:56px;width:auto;max-width:150px;object-fit:contain}
.ch-name{padding-right:26px}
.ch-card.has-logo{padding:0;gap:0;justify-content:flex-start;min-height:0}
.ch-logo-wrap{display:grid;place-items:center;height:112px;padding:14px 18px}
.ch-logo-wrap.zoom{padding:0;background:none}
.ch-logo-wrap.zoom .ch-logo{object-fit:cover}
.ch-logo-wrap .ch-logo{height:100%;width:100%;max-width:none;object-fit:contain}
.ch-meta{display:flex;flex-direction:column;gap:8px;padding:12px 40px 16px 16px}
.ch-meta .ch-name{padding-right:0}
.ch-num{font:800 12px/1 var(--disp);letter-spacing:.04em;color:var(--accent)}
.ch-name{
  font:600 13px/1.4 var(--disp);letter-spacing:-.01em;color:var(--fg);transition:color .2s;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere
}
.ch-card:hover .ch-name{color:var(--accent)}
#ch-empty{margin:0;padding:28px 0;color:var(--mute);font-size:16px;text-align:center}
@media (prefers-reduced-motion:reduce){
  #ch-title span i{animation:none;transform:none}
  .ch-card,.ch-card::after{transition:none}
}
#pc{
  position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:manipulation
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{
  position:fixed;
  bottom:calc(66px + env(safe-area-inset-bottom,0px));
  left:12px;right:auto;top:auto;
  transform:translateY(6px);
  z-index:9997;
  display:flex;align-items:center;gap:7px;
  padding:0 14px 0 10px;
  height:26px;min-width:156px;max-width:272px;
  overflow:hidden;white-space:nowrap;
  background:linear-gradient(160deg,rgba(9,9,11,.94) 0%,rgba(15,15,18,.90) 100%);
  border:1px solid rgba(255,255,255,.09);
  border-top:1px solid rgba(255,255,255,.13);
  border-radius:4px;
  box-shadow:0 2px 16px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:9px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;font-variant-numeric:tabular-nums;
  pointer-events:none;opacity:0;
  transition:opacity .22s ease,transform .22s ease
}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok   {color:#9ca0a8}
#status.ok   .st-dot{background:#60a5fa}
#status.live {color:#c4c8ce}
#status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn {color:#f2c94c}
#status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err  {color:#fca5a5}
#status.err  .st-dot{background:#f87171}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.28;transform:scale(.52)}
}
.sp-btn{
  background:transparent!important;border:none!important;
  cursor:pointer!important;padding:0 8px!important;
  opacity:.75;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;
  transition:opacity .15s,color .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent
}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
.sp-btn.active{opacity:1;color:#38bdf8!important}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:3px 7px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.8);
  pointer-events:none;white-space:nowrap;
  transition:border-color .2s,color .2s
}
.sp-fit-btn:hover      .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
.sp-fit-btn.mode-fill  .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
@media(max-width:380px){
  .fit-pill{font-size:9px;padding:2px 5px}
  .sp-btn{padding:0 5px!important}
}

/* ===== Streaming-style player UI ===== */
#pc{font-family:var(--body)}
.hs{position:absolute;inset:0;z-index:5;pointer-events:none;color:#fff;opacity:0;transition:opacity .25s ease}
.hs.hs-show{opacity:1}
.hs-top,.hs-bottom,.hs-menu,.hs-center{pointer-events:none}
.hs.hs-show .hs-top,.hs.hs-show .hs-bottom,.hs.hs-show .hs-menu,.hs.hs-show .hs-center{pointer-events:auto}
.hs button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.hs-top{
  position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) clamp(14px,3vw,40px) 44px;
  background:linear-gradient(to bottom,rgba(0,0,0,.88),rgba(0,0,0,.5) 55%,transparent)
}
#hs-title{
  flex:1;min-width:0;margin:0;font-size:clamp(16px,2.1vw,24px);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.hs-top-right{display:flex;align-items:center;gap:clamp(12px,2.2vw,30px)}
#hs-fit-slot{display:flex;align-items:center;height:40px}
.hs-icon{
  width:44px;height:44px;display:grid;place-items:center;background:none;border:0;
  color:#fff;border-radius:50%;cursor:pointer;flex:0 0 auto
}
.hs-icon svg{width:28px;height:28px;fill:currentColor}
.hs-icon:hover{background:rgba(255,255,255,.12)}
.hs-txtbtn{
  display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;
  font-size:clamp(14px,1.4vw,18px);cursor:pointer;padding:8px 4px
}
.hs-txtbtn b{font-weight:700;white-space:nowrap}
.hs-txtbtn span{color:rgba(255,255,255,.55);font-weight:500}
.hs-txtbtn svg{width:26px;height:26px;flex:0 0 auto;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hs-txtbtn svg .f{fill:#fff;stroke:none}
.hs-bottom{
  position:absolute;left:0;right:0;bottom:0;
  padding:70px clamp(14px,3vw,40px) max(16px,env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.55) 55%,transparent)
}
.hs-seek-row{display:flex;align-items:center;gap:18px}
.hs-seek{position:relative;flex:1;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.hs-track{position:relative;width:100%;height:4px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;transition:height .12s}
.hs-seek:hover .hs-track,.hs-seek.drag .hs-track{height:6px}
#hs-buf,#hs-played{position:absolute;left:0;top:0;bottom:0;width:0}
#hs-buf{background:rgba(255,255,255,.45)}
#hs-played{background:#1f80ff}
#hs-thumb{
  position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;background:#fff;transition:transform .12s;pointer-events:none
}
.hs-seek:hover #hs-thumb,.hs-seek.drag #hs-thumb{transform:scale(1.3)}
.hs-time{
  min-width:62px;background:none;border:0;color:#fff;text-align:right;cursor:default;
  font-size:clamp(14px,1.4vw,18px);font-weight:700;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:flex-end;gap:7px
}
.hs-time.hs-live i{width:8px;height:8px;border-radius:50%;background:#ff3b3b;display:inline-block}
.hs-time.hs-behind{cursor:pointer}
.hs-ctrl-row{display:flex;align-items:center;gap:clamp(6px,1.8vw,24px);margin-top:4px}
.hs-btn{
  display:flex;align-items:center;gap:6px;padding:8px;background:none;border:0;color:#fff;
  border-radius:10px;cursor:pointer;font-size:clamp(14px,1.4vw,18px);font-weight:700
}
.hs-btn:hover{background:rgba(255,255,255,.12)}
.hs-btn svg{width:30px;height:30px;fill:currentColor}
.hs-skip svg{width:30px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hs-play svg{width:46px;height:46px}
.hs-spacer{flex:1}
.hs-vol{display:flex;align-items:center}
.hs-vol input{width:0;opacity:0;height:4px;accent-color:#fff;transition:width .2s,opacity .2s}
.hs-vol:hover input,.hs-vol:focus-within input{width:90px;opacity:1;margin-right:8px}
@media(hover:none){.hs-vol input{display:none}}
.hs-center{
  position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%);
  display:none;place-items:center;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;cursor:pointer
}
.hs-center.paused{display:grid}
.hs-center svg{width:44px;height:44px;fill:currentColor}
.hs-spinner{
  position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:4;
  border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
  animation:ks-spin .8s linear infinite;display:none;pointer-events:none
}
.hs-spinner.on{display:block}
.hs-flash{
  position:absolute;top:50%;margin-top:-30px;z-index:4;padding:14px 20px;border-radius:30px;
  background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s
}
.hs-flash.l{left:12%}.hs-flash.r{right:12%}.hs-flash.on{opacity:1}
.hs-menu{
  position:absolute;top:calc(max(16px,env(safe-area-inset-top,0px)) + 66px);right:clamp(14px,3vw,40px);
  min-width:240px;max-width:min(320px,calc(100vw - 28px));max-height:60vh;overflow:auto;padding:8px;
  background:rgba(20,20,24,.96);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)
}
.hs-menu[hidden]{display:none}
.hs-menu h4{margin:0;padding:10px 12px 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.hs-menu p{margin:0;padding:12px;font-size:14px;color:rgba(255,255,255,.6)}
.hs-menu button{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px;
  background:none;border:0;border-radius:8px;color:#fff;font-size:16px;font-weight:500;text-align:left;cursor:pointer
}
.hs-menu button:hover{background:rgba(255,255,255,.1)}
.hs-menu button.on{font-weight:700}
.hs-menu button.on::after{content:"\2713";color:#1f80ff}
#status{top:84px;bottom:auto;left:50%;transform:translate(-50%,-6px)}
#status.show{transform:translate(-50%,0)}
@media(max-width:640px){
  #hs-a-btn b{display:none}
  .hs-btn svg{width:26px;height:26px}
  .hs-play svg{width:40px;height:40px}
}
/* Unbounded only for EV branding */
.logo,#ch-title{font-family:var(--brand)}
</style>
</head>
<body>

<div id="overlay">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="16" cy="16" r="13" fill="none"
      style="stroke:var(--ks-color);stroke-width:var(--ks-stroke);stroke-linecap:round;stroke-dasharray:21.24 60.44"/>
  </svg>
  <p id="loadMsg">Loading</p>
</div>

<div id="status"></div>

<div id="channel-list" aria-label="Channel selection">
  <header class="ch-bar">
    <div class="wrap">
      <a class="logo" href="./">EV <b>DEVELOPERS</b></a>
      <div class="bar-right">
        <span id="ch-count" aria-live="polite"></span>
        <button id="theme" type="button" aria-label="Switch light or dark theme">&#9680;</button>
      </div>
    </div>
  </header>
  <main class="wrap ch-main">
    <section class="ch-hero">
      <p class="where">Live channels</p>
      <h1 id="ch-title" aria-label="EV DEVELOPERS EMBED DIRECTORY"><span><i>EV Developers</i></span><span><i>Embed Directory</i></span></h1>
      <p class="lede">Choose a live stream to begin watching.</p>
    </section>
    <label class="channel-search">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

var API = "https://sonujson-v5.pages.dev/Data/sports.json";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $list    = document.getElementById("channel-list");
var $grid    = document.getElementById("ch-grid");
var $pc      = document.getElementById("pc");
var $vid     = document.getElementById("v");
var _stTmr   = null;

function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}

(function(){
  var root = document.documentElement;
  try{ var saved = localStorage.getItem("ev_theme"); if(saved) root.setAttribute("data-theme", saved); }catch(_){}
  var btn = document.getElementById("theme");
  if(!btn) return;
  btn.addEventListener("click", function(){
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("ev_theme", next); }catch(_){}
  });
})();

var TIER = getTier();
var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
function getChId()    { return new URLSearchParams(location.search).get("id") || ""; }

function rawCookie(c){
  return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
}
function withCookie(u, r){
  if(!u || !r) return u;
  if(u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}

function isNonEmpty(v){
  return typeof v === "string" && v.trim().length > 0;
}

function normalizeKidKey(kid, key){
  if(!isNonEmpty(kid) || !isNonEmpty(key)) return null;
  return {
    kid: kid.trim().toLowerCase(),
    key: key.trim().toLowerCase()
  };
}

function buildClearKeys(ch){
  var out = {};
  if(Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0){
    ch.sonuxs.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }
  var single = normalizeKidKey(ch.key_id, ch.key);
  if(single) out[single.kid] = single.key;
  return out;
}

function keyModeOf(ch){
  var hasMulti  = Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0;
  var hasSingle = isNonEmpty(ch.key_id) && isNonEmpty(ch.key);
  if(hasMulti && hasSingle) return "mixed";
  if(hasMulti)              return "multi";
  if(hasSingle)             return "single";
  return "none";
}

async function loadData(){
  var r = await fetch(API, {cache:"no-store", headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var d = await r.json();
  if(!d || !Array.isArray(d.channels) || !d.channels.length) throw new Error("empty");
  return d;
}

var LOGO_STAR = "https://indiantelevision.com/wp-content/uploads/2025/12/SS_logo.jpg";
var LOGO_SONY = "https://etimg.etb2bimg.com/photo/132430165.cms";
function logoFor(name){
  name = String(name || "");
  if(/star\s*sports/i.test(name)) return LOGO_STAR;
  if(/sony\s*(sports|ten)|\bten\s*[1-5]\b/i.test(name)) return LOGO_SONY;
  return "";
}

function renderList(channels){
  hideOverlay();
  var $count = document.getElementById("ch-count");
  var $search = document.getElementById("channel-search");
  var $empty = document.getElementById("ch-empty");

  function firstWord(name){
    var w = String(name || "").trim().split(/\s+/)[0];
    return w || "Other";
  }

  function makeCard(ch, i, cat){
    var a = document.createElement("a");
    var num = document.createElement("span");
    var name = document.createElement("span");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);
    a.setAttribute("role", "listitem");
    num.className = "ch-num";
    num.textContent = String(i + 1).padStart(2, "0");
    name.className = "ch-name";
    var full = String(ch.name || "").trim() || "Untitled channel";
    var rest = full;
    if(cat && full.toLowerCase().indexOf(cat.toLowerCase()) === 0){
      rest = full.slice(cat.length).trim() || full;
    }
    name.textContent = rest;
    a.title = ch.name || "";
    var lg = logoFor(ch.name);
    function plainRow(){
      var row = document.createElement("div");
      row.className = "ch-top";
      row.appendChild(num);
      return row;
    }
    if(lg){
      var wrap = document.createElement("div");
      wrap.className = "ch-logo-wrap" + (lg === LOGO_STAR ? " zoom" : "");
      var img = document.createElement("img");
      img.className = "ch-logo";
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.src = lg;
      img.addEventListener("error", function(){
        a.classList.remove("has-logo");
        a.replaceChildren(plainRow(), name);
      });
      wrap.appendChild(img);
      var meta = document.createElement("div");
      meta.className = "ch-meta";
      meta.appendChild(num);
      meta.appendChild(name);
      a.classList.add("has-logo");
      a.appendChild(wrap);
      a.appendChild(meta);
    }else{
      a.appendChild(plainRow());
      a.appendChild(name);
    }
    return a;
  }

  function draw(items){
    var groups = [], map = Object.create(null);
    items.forEach(function(ch){
      var w = firstWord(ch.name), k = w.toLowerCase();
      if(!map[k]){ map[k] = {label:w, items:[]}; groups.push(map[k]); }
      map[k].items.push(ch);
    });

    var $chips = document.getElementById("ch-chips");
    $grid.replaceChildren();
    if($chips) $chips.replaceChildren();

    var f = document.createDocumentFragment();
    var cf = document.createDocumentFragment();
    groups.forEach(function(g, gi){
      var sec = document.createElement("section");
      sec.className = "ch-group";
      sec.id = "grp-" + gi;

      var head = document.createElement("div");
      head.className = "ch-group-head";
      var h = document.createElement("h2");
      h.textContent = g.label;
      var n = document.createElement("span");
      n.className = "ch-group-count";
      n.textContent = g.items.length + (g.items.length === 1 ? " channel" : " channels");
      head.appendChild(h);
      head.appendChild(n);
      var gl = "";
      for(var li = 0; li < g.items.length && !gl; li++) gl = logoFor(g.items[li].name);
      if(gl){
        var gimg = document.createElement("img");
        gimg.className = "ch-group-logo";
        gimg.alt = "";
        gimg.loading = "lazy";
        gimg.decoding = "async";
        gimg.referrerPolicy = "no-referrer";
        gimg.src = gl;
        gimg.addEventListener("error", function(){ this.remove(); });
        head.appendChild(gimg);
      }

      var cards = document.createElement("div");
      cards.className = "ch-cards";
      cards.setAttribute("role", "list");
      cards.setAttribute("aria-label", g.label + " channels");
      g.items.forEach(function(ch, i){ cards.appendChild(makeCard(ch, i, g.label)); });

      sec.appendChild(head);
      sec.appendChild(cards);
      f.appendChild(sec);

      if(groups.length > 1){
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "ch-chip";
        chip.appendChild(document.createTextNode(g.label + " "));
        var cn = document.createElement("span");
        cn.textContent = g.items.length;
        chip.appendChild(cn);
        chip.addEventListener("click", function(){
          var target = document.getElementById("grp-" + gi);
          if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
        });
        cf.appendChild(chip);
      }
    });
    $grid.appendChild(f);
    if($chips) $chips.appendChild(cf);
    if($empty) $empty.hidden = items.length !== 0;
  }

  function filter(){
    var query = ($search && $search.value ? $search.value : "").trim().toLowerCase();
    var items = query ? channels.filter(function(ch){
      return String(ch.name || "").toLowerCase().indexOf(query) !== -1;
    }) : channels;
    if($count) $count.textContent = items.length + (items.length === 1 ? " channel" : " channels");
    draw(items);
  }

  if($search) $search.addEventListener("input", filter);
  filter();
  $list.style.display = "block";
}

function errMsg(msg){
  setMsg(msg);
  $overlay.style.display = "flex";
  toast(msg, "err", 0);
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {
    "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1,
    "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2
  };
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

function injectControls(container, vid){
  var panel = container.querySelector("#hs-fit-slot");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx  = 0;
  var fitBtn  = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();

  return true;
}

var HS_ICON = {
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol:   '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
  mute:  '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
  fs:    '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
  fsx:   '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>'
};

function initHotUI(player, vid, pc, ch){
  function el(id){ return document.getElementById(id); }
  var hs = el("hs"), menu = el("hs-menu"), seek = el("hs-seek");
  var bufEl = el("hs-buf"), playedEl = el("hs-played"), thumb = el("hs-thumb");
  var timeEl = el("hs-time"), playBtn = el("hs-play"), centerBtn = el("hs-center");
  var muteBtn = el("hs-mute"), volEl = el("hs-vol"), fsBtn = el("hs-fs"), pipBtn = el("hs-pip");
  var qVal = el("hs-q-val"), spinner = el("hs-spinner");
  var hideT = null, menuOpen = false, menuKind = "", dragging = false;

  el("hs-title").textContent = ch.name || "";

  function fmt(s){
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = (m < 10 ? "0" : "") + m, ss = (x < 10 ? "0" : "") + x;
    return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
  }
  function range(){
    try{
      var r = player.seekRange();
      if(r && isFinite(r.start) && isFinite(r.end) && r.end > r.start) return r;
    }catch(_){}
    if(isFinite(vid.duration) && vid.duration > 0) return {start:0, end:vid.duration};
    return null;
  }
  function isLive(){ try{ return player.isLive(); }catch(_){ return false; } }
  function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }

  /* ---------- show / hide ---------- */
  function showUI(){
    hs.classList.add("hs-show");
    pc.style.cursor = "";
    clearTimeout(hideT);
    if(!vid.paused && !menuOpen && !dragging) hideT = setTimeout(hideUI, 3500);
  }
  function hideUI(){
    if(vid.paused || menuOpen || dragging) return;
    hs.classList.remove("hs-show");
    pc.style.cursor = "none";
  }

  /* ---------- play / mute / fullscreen ---------- */
  function togglePlay(){
    if(vid.paused){ var p = vid.play(); if(p && p.catch) p.catch(function(){}); }
    else vid.pause();
  }
  function syncPlay(){
    var paused = vid.paused;
    playBtn.innerHTML = paused ? HS_ICON.play : HS_ICON.pause;
    centerBtn.innerHTML = HS_ICON.play;
    centerBtn.classList.toggle("paused", paused);
    playBtn.setAttribute("aria-label", paused ? "Play" : "Pause");
    if(paused){ spinner.classList.remove("on"); showUI(); } else showUI();
  }
  function syncVol(){
    var m = vid.muted || vid.volume === 0;
    muteBtn.innerHTML = m ? HS_ICON.mute : HS_ICON.vol;
    volEl.value = m ? 0 : vid.volume;
  }
  function toggleFs(){
    if(isFs()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }else if(pc.requestFullscreen){
      pc.requestFullscreen().catch(function(){});
    }else if(pc.webkitRequestFullscreen){
      pc.webkitRequestFullscreen();
    }else if(vid.webkitEnterFullscreen){
      vid.webkitEnterFullscreen();
    }
  }
  function onFsChange(){
    var on = !!isFs();
    fsBtn.innerHTML = on ? HS_ICON.fsx : HS_ICON.fs;
    try{
      if(on && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function(){});
      if(!on && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }catch(_){}
  }
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){ document.addEventListener(ev, onFsChange); });

  function flash(side){
    var f = el("hs-flash-" + side);
    f.classList.add("on");
    setTimeout(function(){ f.classList.remove("on"); }, 450);
  }
  function skip(d){
    var r = range(), t = vid.currentTime + d;
    if(r) t = Math.min(Math.max(t, r.start + .25), r.end - .5);
    try{ vid.currentTime = t; }catch(_){}
    flash(d < 0 ? "l" : "r");
    showUI();
  }

  /* ---------- seek bar ---------- */
  function setVisual(f){
    playedEl.style.width = (f * 100) + "%";
    thumb.style.left = (f * 100) + "%";
  }
  function updateSeek(){
    var r = range(), cur = vid.currentTime, live = isLive();
    if(!r){
      if(!dragging) setVisual(0);
      timeEl.className = "hs-time";
      timeEl.textContent = live ? "LIVE" : "--:--";
      return;
    }
    var len = r.end - r.start;
    var f = Math.min(1, Math.max(0, (cur - r.start) / len));
    if(!dragging) setVisual(f);
    var b = vid.buffered, bEnd = cur;
    for(var i = 0; i < b.length; i++){
      if(cur >= b.start(i) - .5 && cur <= b.end(i) + .5){ bEnd = b.end(i); break; }
    }
    bufEl.style.width = (Math.min(1, Math.max(0, (bEnd - r.start) / len)) * 100) + "%";
    if(live){
      var behind = r.end - cur;
      if(behind < 10){
        timeEl.className = "hs-time hs-live";
        timeEl.innerHTML = '<i></i>LIVE';
        timeEl.title = "";
      }else{
        timeEl.className = "hs-time hs-behind";
        timeEl.textContent = "-" + fmt(behind);
        timeEl.title = "Go to live";
      }
    }else{
      timeEl.className = "hs-time";
      timeEl.textContent = fmt(r.end - cur);
    }
  }
  function fracFromEvent(e){
    var b = seek.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - b.left) / b.width));
  }
  seek.addEventListener("pointerdown", function(e){
    dragging = true;
    seek.classList.add("drag");
    try{ seek.setPointerCapture(e.pointerId); }catch(_){}
    setVisual(fracFromEvent(e));
    e.preventDefault();
    showUI();
  });
  seek.addEventListener("pointermove", function(e){ if(dragging) setVisual(fracFromEvent(e)); });
  seek.addEventListener("pointerup", function(e){
    if(!dragging) return;
    dragging = false;
    seek.classList.remove("drag");
    var r = range();
    if(r){
      var t = r.start + fracFromEvent(e) * (r.end - r.start);
      t = Math.max(r.start, Math.min(t, r.end - .5));
      try{ vid.currentTime = t; }catch(_){}
    }
    showUI();
  });
  seek.addEventListener("pointercancel", function(){ dragging = false; seek.classList.remove("drag"); });
  timeEl.addEventListener("click", function(){
    if(!isLive()) return;
    var r = range();
    if(r) try{ vid.currentTime = r.end - 1; }catch(_){}
  });

  /* ---------- quality / audio / subtitle menus ---------- */
  function langName(c){
    if(!c || c === "und") return "Default";
    try{ return new Intl.DisplayNames([navigator.language || "en"], {type:"language"}).of(c) || c; }
    catch(_){ return c; }
  }
  function abrOn(){ try{ return !!player.getConfiguration().abr.enabled; }catch(_){ return true; } }
  function activeTrack(){
    var t = player.getVariantTracks();
    for(var i = 0; i < t.length; i++) if(t[i].active) return t[i];
    return null;
  }
  function refreshQ(){
    var cur = activeTrack();
    qVal.textContent = (!abrOn() && cur && cur.height) ? cur.height + "p" : "Auto";
  }
  function addHead(t){ var h = document.createElement("h4"); h.textContent = t; menu.appendChild(h); }
  function addItem(label, on, fn){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if(on) b.className = "on";
    b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });
    menu.appendChild(b);
  }
  function addNote(t){ var p = document.createElement("p"); p.textContent = t; menu.appendChild(p); }

  function buildQuality(){
    var cur = activeTrack(), lang = cur ? cur.language : null, byH = {};
    player.getVariantTracks().forEach(function(t){
      if(!t.height) return;
      if(lang && t.language !== lang) return;
      if(!byH[t.height] || t.bandwidth > byH[t.height].bandwidth) byH[t.height] = t;
    });
    var heights = Object.keys(byH).map(Number).sort(function(a, b){ return b - a; });
    var auto = abrOn();
    addHead("Quality");
    addItem("Auto", auto, function(){
      player.configure({abr:{enabled:true}});
      refreshQ(); closeMenu();
    });
    heights.forEach(function(h){
      addItem(h + "p", !auto && cur && cur.height === h, function(){
        player.configure({abr:{enabled:false}});
        player.selectVariantTrack(byH[h], true);
        refreshQ(); closeMenu();
      });
    });
  }
  function buildAudioSubs(){
    var langs = [], texts = [];
    try{ langs = player.getAudioLanguagesAndRoles(); }catch(_){}
    try{ texts = player.getTextTracks(); }catch(_){}
    var cur = activeTrack(), curLang = cur ? cur.language : null;
    if(langs.length){
      addHead("Audio");
      langs.forEach(function(l){
        addItem(l.label || langName(l.language), l.language === curLang, function(){
          try{ player.selectAudioLanguage(l.language, l.role || undefined); }catch(_){}
          closeMenu();
        });
      });
    }
    if(texts.length){
      var vis = false;
      try{ vis = player.isTextTrackVisible(); }catch(_){}
      addHead("Subtitles");
      addItem("Off", !vis, function(){ try{ player.setTextTrackVisibility(false); }catch(_){} closeMenu(); });
      texts.forEach(function(t){
        addItem(t.label || langName(t.language), vis && t.active, function(){
          try{ player.selectTextTrack(t); player.setTextTrackVisibility(true); }catch(_){}
          closeMenu();
        });
      });
    }
    if(!langs.length && !texts.length){
      addHead("Audio & Subtitles");
      addNote("No other options for this stream.");
    }
  }
  function openMenu(kind){
    if(menuKind === kind && !menu.hidden){ closeMenu(); return; }
    menu.replaceChildren();
    if(kind === "q") buildQuality(); else buildAudioSubs();
    menuKind = kind;
    menu.hidden = false;
    menuOpen = true;
    showUI();
  }
  function closeMenu(){
    menu.hidden = true;
    menuOpen = false;
    menuKind = "";
    showUI();
  }
  document.addEventListener("pointerdown", function(e){
    if(menu.hidden) return;
    if(menu.contains(e.target) || (e.target.closest && e.target.closest("#hs-q-btn,#hs-a-btn"))) return;
    closeMenu();
  }, true);

  ["trackschanged","variantchanged","adaptation"].forEach(function(ev){
    player.addEventListener(ev, refreshQ);
  });

  /* ---------- buttons ---------- */
  el("hs-back").addEventListener("click", function(){
    try{ if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }catch(_){}
    location.href = location.pathname;
  });
  el("hs-q-btn").addEventListener("click", function(e){ e.stopPropagation(); openMenu("q"); });
  el("hs-a-btn").addEventListener("click", function(e){ e.stopPropagation(); openMenu("a"); });
  playBtn.addEventListener("click", togglePlay);
  centerBtn.addEventListener("click", togglePlay);
  el("hs-back10").addEventListener("click", function(){ skip(-10); });
  el("hs-fwd10").addEventListener("click", function(){ skip(10); });
  muteBtn.addEventListener("click", function(){ vid.muted = !vid.muted; if(!vid.muted && vid.volume === 0) vid.volume = 1; });
  volEl.addEventListener("input", function(){ var v = parseFloat(volEl.value); vid.volume = v; vid.muted = v === 0; });
  fsBtn.addEventListener("click", toggleFs);
  if(document.pictureInPictureEnabled && !vid.disablePictureInPicture){
    pipBtn.hidden = false;
    pipBtn.addEventListener("click", function(){
      if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
      else vid.requestPictureInPicture().catch(function(){});
    });
  }

  /* ---------- tap / click on the video ---------- */
  var lastPtr = "mouse", tapTimer = null, lastTapT = 0;
  pc.addEventListener("pointerdown", function(e){ lastPtr = e.pointerType || "mouse"; }, true);
  pc.addEventListener("pointermove", function(e){ if(e.pointerType === "mouse") showUI(); });
  pc.addEventListener("click", function(e){
    if(e.target.closest(".hs-top,.hs-bottom,.hs-menu,.hs-center")) return;
    if(menuOpen){ closeMenu(); return; }
    var now = Date.now(), w = pc.clientWidth, x = e.clientX;
    if(now - lastTapT < 300){
      clearTimeout(tapTimer);
      lastTapT = 0;
      if(lastPtr === "touch"){
        if(x < w * .4) skip(-10); else if(x > w * .6) skip(10); else toggleFs();
      }else toggleFs();
      return;
    }
    lastTapT = now;
    tapTimer = setTimeout(function(){
      if(lastPtr === "touch"){
        if(hs.classList.contains("hs-show") && !vid.paused){
          hs.classList.remove("hs-show");
        }else showUI();
      }else togglePlay();
    }, 260);
  });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function(e){
    var tag = e.target && e.target.tagName;
    if(tag === "INPUT" && e.target.type !== "range") return;
    var k = e.key;
    if(k === " " || k === "k" || k === "K"){ e.preventDefault(); togglePlay(); }
    else if(k === "ArrowLeft"){ e.preventDefault(); skip(-10); }
    else if(k === "ArrowRight"){ e.preventDefault(); skip(10); }
    else if(k === "ArrowUp" && tag !== "INPUT"){ e.preventDefault(); vid.muted = false; vid.volume = Math.min(1, vid.volume + .1); }
    else if(k === "ArrowDown" && tag !== "INPUT"){ e.preventDefault(); vid.volume = Math.max(0, vid.volume - .1); }
    else if(k === "m" || k === "M"){ vid.muted = !vid.muted; }
    else if(k === "f" || k === "F"){ toggleFs(); }
    else if(k === "Escape" && menuOpen){ closeMenu(); }
    showUI();
  });

  /* ---------- video state ---------- */
  vid.addEventListener("play", syncPlay);
  vid.addEventListener("pause", syncPlay);
  vid.addEventListener("playing", function(){ spinner.classList.remove("on"); syncPlay(); });
  vid.addEventListener("waiting", function(){ if(!vid.paused) spinner.classList.add("on"); });
  vid.addEventListener("seeking", function(){ if(!vid.paused) spinner.classList.add("on"); });
  vid.addEventListener("canplay", function(){ spinner.classList.remove("on"); });
  vid.addEventListener("seeked", function(){ spinner.classList.remove("on"); });
  vid.addEventListener("volumechange", syncVol);
  vid.addEventListener("timeupdate", updateSeek);
  setInterval(updateSeek, 500);

  syncPlay(); syncVol(); onFsChange(); refreshQ(); updateSeek();
}

async function startPlayer(ch){
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

  var player = new shaka.Player();
  await player.attach($vid);

  initHotUI(player, $vid, $pc, ch);

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var cookie  = ch.cookie;
  var raw     = rawCookie(cookie);
  var url     = ch.stream_url;
  var drmKeys = buildClearKeys(ch);

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(Object.keys(drmKeys).length === 0){
    toast("No DRM Keys · Stream Blocked","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      preferredAudioLanguage: '',
      preferredAudioCodecs: ['mp4a.40.2','mp4a.40.5','ac-3','ec-3','opus','flac'],
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var audioFixed = false;
  player.addEventListener('trackschanged', function(){
    if(audioFixed) return;
    var langs = player.getAudioLanguages();
    if(!langs || !langs.length) return;
    try{ player.selectAudioLanguage(langs[0]); audioFixed = true; }catch(_){}
  });

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries = 0;
  var lastTry = 0;
  var started = false;
  var stallTmr = null;
  var _bufState = false;
  var _lastCurr = 0;
  var seekState = {active:false,wantsDvr:false,target:null,timer:null};

  function clearStallTimer(){
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
  }

  function clearBuf(){
    _bufState = false;
    clearStallTimer();
  }

  function getSeekRange(){
    try{
      var range = player.seekRange();
      if(range && isFinite(range.start) && isFinite(range.end) && range.end > range.start) return range;
    }catch(_){}
    return null;
  }

  function isDvrPosition(time){
    var range = getSeekRange();
    return !!range && isFinite(time) && time < range.end - 7;
  }

  function rememberPosition(){
    var time = $vid.currentTime;
    if(isDvrPosition(time)){
      seekState.wantsDvr = true;
      seekState.target = time;
      return;
    }
    seekState.wantsDvr = false;
    seekState.target = null;
  }

  function restoreDvrPosition(time){
    var range = getSeekRange();
    if(!range || !isFinite(time)) return false;
    var lower = Math.min(range.end - .25, range.start + .25);
    var upper = Math.max(lower, range.end - .75);
    var target = Math.min(Math.max(time, lower), upper);
    try{
      $vid.currentTime = target;
      seekState.wantsDvr = true;
      seekState.target = target;
      return Math.abs(target - time) < 1;
    }catch(_){
      return false;
    }
  }

  function bufferingMessage(){
    return seekState.wantsDvr || seekState.active ? "Loading Replay · Please Wait" : "Buffering · Fetching Segments";
  }

  function onBufResume(){
    if(!_bufState) return;
    var wasDvr = seekState.wantsDvr;
    clearBuf();
    if(!refreshing) toast(wasDvr ? "Replay · Playing Behind Live" : "On Air · Stream Active", wasDvr ? "ok" : "live", 2600);
  }

  function scheduleRecovery(delay){
    clearStallTimer();
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!refreshing && started && !$vid.paused && !seekState.active) reload();
    }, delay);
  }

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown", unmuteOnce, {capture:true,once:true});

  function onSeeking(){
    seekState.active = true;
    if(seekState.timer) clearTimeout(seekState.timer);
    rememberPosition();
    clearStallTimer();
    if(started && !$vid.paused){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
    }
  }

  function onSeeked(){
    rememberPosition();
    if(seekState.timer) clearTimeout(seekState.timer);
    seekState.timer = setTimeout(function(){
      seekState.active = false;
      seekState.timer = null;
      if(_bufState && started && !$vid.paused) scheduleRecovery(5000);
    }, 7000);
    if($vid.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA && !$vid.paused) onBufResume();
  }

  $vid.addEventListener("timeupdate", function(){
    if($vid.paused || $vid.ended || !started || refreshing) return;
    var time = $vid.currentTime;
    if(time > _lastCurr + .01){
      _lastCurr = time;
      onBufResume();
    }
  });

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable · Max Retries Reached", "err", 0); return; }
    rememberPosition();
    var resumeAt = seekState.wantsDvr ? seekState.target : null;
    refreshing = true;
    lastTry = now;
    retries++;
    clearStallTimer();
    toast(resumeAt !== null ? "Reconnecting Replay · Attempt " + retries + " Of 5" : "Reconnecting · Attempt " + retries + " Of 5", "warn", 0);
    try{
      var d = await loadData();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie = fresh.cookie;
      raw = rawCookie(cookie);
      drmKeys = freshKeys;
      url = fresh.stream_url;
      audioFixed = false;
      _bufState = false;
      _lastCurr = 0;
      player.configure(buildCfg());
      await player.load(url, resumeAt === null ? undefined : resumeAt);
      var restored = resumeAt === null ? false : restoreDvrPosition(resumeAt);
      await $vid.play().catch(function(){});
      retries = 0;
      if(resumeAt !== null && !restored) toast("Replay Position Expired · Starting At Earliest Available", "ok", 4000);
      else toast(resumeAt !== null ? "Replay · Resuming Selected Position" : "On Air · Stream Active", resumeAt !== null ? "ok" : "live", 4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{
      refreshing = false;
    }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      rememberPosition();
      var recoveryPoint = seekState.wantsDvr ? seekState.target : null;
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Stream Quality", "warn", 2000);
      player.load(url, recoveryPoint === null ? undefined : recoveryPoint)
        .then(function(){
          if(recoveryPoint !== null) restoreDvrPosition(recoveryPoint);
          return $vid.play();
        })
        .then(function(){ toast(recoveryPoint !== null ? "Replay · Playing Behind Live" : "On Air · Stream Active", recoveryPoint !== null ? "ok" : "live", 4000); })
        .catch(function(){
          refreshing = false;
          reload();
        })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
      if(!seekState.active) scheduleRecovery(1500);
    }else{
      toast(shakaErrStr(err), "err", 6000);
    }
  });

  try{
    setMsg("Loading Stream");
    toast("Loading Stream · Please Wait", "warn", 0);
    await player.load(url);
    hideOverlay();
    toast("Ready · Tap Play To Start", "ok", 5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error · Retrying Now", "warn", 0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(refreshing || $vid.paused) return;
    _bufState = true;
    toast(bufferingMessage(), "warn", 0);
    if(!started || seekState.active) return;
    scheduleRecovery(9000);
  }

  function onPlaying(){
    started = true;
    if(!audioFixed){
      var langs = player.getAudioLanguages();
      if(langs && langs.length){
        try{ player.selectAudioLanguage(langs[0]); audioFixed = true; }catch(_){}
      }
    }
    onBufResume();
  }

  function onCanPlay(){
    if(started && !_bufState) return;
    if(started && !$vid.paused) onBufResume();
  }

  $vid.addEventListener("seeking", onSeeking);
  $vid.addEventListener("seeked", onSeeked);
  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("canplay", onCanPlay);
  $vid.addEventListener("pause", function(){
    if(!seekState.active) clearBuf();
  });
  $vid.addEventListener("error", function(){
    if(!refreshing){
      _bufState = true;
      toast(bufferingMessage(), "warn", 0);
      if(!seekState.active) scheduleRecovery(1500);
    }
  });

  var resumeAfterVisibilityChange = false;
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      resumeAfterVisibilityChange = started && !$vid.paused;
      return;
    }
    setTimeout(function(){
      if(resumeAfterVisibilityChange && started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      resumeAfterVisibilityChange = false;
    }, 400);
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network · Reducing Quality","warn",3000);
    });
  }
}

async function main(){
  var id = getChId(), data;
  try{
    setMsg("Fetching Channels");
    data = await loadData();
  }catch(_){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }
  if(!id){ renderList(data.channels); return; }
  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){ errMsg("Channel Not Found."); return; }
  document.title = ch.name;
  await startPlayer(ch);
}

document.addEventListener("DOMContentLoaded", main);
})();
</script>
</body>
