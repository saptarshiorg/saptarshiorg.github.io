<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CnpTV - Premium Streaming Player</title>
    <!-- Shaka Player - with fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.0/shaka-player.compiled.min.js" onerror="loadBackupShaka()"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .announcement-banner {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #fff;
            animation: slideDown 0.8s ease-out 0.1s both;
            backdrop-filter: blur(10px);
        }

        .announcement-banner h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .announcement-banner p {
            font-size: 0.95em;
            line-height: 1.6;
        }

        .error-banner {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            animation: shake 0.5s;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .success-banner {
            background: rgba(100, 200, 100, 0.2);
            border: 2px solid #6fc86f;
            color: #6fc86f;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
            line-height: 1.6;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cards-section {
            display: block;
            transition: all 0.3s ease;
        }

        .cards-section.hidden {
            display: none;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: scaleIn 0.5s ease-out;
        }

        .match-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 20px 50px rgba(255, 107, 107, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .match-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .match-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .match-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(255, 107, 107, 0.3));
        }

        .match-play-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .match-card:hover .match-play-icon {
            transform: scale(1.2);
            background: #ff6b6b;
            color: white;
        }

        .match-info {
            padding: 20px;
            color: white;
        }

        .match-info h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #fff;
        }

        .match-id {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 10px;
        }

        .player-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
            display: none;
        }

        .player-section.visible {
            display: block;
        }

        #video-container {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            position: relative;
            background: #000;
        }

        #shaka-video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .player-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-header h2 {
            color: white;
            font-size: 1.5em;
        }

        .close-btn {
            background: rgba(255, 107, 107, 0.8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        .player-controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .player-info {
            flex: 1;
            min-width: 200px;
        }

        .player-info h3 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 1.3em;
        }

        .player-info p {
            color: #aaa;
            font-size: 0.9em;
        }

        .server-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .server-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .server-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .server-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .debug-console {
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            border: 1px solid #0f0;
        }

        .debug-console.visible {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px 20px 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer p {
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .last-updated {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .player-controls {
                flex-direction: column;
                align-items: flex-start;
            }

            .server-selector {
                width: 100%;
            }

            .server-btn {
                flex: 1;
                min-width: 100px;
            }

            .player-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 CnpTV</h1>
            <p>Premium Streaming Experience</p>
        </div>

        <div class="announcement-banner" id="announcementBanner">
            <h3>📢 Service Update</h3>
            <p id="announcementText">Initializing player...</p>
        </div>

        <div class="success-banner" id="successBanner"></div>
        <div id="errorBanner" class="error-banner"></div>

        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
            <p>Loading matches...</p>
        </div>

        <div id="cardsSection" class="cards-section">
            <div id="matchesContainer" class="matches-grid"></div>
        </div>

        <div id="playerSection" class="player-section">
            <div class="player-header">
                <h2 id="playerEventName">Loading...</h2>
                <button class="close-btn" id="closePlayerBtn">← Back to Matches</button>
            </div>
            <div id="video-container">
                <video id="shaka-video" controls></video>
            </div>
            <div class="player-controls">
                <div class="player-info">
                    <h3 id="currentEventName">Selected Match</h3>
                    <p id="currentEventId">Match ID</p>
                </div>
                <div class="server-selector" id="serverSelector">
                    <button class="server-btn active" data-server="amazon_server">Amazon</button>
                    <button class="server-btn" data-server="fastly_server">Fastly</button>
                    <button class="server-btn" data-server="cloudfront_server">CloudFront</button>
                </div>
            </div>
            <div class="debug-console" id="debugConsole"></div>
        </div>

        <div class="footer">
            <p>© 2026 CnpTV. All rights reserved.</p>
            <p class="last-updated" id="lastUpdated">Last updated: Loading...</p>
        </div>
    </div>

    <script>
        let player;
        let playerReady = false;
        let currentData;
        let selectedServer = 'amazon_server';
        let currentMatch = null;
        let debugLogs = [];

        const JSON_URLS = [
            'https://sonujson-devloper.vercel.app/Data/prime.json',
            'https://cors-anywhere.herokuapp.com/https://sonujson-devloper.vercel.app/Data/prime.json'
        ];

        // Load backup Shaka if CDN fails
        function loadBackupShaka() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.min.js';
            script.onerror = function() {
                addDebugLog('All CDN attempts failed', 'error');
                showError('Failed to load video player library. Check your internet connection.');
            };
            document.head.appendChild(script);
        }

        function addDebugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✓' : 'ℹ️';
            const logMessage = `${prefix} [${timestamp}] ${message}`;
            debugLogs.push(logMessage);
            
            const debugConsole = document.getElementById('debugConsole');
            debugConsole.innerHTML = debugLogs.slice(-15).map(log => log + '<br>').join('');
            debugConsole.scrollTop = debugConsole.scrollHeight;
            
            console.log(logMessage);
        }

        async function initShakaPlayer() {
            return new Promise((resolve, reject) => {
                // Wait for Shaka to be available
                const checkShaka = setInterval(() => {
                    if (typeof shaka !== 'undefined') {
                        clearInterval(checkShaka);
                        
                        try {
                            addDebugLog('Shaka Player library detected', 'success');
                            shaka.polyfill.installAll();
                            addDebugLog('Shaka polyfills installed', 'success');

                            if (!shaka.util.Platform.supportsMediaSource()) {
                                addDebugLog('MediaSource API not supported', 'error');
                                reject(new Error('Browser does not support media playback'));
                                return;
                            }

                            const videoElement = document.getElementById('shaka-video');
                            if (!videoElement) {
                                addDebugLog('Video element not found', 'error');
                                reject(new Error('Video element missing'));
                                return;
                            }

                            player = new shaka.Player(videoElement);
                            addDebugLog('Shaka Player initialized', 'success');

                            player.configure({
                                streaming: {
                                    bufferingGoal: 8,
                                    retryParameters: {
                                        maxAttempts: 3,
                                        baseDelay: 1000,
                                        backoffFactor: 2,
                                        timeout: 30000
                                    }
                                }
                            });

                            setupPlayerEventListeners();
                            playerReady = true;
                            addDebugLog('Player ready for playback', 'success');
                            showSuccess('✓ Player initialized successfully!');
                            resolve();

                        } catch (error) {
                            addDebugLog('Init error: ' + error.message, 'error');
                            reject(error);
                        }
                    }
                }, 100);

                // Timeout after 5 seconds
                setTimeout(() => {
                    clearInterval(checkShaka);
                    if (!playerReady) {
                        addDebugLog('Shaka library load timeout', 'error');
                        reject(new Error('Shaka library failed to load'));
                    }
                }, 5000);
            });
        }

        function setupPlayerEventListeners() {
            const video = document.getElementById('shaka-video');
            
            player.addEventListener('error', onPlayerError);
            video.addEventListener('play', () => addDebugLog('▶ Playing'));
            video.addEventListener('pause', () => addDebugLog('⏸ Paused'));
            video.addEventListener('loadedmetadata', () => {
                addDebugLog(`✓ Duration: ${Math.floor(video.duration)}s`, 'success');
            });
        }

        function onPlayerError(event) {
            const error = event.detail;
            const errorMsg = error.message || error.toString();
            addDebugLog('Player error: ' + errorMsg, 'error');
            showError('Playback error: ' + errorMsg);
        }

        async function fetchData() {
            const loadingContainer = document.getElementById('loadingContainer');
            loadingContainer.style.display = 'block';

            for (let i = 0; i < JSON_URLS.length; i++) {
                try {
                    const url = JSON_URLS[i];
                    addDebugLog(`Fetching data...`);
                    
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        mode: 'cors',
                        credentials: 'omit'
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    currentData = await response.json();
                    
                    if (!currentData.Matches || currentData.Matches.length === 0) {
                        throw new Error('No matches found');
                    }
                    
                    addDebugLog(`✓ Loaded ${currentData.Matches.length} matches`, 'success');
                    displayAnnouncement();
                    displayMatches();
                    loadingContainer.style.display = 'none';
                    return;
                    
                } catch (error) {
                    addDebugLog(`Attempt ${i + 1} failed`, 'error');
                    if (i === JSON_URLS.length - 1) {
                        loadSampleData();
                        loadingContainer.style.display = 'none';
                    }
                }
            }
        }

        function loadSampleData() {
            currentData = {
                "last_updated": "19/8/2026, 7:02:58 pm",
                "announcement": "🎬 CnpTV - Using Demo Data",
                "Matches": [
                    {
                        "id": "B0H74QJJXT",
                        "event_name": "England vs. Pakistan",
                        "image": "https://images-na.ssl-images-amazon.com/images/S/le-target-images-prod/amzn1.dv.gti.cc669f9e-07f5-4f31-9fd7-22fbb87c2c9c/4/BOXART-16X9/en-US._UR1920,1080_CLs%7C1920,1080%7C/G/bundle/BottomRightCardGradient16x9.png",
                        "CnpTV": {
                            "amazon_server": "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/0bftapixow/out/v1/a435ed7a00f947deb4369b46d8f2fb70/cenc.mpd",
                            "fastly_server": "https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/0bftapixow/out/v1/a435ed7a00f947deb4369b46d8f2fb70/cenc.mpd",
                            "cloudfront_server": "https://hls-ott.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/0bftapixow/out/v1/a435ed7a00f947deb4369b46d8f2fb70/cenc.mpd"
                        },
                        "drm_key": "290e09c837da78d5cd961978d390515c:b748836c71e6a4ca68ef5b5652db6247"
                    }
                ]
            };
            
            addDebugLog('Using sample data', 'success');
            displayAnnouncement();
            displayMatches();
        }

        function displayAnnouncement() {
            if (currentData.announcement) {
                document.getElementById('announcementText').textContent = currentData.announcement;
            }
            if (currentData.last_updated) {
                document.getElementById('lastUpdated').textContent = `Last updated: ${currentData.last_updated}`;
            }
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (!currentData.Matches || currentData.Matches.length === 0) {
                container.innerHTML = '<p style="color: white; grid-column: 1/-1; text-align: center;">No matches available</p>';
                return;
            }

            currentData.Matches.forEach((match) => {
                const card = createMatchCard(match);
                container.appendChild(card);
            });
        }

        function createMatchCard(match) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="match-image">
                    <img src="${match.image}" alt="${match.event_name}" onerror="this.style.display='none'">
                    <div class="match-play-icon">▶</div>
                </div>
                <div class="match-info">
                    <h3>${match.event_name}</h3>
                    <span class="match-id">${match.id}</span>
                </div>
            `;

            card.addEventListener('click', () => showPlayer(match));
            return card;
        }

        function showPlayer(match) {
            if (!playerReady || !player) {
                addDebugLog('Player not ready', 'error');
                showError('Player is initializing. Please wait...');
                return;
            }

            currentMatch = match;
            
            document.getElementById('cardsSection').classList.add('hidden');
            document.getElementById('playerSection').classList.add('visible');
            document.getElementById('debugConsole').classList.add('visible');

            document.getElementById('playerEventName').textContent = match.event_name;
            document.getElementById('currentEventName').textContent = match.event_name;
            document.getElementById('currentEventId').textContent = `ID: ${match.id}`;

            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('[data-server="amazon_server"]').classList.add('active');
            selectedServer = 'amazon_server';

            setupServerButtons();
            playMatch(match, 'amazon_server');

            setTimeout(() => {
                document.getElementById('playerSection').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function closePlayer() {
            document.getElementById('cardsSection').classList.remove('hidden');
            document.getElementById('playerSection').classList.remove('visible');

            const video = document.getElementById('shaka-video');
            if (video) video.pause();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function playMatch(match, server = null) {
            if (!match || !playerReady || !player) {
                addDebugLog('Cannot play: Player not ready', 'error');
                return;
            }

            try {
                const serverToUse = server || selectedServer;
                const url = match.CnpTV[serverToUse];

                if (!url) {
                    showError('Server not available');
                    addDebugLog(`No URL for ${serverToUse}`, 'error');
                    return;
                }

                addDebugLog(`Loading ${serverToUse}...`);

                try {
                    await player.unload();
                } catch (e) {}

                await player.load(url);
                addDebugLog('✓ Manifest loaded', 'success');
                
                const video = document.getElementById('shaka-video');
                video.play().catch(e => addDebugLog('Play error: ' + e.message, 'error'));
                addDebugLog('▶ Playback started', 'success');

            } catch (error) {
                const errorMsg = error.message || error.toString();
                addDebugLog('Error: ' + errorMsg, 'error');
                showError('Failed to load stream: ' + errorMsg);
            }
        }

        function setupServerButtons() {
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.onclick = null;
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    selectedServer = e.target.dataset.server;
                    
                    if (currentMatch) playMatch(currentMatch, selectedServer);
                });
            });
        }

        function showError(message) {
            const errorBanner = document.getElementById('errorBanner');
            errorBanner.textContent = '❌ ' + message;
            errorBanner.style.display = 'block';
            setTimeout(() => { errorBanner.style.display = 'none'; }, 8000);
        }

        function showSuccess(message) {
            const successBanner = document.getElementById('successBanner');
            successBanner.textContent = message;
            successBanner.style.display = 'block';
            setTimeout(() => { successBanner.style.display = 'none'; }, 5000);
        }

        document.getElementById('closePlayerBtn').addEventListener('click', closePlayer);

        window.addEventListener('load', async () => {
            try {
                addDebugLog('Initializing CnpTV...');
                await initShakaPlayer();
                await fetchData();
            } catch (error) {
                addDebugLog('Fatal error: ' + error.message, 'error');
                showError('Failed to initialize: ' + error.message);
            }
        });

        document.addEventListener('visibilitychange', () => {
            const video = document.getElementById('shaka-video');
            if (document.hidden && video) video.pause();
        });
    </script>
</body>
</html>
