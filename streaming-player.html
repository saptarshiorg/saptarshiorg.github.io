<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CnpTV - Premium Streaming Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.0/shaka-player.compiled.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* Announcement Banner */
        .announcement-banner {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #fff;
            animation: slideDown 0.8s ease-out 0.1s both;
            backdrop-filter: blur(10px);
        }

        .announcement-banner h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .announcement-banner p {
            font-size: 0.95em;
            line-height: 1.6;
        }

        /* Error Banner */
        .error-banner {
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            animation: shake 0.5s;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Loading State */
        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Cards Section (Initial View) */
        .cards-section {
            display: block;
            transition: all 0.3s ease;
        }

        .cards-section.hidden {
            display: none;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: scaleIn 0.5s ease-out;
        }

        .match-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 20px 50px rgba(255, 107, 107, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .match-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .match-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .match-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(255, 107, 107, 0.3));
        }

        .match-play-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .match-card:hover .match-play-icon {
            transform: scale(1.2);
            background: #ff6b6b;
            color: white;
        }

        .match-info {
            padding: 20px;
            color: white;
        }

        .match-info h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #fff;
        }

        .match-id {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 10px;
        }

        /* Player Section (Hidden Initially) */
        .player-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
            display: none;
        }

        .player-section.visible {
            display: block;
        }

        #video-container {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            position: relative;
            background: #000;
        }

        #shaka-video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .player-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-header h2 {
            color: white;
            font-size: 1.5em;
        }

        .close-btn {
            background: rgba(255, 107, 107, 0.8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        .player-controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .player-info {
            flex: 1;
            min-width: 200px;
        }

        .player-info h3 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 1.3em;
        }

        .player-info p {
            color: #aaa;
            font-size: 0.9em;
        }

        .server-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .server-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .server-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .server-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .debug-console {
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .debug-console.visible {
            display: block;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px 20px 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer p {
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .last-updated {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .player-controls {
                flex-direction: column;
                align-items: flex-start;
            }

            .server-selector {
                width: 100%;
            }

            .server-btn {
                flex: 1;
                min-width: 100px;
            }

            .player-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 CnpTV</h1>
            <p>Premium Streaming Experience</p>
        </div>

        <!-- Announcement Banner -->
        <div class="announcement-banner" id="announcementBanner">
            <h3>📢 Service Update</h3>
            <p id="announcementText">Loading announcement...</p>
        </div>

        <!-- Error Banner -->
        <div id="errorBanner" class="error-banner"></div>

        <!-- Loading State -->
        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
            <p>Loading matches...</p>
        </div>

        <!-- Cards Section (Initially Visible) -->
        <div id="cardsSection" class="cards-section">
            <div id="matchesContainer" class="matches-grid"></div>
        </div>

        <!-- Player Section (Initially Hidden) -->
        <div id="playerSection" class="player-section">
            <div class="player-header">
                <h2 id="playerEventName">Loading...</h2>
                <button class="close-btn" id="closePlayerBtn">← Back to Matches</button>
            </div>
            <div id="video-container">
                <video id="shaka-video" controls></video>
            </div>
            <div class="player-controls">
                <div class="player-info">
                    <h3 id="currentEventName">Selected Match</h3>
                    <p id="currentEventId">Match ID</p>
                </div>
                <div class="server-selector" id="serverSelector">
                    <button class="server-btn active" data-server="amazon_server">Amazon</button>
                    <button class="server-btn" data-server="fastly_server">Fastly</button>
                    <button class="server-btn" data-server="cloudfront_server">CloudFront</button>
                </div>
            </div>
            <div class="debug-console" id="debugConsole"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 CnpTV. All rights reserved.</p>
            <p class="last-updated" id="lastUpdated">Last updated: Loading...</p>
        </div>
    </div>

    <script>
        let player;
        let currentData;
        let selectedServer = 'amazon_server';
        let currentMatch = null;
        let debugLogs = [];

        // Debug logging function
        function addDebugLog(message) {
            debugLogs.push(`[${new Date().toLocaleTimeString()}] ${message}`);
            const debugConsole = document.getElementById('debugConsole');
            debugConsole.innerHTML = debugLogs.slice(-10).join('<br>');
            console.log(message);
        }

        // Enable Shaka Player debug logging
        function initDebugLogging() {
            shaka.log.setLevel(shaka.log.Level.DEBUG);
            addDebugLog('Shaka Player debug logging enabled');
        }

        // Initialize Shaka Player with DRM config
        async function initShakaPlayer() {
            shaka.polyfill.installAll();
            addDebugLog('Shaka polyfills installed');

            if (shaka.util.Platform.supportsMediaSource()) {
                player = new shaka.Player(document.getElementById('shaka-video'));
                
                // Configure DRM
                configDRM();
                
                // Configure networking
                configureNetworking();
                
                setupPlayerEventListeners();
                addDebugLog('Shaka Player initialized successfully');
            } else {
                showError('Your browser does not support media playback.');
                addDebugLog('Browser does not support MediaSource API');
            }
        }

        // Configure DRM settings
        function configDRM() {
            const config = {
                drm: {
                    servers: {
                        'com.widevine.alpha': 'https://license.uat.widevine.com/cenc_cbcs/widevine_test_server/license_cbcs',
                        'com.microsoft.playready': 'https://test.playready.microsoft.com/service/rightsmanager.asmx?cfg=(am:http,shi:true)',
                    },
                    advanced: {
                        'com.widevine.alpha': {
                            'videoRobustness': 'SW_SECURE_CRYPTO',
                            'audioRobustness': 'SW_SECURE_CRYPTO'
                        }
                    }
                },
                streaming: {
                    bufferingGoal: 8,
                    retryParameters: {
                        maxAttempts: 4,
                        baseDelay: 1000,
                        backoffFactor: 2,
                        fuzzFactor: 0.5,
                        timeout: 30000
                    }
                }
            };

            try {
                player.configure(config);
                addDebugLog('DRM configuration applied');
            } catch (e) {
                addDebugLog('DRM config error: ' + e.message);
            }
        }

        // Configure networking to handle CORS
        function configureNetworking() {
            const netEngine = player.getNetworkingEngine();
            
            // Intercept requests to add headers
            netEngine.registerRequestFilter((type, request) => {
                // Add CORS headers to request
                request.headers = request.headers || {};
                request.headers['Access-Control-Allow-Credentials'] = 'true';
                
                addDebugLog(`Request: ${type} - ${request.uris[0]?.substring(0, 50)}...`);
            });

            // Response filter
            netEngine.registerResponseFilter((type, response) => {
                addDebugLog(`Response: ${type} - Status: ${response.status}`);
            });
        }

        // Setup player event listeners
        function setupPlayerEventListeners() {
            const video = document.getElementById('shaka-video');
            
            player.addEventListener('error', onPlayerError);
            player.addEventListener('buffering', (e) => {
                addDebugLog(e.buffering ? 'Buffering...' : 'Buffering complete');
            });
            
            video.addEventListener('play', () => addDebugLog('Video playing'));
            video.addEventListener('pause', () => addDebugLog('Video paused'));
            video.addEventListener('loadedmetadata', () => {
                addDebugLog(`Video loaded: ${video.duration}s duration`);
            });
            video.addEventListener('error', (e) => {
                addDebugLog('Video error: ' + e.target.error.message);
            });
        }

        // Handle player errors
        function onPlayerError(event) {
            const error = event.detail;
            const errorMsg = error.message || error.toString();
            addDebugLog('❌ Player error: ' + errorMsg);
            showError('Playback error: ' + errorMsg);
        }

        // Fetch data from JSON URL
        async function fetchData() {
            const loadingContainer = document.getElementById('loadingContainer');
            loadingContainer.style.display = 'block';

            try {
                addDebugLog('Fetching data from JSON endpoint...');
                const response = await fetch('https://sonujson-devloper.vercel.app/Data/prime.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                currentData = await response.json();
                addDebugLog(`✓ Data loaded: ${currentData.Matches?.length || 0} matches found`);
                
                displayAnnouncement();
                displayMatches();
            } catch (error) {
                addDebugLog('❌ Fetch error: ' + error.message);
                showError('Failed to load matches: ' + error.message);
            } finally {
                loadingContainer.style.display = 'none';
            }
        }

        // Display announcement
        function displayAnnouncement() {
            if (currentData.announcement) {
                document.getElementById('announcementText').textContent = currentData.announcement;
            }
            if (currentData.last_updated) {
                document.getElementById('lastUpdated').textContent = `Last updated: ${currentData.last_updated}`;
            }
        }

        // Display matches as cards
        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (!currentData.Matches || currentData.Matches.length === 0) {
                container.innerHTML = '<p style="color: white; grid-column: 1/-1; text-align: center;">No matches available</p>';
                return;
            }

            currentData.Matches.forEach((match, index) => {
                const card = createMatchCard(match, index);
                container.appendChild(card);
            });
        }

        // Create match card
        function createMatchCard(match, index) {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `
                <div class="match-image">
                    <img src="${match.image}" alt="${match.event_name}" onerror="this.style.display='none'">
                    <div class="match-play-icon">▶</div>
                </div>
                <div class="match-info">
                    <h3>${match.event_name}</h3>
                    <span class="match-id">${match.id}</span>
                </div>
            `;

            card.addEventListener('click', () => showPlayer(match));
            return card;
        }

        // Show player section and hide cards
        function showPlayer(match) {
            currentMatch = match;
            
            addDebugLog(`Loading: ${match.event_name}`);
            addDebugLog(`Match ID: ${match.id}`);
            
            // Hide cards, show player
            document.getElementById('cardsSection').classList.add('hidden');
            document.getElementById('playerSection').classList.add('visible');
            document.getElementById('debugConsole').classList.add('visible');

            // Update player info
            document.getElementById('playerEventName').textContent = match.event_name;
            document.getElementById('currentEventName').textContent = match.event_name;
            document.getElementById('currentEventId').textContent = `ID: ${match.id}`;

            // Reset server selector
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector('[data-server="amazon_server"]').classList.add('active');
            selectedServer = 'amazon_server';

            // Setup server buttons for player
            setupServerButtons();

            // Auto-play with default server
            playMatch(match, 'amazon_server');

            // Scroll to player
            setTimeout(() => {
                document.getElementById('playerSection').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        // Close player and return to cards
        function closePlayer() {
            document.getElementById('cardsSection').classList.remove('hidden');
            document.getElementById('playerSection').classList.remove('visible');
            document.getElementById('debugConsole').classList.remove('visible');

            // Pause video
            const video = document.getElementById('shaka-video');
            if (video) {
                video.pause();
            }

            // Clear debug logs
            debugLogs = [];

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Play selected match with DRM support
        async function playMatch(match, server = null) {
            if (!match) return;

            try {
                const serverToUse = server || selectedServer;
                const url = match.CnpTV[serverToUse];

                if (!url) {
                    showError('Selected server not available for this match');
                    addDebugLog(`❌ No URL for server: ${serverToUse}`);
                    return;
                }

                addDebugLog(`Attempting to load: ${serverToUse}`);
                addDebugLog(`URL: ${url.substring(0, 80)}...`);

                // Configure DRM key if available
                if (match.drm_key) {
                    const [kid, key] = match.drm_key.split(':');
                    addDebugLog(`DRM Key configured - KID: ${kid.substring(0, 16)}...`);
                    
                    try {
                        player.configure({
                            drm: {
                                servers: {
                                    'com.widevine.alpha': 'https://license.uat.widevine.com/cenc_cbcs/widevine_test_server/license_cbcs'
                                }
                            }
                        });
                    } catch (e) {
                        addDebugLog('DRM config attempt: ' + e.message);
                    }
                }

                // Load the stream
                addDebugLog('Loading manifest...');
                await player.load(url);
                
                addDebugLog('✓ Manifest loaded successfully');
                addDebugLog('Starting playback...');
                
                document.getElementById('shaka-video').play();
                addDebugLog('✓ Playback started');

            } catch (error) {
                const errorMsg = error.message || error.toString();
                addDebugLog('❌ Playback error: ' + errorMsg);
                showError('Failed to load stream: ' + errorMsg);
            }
        }

        // Setup server button listeners
        function setupServerButtons() {
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.onclick = null; // Remove previous listeners
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    selectedServer = e.target.dataset.server;
                    
                    if (currentMatch) {
                        playMatch(currentMatch, selectedServer);
                    }
                });
            });
        }

        // Show error message
        function showError(message) {
            const errorBanner = document.getElementById('errorBanner');
            errorBanner.innerHTML = '❌ ' + message;
            errorBanner.style.display = 'block';
            setTimeout(() => {
                errorBanner.style.display = 'none';
            }, 8000);
        }

        // Close button listener
        document.getElementById('closePlayerBtn').addEventListener('click', closePlayer);

        // Initialize on page load
        window.addEventListener('load', () => {
            initDebugLogging();
            initShakaPlayer();
            fetchData();
        });

        // Handle visibility change to pause/resume
        document.addEventListener('visibilitychange', () => {
            const video = document.getElementById('shaka-video');
            if (document.hidden) {
                video.pause();
                addDebugLog('Page hidden - video paused');
            } else {
                addDebugLog('Page visible');
            }
        });
    </script>
</body>
</html>
