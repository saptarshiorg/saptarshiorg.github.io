<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>TITU EV | Stream Player</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Shaka Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
  <!-- JW Player CDN (Backup) -->
  <script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>

  <style>
    :root {
      --orange: #ff5a1f;
      --orange-glow: rgba(255, 90, 31, 0.4);
      --glass-bg: rgba(12, 14, 18, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background-color: #050507; color: #fff;
      font-family: 'Satoshi', sans-serif; overflow: hidden;
    }

    /* Ambient Cinema Background Glow */
    .ambient-glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(255,90,31,0.12) 0%, rgba(5,5,7,1) 80%);
      pointer-events: none; z-index: 1;
    }

    /* Video Player Container */
    .ott-player-container {
      position: relative; width: 100vw; height: 100vh;
      background: #000; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
    }

    video {
      width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2;
    }

    /* OTT Controls Overlay Layer */
    .ott-overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.92) 100%);
      opacity: 1; transition: opacity 0.35s ease;
      pointer-events: auto;
    }

    .ott-overlay.hide-controls {
      opacity: 0; pointer-events: none; cursor: none;
    }

    /* Center Play/Rewind/Forward Buttons */
    .center-controls {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 32px;
      z-index: 25; pointer-events: auto;
    }

    .btn-circle-action {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(20, 24, 32, 0.6); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-circle-action:hover {
      background: var(--orange); border-color: var(--orange);
      transform: scale(1.12); box-shadow: 0 0 25px var(--orange-glow);
    }

    .btn-play-main {
      width: 76px; height: 76px;
      background: linear-gradient(135deg, #ff5a1f, #e0440b);
      border: none; box-shadow: 0 0 30px var(--orange-glow);
    }

    /* Seekbar Progress Slider */
    .seekbar-wrap {
      position: relative; width: 100%; height: 6px;
      background: rgba(255,255,255,0.2); cursor: pointer;
      border-radius: 4px; transition: height 0.15s ease;
    }
    .seekbar-wrap:hover { height: 10px; }

    .seekbar-fill {
      height: 100%; background: var(--orange);
      border-radius: 4px; width: 0%; position: relative;
      box-shadow: 0 0 10px var(--orange);
    }
    .seekbar-handle {
      position: absolute; right: -6px; top: 50%; transform: translateY(-50%) scale(0);
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      box-shadow: 0 0 10px var(--orange); transition: transform 0.15s ease;
    }
    .seekbar-wrap:hover .seekbar-handle { transform: translateY(-50%) scale(1); }

    /* OTT Flyout Menu Popup */
    .ott-menu-popup {
      position: absolute; bottom: 75px; right: 20px; z-index: 40;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 14px;
      padding: 12px; width: 200px; display: none; flex-direction: column; gap: 4px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    .ott-menu-popup.active { display: flex; animation: slideUp 0.2s ease; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ott-menu-item {
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; color: #cbd5e1; transition: all 0.2s;
    }
    .ott-menu-item:hover, .ott-menu-item.active {
      background: var(--orange); color: #fff; box-shadow: 0 0 12px var(--orange-glow);
    }

    #jw-player-container {
      position: fixed; inset: 0; z-index: 50; display: none; background: #000;
    }
  </style>
</head>
<body>

<div class="ott-player-container" id="playerContainer">
  <div class="ambient-glow"></div>

  <!-- Loading Screen -->
  <div id="loader" class="absolute inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center">
    <div class="w-16 h-16 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mb-4"></div>
    <div class="text-xs font-bold tracking-widest text-orange-500 uppercase animate-pulse">CONNECTING SECURE STREAM...</div>
  </div>

  <!-- Unmute Tap Overlay -->
  <button id="unmuteBtn" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[90] btn btn-danger rounded-full px-5 py-2.5 font-bold shadow-2xl animate-bounce">
    <span class="material-icons-round align-middle me-1">volume_off</span> TAP TO UNMUTE
  </button>

  <!-- VIDEO ELEMENT -->
  <video id="video" autoplay muted playsinline></video>

  <!-- OVERLAY CONTROLS -->
  <div class="ott-overlay" id="ottOverlay">
    
    <!-- TOP HEADER BAR -->
    <div class="p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-9 h-9 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white transition">
          <span class="material-icons-round text-lg">arrow_back</span>
        </a>
        <div>
          <h1 id="streamTitle" class="text-sm md:text-base font-extrabold tracking-wide m-0 text-white">LIVE STREAM</h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="flex items-center gap-1 text-[10px] font-extrabold bg-red-600/80 text-white px-2 py-0.5 rounded">
              <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span> LIVE
            </span>
            <span class="text-[11px] text-gray-400 font-semibold">1080p HD • ClearKey DRM</span>
          </div>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-3">
        <button id="switchPlayerBtn" class="bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/40 text-yellow-300 px-3 py-1.5 rounded-lg text-xs font-bold transition backdrop-blur-md">
          Switch Engine (JW)
        </button>
      </div>
    </div>

    <!-- CENTER PLAY / REWIND / FORWARD -->
    <div class="center-controls">
      <button class="btn-circle-action" id="btnRewind" title="Rewind 10s">
        <span class="material-icons-round text-2xl">replay_10</span>
      </button>

      <button class="btn-circle-action btn-play-main" id="btnCenterPlay" title="Play/Pause">
        <span class="material-icons-round text-4xl" id="centerPlayIcon">pause</span>
      </button>

      <button class="btn-circle-action" id="btnForward" title="Forward 10s">
        <span class="material-icons-round text-2xl">forward_10</span>
      </button>
    </div>

    <!-- BOTTOM CONTROL BAR -->
    <div class="p-4 md:p-6 flex flex-col gap-3">
      
      <!-- SEEKBAR -->
      <div class="seekbar-wrap" id="seekbar">
        <div class="seekbar-fill" id="seekFill">
          <div class="seekbar-handle"></div>
        </div>
      </div>

      <!-- CONTROLS ROW -->
      <div class="flex items-center justify-between text-white">
        
        <!-- Left Controls -->
        <div class="flex items-center gap-4">
          <button id="btnPlay" class="hover:text-orange-500 transition">
            <span class="material-icons-round text-2xl" id="playIcon">pause</span>
          </button>

          <!-- Volume -->
          <div class="flex items-center gap-2 group">
            <button id="btnMute" class="hover:text-orange-500 transition">
              <span class="material-icons-round text-2xl" id="volumeIcon">volume_up</span>
            </button>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" 
                   class="w-16 md:w-20 accent-orange-500 h-1 bg-white/20 rounded cursor-pointer opacity-80 group-hover:opacity-100 transition">
          </div>

          <!-- Time Display -->
          <div class="text-xs font-bold tracking-wide text-gray-300">
            <span id="currentTime">00:00</span> / <span id="duration">LIVE</span>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-3">
          
          <!-- Quality Button -->
          <button id="btnQuality" class="hover:text-orange-500 transition flex items-center gap-1 bg-white/10 px-2.5 py-1 rounded-lg text-xs font-bold border border-white/10">
            <span class="material-icons-round text-base">settings</span>
            <span id="qualityText">Auto</span>
          </button>

          <!-- Speed Button -->
          <button id="btnSpeed" class="hover:text-orange-500 transition flex items-center gap-1 bg-white/10 px-2.5 py-1 rounded-lg text-xs font-bold border border-white/10">
            <span id="speedText">1.0x</span>
          </button>

          <!-- PiP -->
          <button id="btnPip" class="hover:text-orange-500 transition hidden md:block">
            <span class="material-icons-round text-2xl">picture_in_picture_alt</span>
          </button>

          <!-- Fullscreen -->
          <button id="btnFullscreen" class="hover:text-orange-500 transition">
            <span class="material-icons-round text-2xl" id="fullscreenIcon">fullscreen</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- POPUP MENUS -->
  <div class="ott-menu-popup" id="qualityMenu">
    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 px-2">Video Quality</div>
    <div id="qualityList"></div>
  </div>

  <div class="ott-menu-popup" id="speedMenu">
    <div class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 px-2">Playback Speed</div>
    <div class="ott-menu-item active" onclick="setSpeed(1.0)">1.0x (Normal)</div>
    <div class="ott-menu-item" onclick="setSpeed(1.25)">1.25x</div>
    <div class="ott-menu-item" onclick="setSpeed(1.5)">1.5x</div>
    <div class="ott-menu-item" onclick="setSpeed(2.0)">2.0x</div>
  </div>

  <!-- BACKUP JW PLAYER CONTAINER -->
  <div id="jw-player-container"></div>
</div>

<script src="config.js"></script>

<script>
let currentPayload = null;
let activeServerType = "amazon_server";
let shakaPlayer = null;
let videoElem = null;
let isJwActive = false;
let controlsTimeout = null;

document.addEventListener("DOMContentLoaded", async () => {
  videoElem = document.getElementById("video");

  const rawPayload = sessionStorage.getItem("__EV_TITU_STREAM__");
  activeServerType = sessionStorage.getItem("__EV_TITU_SERVER__") || "amazon_server";

  if (!rawPayload) {
    alert("Session Expired. Returning to Dashboard.");
    window.location.href = "index.html";
    return;
  }

  try {
    currentPayload = JSON.parse(decodeURIComponent(escape(atob(rawPayload))));
    document.getElementById("streamTitle").textContent = currentPayload.name || "Live Stream";
  } catch(e) {
    window.location.href = "index.html";
    return;
  }

  initShakaEngine();
  setupUIEvents();
  setupKeyboardShortcuts();
});

function getStreamUrl() {
  const s = currentPayload.servers || {};
  return s[activeServerType] || s.amazon_server || s.cloudfront_server || s.akamai_server || "";
}

function parseDRM(drmStr) {
  if (!drmStr || !drmStr.includes(':')) return null;
  const parts = drmStr.split(':');
  let obj = {};
  obj[parts[0].trim().toLowerCase()] = parts[1].trim().toLowerCase();
  return obj;
}

// 1. SHAKA PLAYER INITIALIZATION
async function initShakaEngine() {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;

  shakaPlayer = new shaka.Player(videoElem);

  // Configure ClearKey DRM
  const parsedDrm = parseDRM(currentPayload.drm);
  if (parsedDrm) {
    shakaPlayer.configure({ drm: { clearKeys: parsedDrm } });
  }

  shakaPlayer.addEventListener('variantchanged', onQualityChanged);

  try {
    await shakaPlayer.load(getStreamUrl());
    document.getElementById("loader").style.display = "none";

    const playPromise = videoElem.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        if (videoElem.muted) showUnmuteBtn();
      }).catch(() => showUnmuteBtn());
    }

    populateQualityMenu();
  } catch (err) {
    console.error("Shaka error:", err);
    document.getElementById("loader").style.display = "none";
    togglePlayerEngine();
  }
}

// 2. CONTROLS & EVENT BINDINGS
function setupUIEvents() {
  const overlay = document.getElementById("ottOverlay");
  const container = document.getElementById("playerContainer");

  // Auto-hide Controls
  const resetInactivity = () => {
    overlay.classList.remove("hide-controls");
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
      if (!videoElem.paused) overlay.classList.add("hide-controls");
    }, 3500);
  };

  container.addEventListener("mousemove", resetInactivity);
  container.addEventListener("touchstart", resetInactivity);

  // Play / Pause Toggles
  const togglePlay = () => {
    if (videoElem.paused) {
      videoElem.play();
      updatePlayIcons(true);
    } else {
      videoElem.pause();
      updatePlayIcons(false);
    }
  };

  document.getElementById("btnPlay").onclick = togglePlay;
  document.getElementById("btnCenterPlay").onclick = togglePlay;

  // 10s Rewind & Forward
  document.getElementById("btnRewind").onclick = () => { videoElem.currentTime -= 10; };
  document.getElementById("btnForward").onclick = () => { videoElem.currentTime += 10; };

  // Volume & Mute
  const volumeSlider = document.getElementById("volumeSlider");
  const btnMute = document.getElementById("btnMute");

  volumeSlider.oninput = (e) => {
    videoElem.volume = e.target.value;
    videoElem.muted = e.target.value == 0;
    updateVolumeIcon();
  };

  btnMute.onclick = () => {
    videoElem.muted = !videoElem.muted;
    updateVolumeIcon();
  };

  // Video Time Update & Seekbar
  videoElem.addEventListener("timeupdate", () => {
    if (!videoElem.duration) return;
    const pct = (videoElem.currentTime / videoElem.duration) * 100;
    document.getElementById("seekFill").style.width = pct + "%";
    document.getElementById("currentTime").textContent = formatTime(videoElem.currentTime);
    if (isFinite(videoElem.duration)) {
      document.getElementById("duration").textContent = formatTime(videoElem.duration);
    }
  });

  // Seekbar Clicking
  document.getElementById("seekbar").onclick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    videoElem.currentTime = pos * videoElem.duration;
  };

  // Fullscreen Toggle
  document.getElementById("btnFullscreen").onclick = toggleFullscreen;

  // Menus Toggle
  document.getElementById("btnQuality").onclick = (e) => {
    e.stopPropagation();
    toggleMenu("qualityMenu");
  };

  document.getElementById("btnSpeed").onclick = (e) => {
    e.stopPropagation();
    toggleMenu("speedMenu");
  };

  document.addEventListener("click", () => {
    document.getElementById("qualityMenu").classList.remove("active");
    document.getElementById("speedMenu").classList.remove("active");
  });

  // Switch Engine Button
  document.getElementById("switchPlayerBtn").onclick = togglePlayerEngine;
}

function updatePlayIcons(isPlaying) {
  const icon = isPlaying ? "pause" : "play_arrow";
  document.getElementById("playIcon").textContent = icon;
  document.getElementById("centerPlayIcon").textContent = icon;
}

function updateVolumeIcon() {
  const icon = document.getElementById("volumeIcon");
  if (videoElem.muted || videoElem.volume === 0) icon.textContent = "volume_off";
  else if (videoElem.volume < 0.5) icon.textContent = "volume_down";
  else icon.textContent = "volume_up";
}

function toggleFullscreen() {
  const container = document.getElementById("playerContainer");
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => console.error(err));
    document.getElementById("fullscreenIcon").textContent = "fullscreen_exit";
  } else {
    document.exitFullscreen();
    document.getElementById("fullscreenIcon").textContent = "fullscreen";
  }
}

// 3. QUALITY SELECTOR MENU
function populateQualityMenu() {
  if (!shakaPlayer) return;
  const list = document.getElementById("qualityList");
  list.innerHTML = "";

  const tracks = shakaPlayer.getVariantTracks();
  const sorted = tracks.sort((a,b) => b.height - a.height);
  
  // Auto Option
  const autoItem = document.createElement("div");
  autoItem.className = "ott-menu-item active";
  autoItem.textContent = "Auto (Recommended)";
  autoItem.onclick = () => {
    shakaPlayer.configure({ abr: { enabled: true } });
    document.getElementById("qualityText").textContent = "Auto";
    highlightActiveQuality(autoItem);
  };
  list.appendChild(autoItem);

  let addedHeights = new Set();
  sorted.forEach(track => {
    if (track.height && !addedHeights.has(track.height)) {
      addedHeights.add(track.height);
      const item = document.createElement("div");
      item.className = "ott-menu-item";
      item.textContent = `${track.height}p HD`;
      item.onclick = () => {
        shakaPlayer.configure({ abr: { enabled: false } });
        shakaPlayer.selectVariantTrack(track, true);
        document.getElementById("qualityText").textContent = track.height + "p";
        highlightActiveQuality(item);
      };
      list.appendChild(item);
    }
  });
}

function highlightActiveQuality(activeItem) {
  document.querySelectorAll("#qualityList .ott-menu-item").forEach(el => el.classList.remove("active"));
  activeItem.classList.add("active");
  document.getElementById("qualityMenu").classList.remove("active");
}

function onQualityChanged() {
  if (!shakaPlayer) return;
  const tracks = shakaPlayer.getVariantTracks();
  const active = tracks.find(t => t.active);
  if (active && active.height) {
    console.log("Current Quality:", active.height + "p");
  }
}

function toggleMenu(menuId) {
  const menu = document.getElementById(menuId);
  const isVis = menu.classList.contains("active");
  document.querySelectorAll(".ott-menu-popup").forEach(m => m.classList.remove("active"));
  if (!isVis) menu.classList.add("active");
}

function setSpeed(spd) {
  videoElem.playbackRate = spd;
  document.getElementById("speedText").textContent = spd + "x";
  document.getElementById("speedMenu").classList.remove("active");
}

function formatTime(sec) {
  if (isNaN(sec)) return "00:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function showUnmuteBtn() {
  const btn = document.getElementById("unmuteBtn");
  btn.classList.remove("hidden");
  btn.onclick = () => {
    videoElem.muted = false;
    videoElem.play();
    btn.classList.add("hidden");
    updateVolumeIcon();
  };
}

// 4. KEYBOARD SHORTCUTS
function setupKeyboardShortcuts() {
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); document.getElementById("btnPlay").click(); }
    else if (e.code === "ArrowLeft") { videoElem.currentTime -= 10; }
    else if (e.code === "ArrowRight") { videoElem.currentTime += 10; }
    else if (e.code === "KeyF") { toggleFullscreen(); }
    else if (e.code === "KeyM") { document.getElementById("btnMute").click(); }
  });
}

// 5. JW PLAYER BACKUP SWITCH
function togglePlayerEngine() {
  const jwWrap = document.getElementById("jw-player-container");
  const btn = document.getElementById("switchPlayerBtn");

  if (!isJwActive) {
    jwWrap.style.display = "block";
    btn.textContent = "Switch Engine (Shaka)";
    isJwActive = true;
    initJWPlayer();
  } else {
    jwWrap.style.display = "none";
    btn.textContent = "Switch Engine (JW)";
    isJwActive = false;
  }
}

function initJWPlayer() {
  jwplayer.key = CONFIG.JW_KEY;
  const parsedDrm = parseDRM(currentPayload.drm);
  let jwDrmObj = {};
  if (parsedDrm) {
    const keyId = Object.keys(parsedDrm)[0];
    jwDrmObj = { clearkey: { keyId: keyId, key: parsedDrm[keyId] } };
  }

  jwplayer("jw-player-container").setup({
    file: getStreamUrl(),
    drm: jwDrmObj,
    width: "100%", height: "100%",
    autostart: true, stretching: "uniform"
  });
}

// ANTI-EXTRACT SECURITY TRAPS
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e) {
  if (e.keyCode == 123) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
};
setInterval(() => { console.clear(); }, 1000);
</script>

</body>
</html>
