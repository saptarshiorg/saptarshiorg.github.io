<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Channels — Index & Embedded Player</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#071126;--card:#0f1724;--muted:#9fb0c6;--accent:#60a5fa}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#031224 0%, #071126 100%);color:#e6eef8}
    .app{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;height:100vh;box-sizing:border-box}
    .panel{background:rgba(255,255,255,0.02);border-radius:8px;padding:12px;overflow:auto}
    .search{display:flex;gap:8px;margin-bottom:10px}
    .search input{flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .controls button{padding:6px 10px;border-radius:6px;border:0;background:var(--accent);color:#04203a;cursor:pointer}
    .controls button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .card{display:flex;gap:8px;align-items:center;padding:8px;background:rgba(255,255,255,0.01);border-radius:6px;cursor:pointer;transition:transform .12s}
    .card:hover{transform:translateY(-3px)}
    .card img{width:64px;height:44px;object-fit:contain;border-radius:4px;background:#071022;padding:4px}
    .card .meta{flex:1}
    .card .meta .name{font-weight:700}
    .card .meta .cat{color:var(--muted);font-size:13px}
    /* player pane */
    .player-wrap{display:flex;flex-direction:column;gap:10px}
    .video-box{background:#000;border-radius:8px;overflow:hidden;position:relative;padding-top:56.25%}
    video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}
    .player-info{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .player-info .title{font-size:18px;font-weight:800}
    .player-info .sub{color:var(--muted)}
    .player-actions{display:flex;gap:8px;align-items:center}
    .btn{padding:6px 10px;border-radius:6px;border:0;background:var(--accent);color:#04203a;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .track-list{max-height:160px;overflow:auto;background:rgba(255,255,255,0.02);padding:8px;border-radius:6px}
    .small{font-size:13px;color:var(--muted)}
    footer.small{opacity:.9;margin-top:6px}
    @media (max-width:900px){.app{grid-template-columns:1fr;grid-auto-rows:auto;height:100%}.panel{order:2}}
  </style>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/shaka-player.compiled.js"></script>
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Channel list">
      <div class="search">
        <input id="q" placeholder="Search channels (name, category, id)..." />
        <button id="reload" class="btn">Reload</button>
      </div>
      <div class="controls">
        <div class="small">Channels</div>
        <div style="flex:1"></div>
        <button id="openPopup" class="btn ghost">Open Selected in Popup</button>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </aside>

    <main class="panel player-wrap" aria-label="Player">
      <div class="player-info">
        <div>
          <div class="title" id="title">Select a channel</div>
          <div class="sub" id="subtitle">Channel metadata will appear here</div>
        </div>
        <div class="player-actions">
          <button id="playPause" class="btn ghost">Play</button>
          <button id="mute" class="btn ghost">Mute</button>
          <button id="autoQuality" class="btn ghost">Auto</button>
          <button id="highQuality" class="btn">HD</button>
        </div>
      </div>

      <div class="video-box" id="videoBox">
        <video id="video" controls playsinline></video>
      </div>

      <div>
        <div class="small">Available variant tracks</div>
        <div id="tracks" class="track-list small">No channel loaded</div>
      </div>

      <footer class="small">Source: jtv.json — ClearKey and Cookie injection are applied per JSON entry. If playback fails due to CORS/cookie restrictions, use a proxy.</footer>
    </main>
  </div>

<script>
(async function(){
  // CONFIG: change this if your JSON location differs
  const JSON_URL = 'https://raw.githubusercontent.com/SSK4570live/TV-/refs/heads/main/jtv.json';

  // DOM
  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const reloadBtn = document.getElementById('reload');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const video = document.getElementById('video');
  const tracksEl = document.getElementById('tracks');
  const playPause = document.getElementById('playPause');
  const muteBtn = document.getElementById('mute');
  const autoQualityBtn = document.getElementById('autoQuality');
  const highQualityBtn = document.getElementById('highQuality');
  const openPopupBtn = document.getElementById('openPopup');

  // Shaka init
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    alert('Shaka Player not supported in this browser.');
    return;
  }
  const player = new shaka.Player(video);
  const netEngine = player.getNetworkingEngine();

  // We'll inject Cookie header for requests when per-channel cookie is set.
  let currentCookie = null;
  netEngine.registerRequestFilter((type, request) => {
    // Add cookie header for manifest/segment/license requests.
    if (currentCookie && request.uris && request.uris.length) {
      request.headers['Cookie'] = currentCookie;
      // If your CDN expects Referer or other headers you can add them here too.
    }
  });

  // Helper: hex -> base64url
  function hexToBase64Url(hex) {
    if (!hex) return '';
    hex = String(hex).replace(/^0x/, '');
    if (hex.length % 2) hex = '0' + hex;
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i*2,2), 16);
    let binary = '';
    for (let b of bytes) binary += String.fromCharCode(b);
    const b64 = btoa(binary);
    return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  // Load JSON
  let channels = [];
  async function loadJson() {
    grid.innerHTML = '<div class="small">Loading...</div>';
    try {
      const res = await fetch(JSON_URL);
      if (!res.ok) throw new Error('Failed to fetch JSON: ' + res.status);
      channels = await res.json();
      renderGrid(channels);
    } catch (err) {
      grid.innerHTML = '<div class="small">Error loading channels: ' + err.message + '</div>';
      console.error(err);
    }
  }

  // Render
  function renderGrid(list) {
    grid.innerHTML = '';
    if (!list || !list.length) {
      grid.innerHTML = '<div class="small">No channels</div>';
      return;
    }
    for (const ch of list) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = ch.id;
      card.innerHTML = `
        <img src="${ch.logo || ''}" alt="${escapeHtml(ch.name)} logo"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=200 height=110><rect width=100% height=100% fill=%23071a2b></rect><text x=10 y=55 font-size=12 fill=%23fff>${encodeURIComponent(ch.name ? ch.name.substr(0,18) : 'NoName')}</text></svg>'">
        <div class="meta">
          <div class="name">${escapeHtml(ch.name)}</div>
          <div class="cat">${escapeHtml(ch.category || '')} • ID: ${escapeHtml(ch.id)}</div>
        </div>
      `;
      card.addEventListener('click', () => {
        // select in-page player
        selectChannel(ch);
        // mark selection visually
        document.querySelectorAll('.card').forEach(c => c.style.outline = '');
        card.style.outline = '2px solid rgba(96,165,250,0.25)';
      });
      card.addEventListener('dblclick', () => {
        // double-click to open separate player window
        openPlayerWindow(ch);
      });
      grid.appendChild(card);
    }
  }

  // Simple html escape
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // Search
  q.addEventListener('input', () => {
    const term = q.value.trim().toLowerCase();
    if (!term) return renderGrid(channels);
    renderGrid(channels.filter(c =>
      (c.name||'').toLowerCase().includes(term) ||
      (c.category||'').toLowerCase().includes(term) ||
      (String(c.id)||'').includes(term)
    ));
  });
  reloadBtn.addEventListener('click', loadJson);

  // State
  let currentChannel = null;
  let qualityMode = 'auto'; // 'auto' or 'high'

  // Select and play in embedded player
  async function selectChannel(ch) {
    currentChannel = ch;
    titleEl.textContent = ch.name || 'Unnamed channel';
    subtitleEl.textContent = `${ch.category || 'Unknown'} • id: ${ch.id}`;
    tracksEl.textContent = 'Loading manifest & tracks...';
    currentCookie = (ch.cookie && ch.cookie !== 'null') ? ch.cookie : null;

    // Clear any previous DRM config
    player.configure({ drm: { clearKeys: {} } });

    // Determine clearkey/keyId
    let kidHex = null, keyHex = null;
    if (ch.clearkey && ch.clearkey !== 'null:null') {
      const parts = ch.clearkey.split(':');
      if (parts.length >= 2) {
        kidHex = parts[0] && parts[0] !== 'null' ? parts[0] : null;
        keyHex = parts[1] && parts[1] !== 'null' ? parts[1] : null;
      }
    } else if (ch.keyId && ch.key && ch.keyId !== 'null' && ch.key !== 'null') {
      kidHex = ch.keyId;
      keyHex = ch.key;
    }

    // Configure ClearKey if present
    if (kidHex && keyHex) {
      try {
        const kidB64url = hexToBase64Url(kidHex);
        const keyB64url = hexToBase64Url(keyHex);
        const clearKeys = {};
        clearKeys[kidB64url] = keyB64url;
        player.configure({ drm: { clearKeys } });
        console.log('Configured ClearKey:', clearKeys);
      } catch (e) {
        console.warn('ClearKey conversion error', e);
      }
    }

    // Load the manifest
    try {
      await player.load(ch.url);
      subtitleEl.textContent = `${ch.category || 'Unknown'} • Playing: ${ch.url}`;
      updateTrackList();
      if (qualityMode === 'high') await enforceHighQuality();
      try { await video.play(); } catch(e){ /* autoplay blocked */ }
    } catch (err) {
      console.error('Playback load error', err);
      tracksEl.textContent = 'Playback failed: ' + (err.message || err);
    }
  }

  // Update track listing UI
  function updateTrackList() {
    const tracks = player.getVariantTracks() || [];
    if (!tracks.length) {
      tracksEl.textContent = 'No variant tracks available';
      return;
    }
    // sort by bandwidth desc
    tracks.sort((a,b)=> (b.bandwidth||0)-(a.bandwidth||0));
    tracksEl.innerHTML = tracks.map((t,idx)=> {
      const res = t.height ? `${t.width || '?'}x${t.height}` : 'audio-only';
      const bw = t.bandwidth ? Math.round(t.bandwidth/1000)+' kbps' : '';
      const codecs = t.codecs || '';
      return `<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid rgba(255,255,255,0.02)">
                <div><strong>#${idx+1}</strong> ${res} ${codecs ? ' • '+codecs : ''}</div>
                <div style="color:var(--muted)">${bw}</div>
              </div>`;
    }).join('');
  }

  // Choose highest quality variant and lock it
  async function enforceHighQuality(){
    const tracks = player.getVariantTracks() || [];
    if (!tracks.length) return;
    const videoTracks = tracks.filter(t => t.height || t.videoId !== undefined);
    let best = null;
    if (videoTracks.length) {
      best = videoTracks.reduce((a,b) => {
        const ah = a.height || 0, bh = b.height || 0;
        if (bh !== ah) return bh > ah ? b : a;
        return (b.bandwidth || 0) > (a.bandwidth || 0) ? b : a;
      });
    } else {
      best = tracks.reduce((a,b) => (b.bandwidth||0) > (a.bandwidth||0) ? b : a);
    }
    if (best) {
      try {
        player.configure('abr.enabled', false);
        player.selectVariantTrack(best, /* clearBuffer */ true);
        updateTrackList();
      } catch (e) {
        console.warn('Selecting high-quality failed', e);
      }
    }
  }

  // Quality buttons
  autoQualityBtn.addEventListener('click', () => {
    qualityMode = 'auto';
    autoQualityBtn.classList.remove('ghost');
    highQualityBtn.classList.add('ghost');
    player.configure('abr.enabled', true);
    if (currentChannel) subtitleEl.textContent = `${currentChannel.category || 'Unknown'} • Playing (Auto)`;
  });
  highQualityBtn.addEventListener('click', async () => {
    qualityMode = 'high';
    highQualityBtn.classList.remove('ghost');
    autoQualityBtn.classList.add('ghost');
    if (currentChannel) {
      await enforceHighQuality();
      subtitleEl.textContent = `${currentChannel.category || 'Unknown'} • Playing (HD)`;
    }
  });

  // Play/pause & mute
  playPause.addEventListener('click', ()=> {
    if (video.paused) video.play();
    else video.pause();
    playPause.textContent = video.paused ? 'Play' : 'Pause';
  });
  video.addEventListener('play', ()=> playPause.textContent = 'Pause');
  video.addEventListener('pause', ()=> playPause.textContent = 'Play');

  muteBtn.addEventListener('click', ()=> {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
  });

  // Open separate player window (player.html) with channel id as query param
  function openPlayerWindow(ch) {
    // encode channel id (use id field)
    const url = new URL(window.location.href);
    const base = url.origin + url.pathname.replace(/\/[^/]*$/, '/player.html');
    // player.html expects ?id=<channel id>&json=<json url> (json optional, defaults to same JSON_URL)
    const target = `${base}?id=${encodeURIComponent(ch.id)}&json=${encodeURIComponent(JSON_URL)}`;
    window.open(target, '_blank', 'width=1000,height=700');
  }
  openPopupBtn.addEventListener('click', () => {
    if (!currentChannel) return alert('Select a channel first (click a card).');
    openPlayerWindow(currentChannel);
  });

  // Auto load JSON and select first playable channel
  await loadJson();
  if (channels && channels.length) {
    // pick first one that looks like an mpd or m3u8
    const first = channels.find(c => c.url && (c.url.includes('.mpd') || c.url.includes('.m3u8'))) || channels[0];
    if (first) {
      // select but don't mark visually
      selectChannel(first);
    }
  }

  // Expose helper to open popup via double-click on card as well (already set above)
})();
</script>
</body>
</html>
