<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player · EVORA</title><link rel="icon" href="evora-icon.png">
<style>
:root{--bg:#07070b;--card:#13131a;--line:rgba(255,255,255,.1);--ink:#f2f4f8;--mute:#9aa0ad;--acc:#ff14a0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;overflow:hidden;padding-left:72px}
nav{position:fixed;left:12px;top:16px;width:48px;background:#000;border:1px solid var(--line);border-radius:24px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
nav img{width:28px;margin-bottom:6px}
nav a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#c9ccd4;text-decoration:none;font-size:11px}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{height:100vh;display:flex;flex-direction:column;padding:14px 16px 14px 8px;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.bar h1{font-size:15px;font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
button,select,input{font:inherit;color:var(--ink);background:#1b1b24;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
input{width:64px;cursor:text}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{border-color:#fff5}
.stage{flex:1;min-height:0;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
iframe{width:100%;height:100%;border:0;display:block}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.lbl{color:var(--mute);font-size:12px}
@media(max-width:700px){body{padding-left:0}nav{display:none}main{padding:8px}.bar h1{max-width:100%;width:100%}}
</style></head><body>
<nav>
  <img src="evora-mark.png" alt="">
  <a href="/" title="Home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></a>
  <a href="/movies" title="Movies"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12.5h18M6.5 8 9 3.5M12 8l2.5-4.5"/></svg></a>
  <a href="/tv" title="TV Shows"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg></a>
  <a href="/live" title="Live TV"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg></a>
  <a href="/sports" title="Sports"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></a>
</nav>
<main>
  <div class="bar">
    <h1 id="ttl">Player</h1>
    <span class="lbl" id="epbox" hidden>S <input id="s" type="number" min="1" value="1"> E <input id="e" type="number" min="1" value="1">
      <button id="prev">◀</button><button id="next">▶</button></span>
    <span id="servers" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    <button id="fs">⛶ Fullscreen</button>
    <button id="reload">↻</button>
  </div>
  <div class="stage" id="stage"><div class="msg" id="msg">Loading…</div></div>
  <div class="bar" id="manual" hidden>
    <select id="mt"><option value="movie">Movie</option><option value="tv">TV Show</option><option value="live">Live TV</option><option value="sport">Sports</option></select>
    <input id="mid" placeholder="TMDB / IMDb / channel id" style="width:240px">
    <button id="go" class="on">Play</button>
  </div>
</main>
<script>
/* ===== Player servers — add / edit here =====
   Every server builds an iframe URL from {type,id,s,e}. Return null if it can't play that type. */
var EMBED = 'https://vaplayer.ru';      /* same base as EV_CONFIG.VIDAPI_EMBED */
var PULSE = 'https://evstreams.pages.dev/embed'; /* StreamPulse / live channel + sports embed */
var SERVERS = [
  { id:'ev',    name:'EV Stream', build:function(t,i,s,e){
      if(t==='movie') return EMBED+'/embed/movie/'+i;
      if(t==='tv')    return EMBED+'/embed/tv/'+i+'/'+s+'/'+e;
      return null; } },
  { id:'pulse', name:'EV Pulse', build:function(t,i){
      if(t==='live' || t==='sport') return PULSE+'?id='+encodeURIComponent(i);
      return null; } },
  { id:'raw',   name:'Direct URL', build:function(t,i){ return /^https?:\/\//i.test(i) ? i : null; } }
];
var q = new URLSearchParams(location.search);
var st = { type:q.get('type')||'', id:q.get('id')||'', s:+q.get('s')||1, e:+q.get('e')||1, server:q.get('server')||'', title:q.get('title')||'' };
var $ = function(x){ return document.getElementById(x); };

function avail(){ return SERVERS.filter(function(v){ return v.build(st.type, st.id, st.s, st.e); }); }
function sync(){
  var p = new URLSearchParams({ type:st.type, id:st.id, server:st.server });
  if(st.type==='tv'){ p.set('s',st.s); p.set('e',st.e); }
  if(st.title) p.set('title',st.title);
  history.replaceState(null,'','?'+p);
}
function render(){
  var list = avail();
  $('manual').hidden = !!(st.type && st.id);
  $('epbox').hidden = st.type!=='tv';
  $('s').value = st.s; $('e').value = st.e;
  $('ttl').textContent = st.title || (st.id ? ({movie:'Movie',tv:'TV Show',live:'Live TV',sport:'Sports'}[st.type]||'Player')+' · '+st.id : 'Player');
  document.title = $('ttl').textContent + ' · EVORA';
  var box = $('servers'); box.innerHTML='';
  if(!list.length){ $('stage').innerHTML='<div class="msg">Enter a type and ID below — or open a title from Movies, TV, Live TV or Sports.</div>'; return; }
  if(!list.some(function(v){return v.id===st.server;})) st.server = list[0].id;
  list.forEach(function(v){
    var b=document.createElement('button'); b.textContent=v.name; b.className=v.id===st.server?'on':'';
    b.onclick=function(){ st.server=v.id; render(); }; box.appendChild(b);
  });
  var url = list.filter(function(v){return v.id===st.server;})[0].build(st.type,st.id,st.s,st.e);
  $('stage').innerHTML='<iframe allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer" src="'+url.replace(/"/g,'&quot;')+'"></iframe>';
  sync();
}
function ep(d){ st.e=Math.max(1,st.e+d); render(); }
$('prev').onclick=function(){ ep(-1); }; $('next').onclick=function(){ ep(1); };
$('s').onchange=function(){ st.s=Math.max(1,+this.value||1); st.e=1; render(); };
$('e').onchange=function(){ st.e=Math.max(1,+this.value||1); render(); };
$('reload').onclick=render;
$('fs').onclick=function(){ var f=$('stage'); (f.requestFullscreen||f.webkitRequestFullscreen).call(f); };
$('go').onclick=function(){
  var raw=$('mid').value.trim(); if(!raw) return;
  var m=raw.match(/tt\d{5,}/i); st.type=$('mt').value; st.id=m?m[0].toLowerCase():raw; st.server=''; render();
};
$('mid').onkeydown=function(e){ if(e.key==='Enter') $('go').click(); };
render();
</script></body></html>
